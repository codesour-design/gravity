<html lang="it">
<head>

  <!-- Google Maps -->

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      background: #F5F5F5;
      font-size: 14px;
      line-height: 1.5714;
    }

    /* ── App shell ── */
    .app-shell { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ── Navbar ── */
    /* ── Workspace (below navbar) ── */
    .ooh-workspace {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      gap: 12px; padding: 16px;
      background: #F5F5F5;
      overflow: hidden;
    }

    /* ── Search card (top) ── */
    .ooh-search-card {
      background: #fff;
      border-radius: 0 8px 8px 8px;
      border: 1px solid #F0F0F0;
      flex-shrink: 0;
      align-self: stretch;
      display: flex;
      flex-direction: column;
    }
    .ooh-search-area {
      padding: 14px 20px 12px;
      display: flex; flex-direction: column; gap: 10px;
      flex: 1;
    }
    .ss-search-bar { display: flex; gap: 12px; align-items: center; position: relative; }

    /* ── Unified search bar (from planning) ── */
    .ss-searchbar-wrap { position: relative; flex: 1; min-width: 0; }
    .ss-unified-bar {
      display: flex; align-items: stretch;
      height: 52px;
      border: 1.5px solid #E0E0E0; border-radius: 10px;
      background: #fff; overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .ss-unified-bar:focus-within {
      border-color: #3E00FB;
      box-shadow: 0 0 0 3px rgba(62,0,251,0.08);
    }
    .ss-bar-input {
      flex: 1; min-width: 0;
      display: flex; align-items: center; cursor: text;
    }
    .ss-bar-sep {
      width: 1px; background: #EBEBEB; flex-shrink: 0;
      align-self: stretch; margin: 10px 0;
    }
    .ss-bar-trigger {
      display: flex; align-items: center; gap: 6px;
      padding: 0 16px;
      font-size: 13px; font-weight: 500; color: rgba(0,0,0,0.55);
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
      border: none; background: none;
      transition: background 0.15s, color 0.15s;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
    }
    .ss-bar-trigger:hover { background: rgba(0,0,0,0.025); color: rgba(0,0,0,0.88); }
    .ss-bar-trigger.active { color: #3E00FB; }
    .ss-bar-count {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 18px; height: 18px; border-radius: 9px;
      background: #3E00FB; color: #fff;
      font-size: 10px; font-weight: 700; padding: 0 5px; line-height: 1;
    }
    .ss-bar-cerca {
      display: flex; align-items: center; gap: 6px; padding: 0 20px;
      background: none; color: rgba(0,0,0,0.88);
      font-size: 13px; font-weight: 600;
      cursor: pointer; border: none; flex-shrink: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      transition: background 0.15s;
    }
    .ss-bar-cerca:hover { background: rgba(0,0,0,0.04); }
    .ss-tag-input-area {
      display: flex; align-items: center; flex-wrap: nowrap; gap: 6px;
      padding: 0 14px; height: 100%;
      flex: 1; min-width: 0;
      overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
    }
    .ss-tag-input-area::-webkit-scrollbar { display: none; }
    .ss-input-tag {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px 4px 12px; border-radius: 6px;
      background: #fff; border: 1px solid #D9D9D9;
      font-size: 13px; color: rgba(0,0,0,0.88); font-weight: 400;
      white-space: nowrap; flex-shrink: 0; line-height: 1.5;
    }
    .ss-input-tag-x {
      cursor: pointer; font-size: 14px; line-height: 1; color: rgba(0,0,0,0.35);
      display: flex; align-items: center; padding: 0 2px; border-radius: 3px;
    }
    .ss-input-tag-x:hover { color: rgba(0,0,0,0.75); background: rgba(0,0,0,0.06); }
    .ss-tag-real-input {
      border: none; outline: none; background: transparent;
      font-size: 14px; min-width: 160px; flex: 1;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      color: rgba(0,0,0,0.88); height: 100%; padding: 0 2px;
    }
    .ss-tag-real-input::placeholder { color: rgba(0,0,0,0.3); }


    /* Brief chips */
    .ss-brief-chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .ss-brief-label {
      font-size: 11px; color: rgba(0,0,0,0.35); font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px;
      white-space: nowrap; margin-right: 2px;
    }
    .ss-brief-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 12px;
      border: 1px solid #E8E8E8; font-size: 12px;
      color: rgba(0,0,0,0.65); cursor: pointer;
      background: #FAFAFA; transition: all 0.15s; user-select: none;
    }
    .ss-brief-chip:hover { border-color: #3E00FB; color: #3E00FB; background: #F0EAFF; }
    .ss-brief-chip.active { border-color: #3E00FB; color: #3E00FB; background: #F0EAFF; font-weight: 600; }

    /* ── Suggestions dropdown ── */
    .ss-suggestions-wrap {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: #fff; border: 1px solid #E8E8E8; border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.12); z-index: 600;
      overflow: hidden;
    }
    .ss-sugg-group-title {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; color: rgba(0,0,0,0.3);
      padding: 10px 14px 3px; line-height: 1.2;
    }
    .ss-suggestion-item {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 14px; cursor: pointer;
      font-size: 13px; color: rgba(0,0,0,0.88);
      transition: background 0.1s;
    }
    .ss-suggestion-item:hover { background: #F7F5FF; }
    .ss-zone-active-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 6px 0;
    }
    .ss-zone-active-tag {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 10px 2px 8px; border-radius: 12px;
      background: #F0EAFF; border: 1px solid #C5B4FF;
      font-size: 12px; color: #3E00FB; font-weight: 500; cursor: default;
    }
    .ss-zone-active-tag .clear-btn {
      margin-left: 4px; cursor: pointer; font-size: 11px;
      color: #3E00FB; opacity: 0.6; line-height: 1;
    }
    .ss-zone-active-tag .clear-btn:hover { opacity: 1; }

    /* ── Active filter chips strip ── */
    .ss-active-filters {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      padding: 0 2px;
    }
    .ss-filter-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 8px 3px 10px; border-radius: 20px;
      border: 1px solid #C5B4FF; background: #F0EAFF;
      font-size: 12px; color: #3E00FB; font-weight: 500;
      white-space: nowrap; user-select: none;
    }
    .ss-filter-chip-x {
      cursor: pointer; font-size: 13px; line-height: 1; color: #3E00FB;
      opacity: 0.5; display: flex; align-items: center;
      padding: 0 2px; border-radius: 3px;
    }
    .ss-filter-chip-x:hover { opacity: 1; background: rgba(62,0,251,0.1); }

    /* ── Tab bar above search card ── */
    .ss-tab-bar { display: flex; align-items: flex-end; gap: 2px; }
    .ss-tab-btn {
      height: 40px; padding: 0 16px;
      border: none; border-radius: 6px 6px 0 0;
      font-size: 14px; line-height: 22px;
      cursor: pointer; white-space: nowrap;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      background: transparent; color: rgba(0,0,0,0.88); font-weight: 400;
      transition: background 0.15s, color 0.15s;
    }
    .ss-tab-btn.active { background: #fff; color: #3E00FB; font-weight: 600; }
    .ss-tab-btn:not(.active):hover { background: rgba(0,0,0,0.04); }

    /* ── Map area ── */
    .ooh-map-area {
      flex: 1; min-height: 0; position: relative; overflow: hidden;
      border-radius: 8px;
    }
    #ooh-map { width: 100%; height: 100%; }

    /* Google Maps overrides */
    .gm-style .gm-style-iw-c { border-radius: 8px !important; box-shadow: 0 2px 12px rgba(0,0,0,0.15) !important; padding: 0 !important; }
    .gm-style .gm-style-iw-d { overflow: hidden !important; }
    .gm-style-iw-tc::after { display: none !important; }
    .gm-ui-hover-effect { display: none !important; }
    .gm-style .gmnoprint { opacity: 0.7; }
    .gm-style-cc { font-size: 9px !important; }

    /* ── Infobox (map overlay, bottom-left) ── */
    .ss-map-infobox {
      position: absolute; bottom: 40px; left: 16px;
      background: rgba(255,255,255,0.98);
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.13), 0 1px 4px rgba(0,0,0,0.06);
      border: 1px solid rgba(0,0,0,0.06);
      z-index: 400; width: 244px; overflow: hidden;
    }
    .ss-infobox-header { padding: 14px 16px 12px; border-bottom: 1px solid rgba(0,0,0,0.06); display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
    .ss-infobox-count { font-size: 40px; font-weight: 700; color: rgba(0,0,0,0.88); line-height: 1; letter-spacing: -1px; }
    .ss-infobox-count-label { font-size: 12px; font-weight: 400; color: rgba(0,0,0,0.4); }

    /* ── List view ── */
    .ooh-list-area {
      flex: 1; min-height: 0; overflow: auto;
    }
    .ooh-list-area .ant-table-wrapper { height: 100%; }
    .ooh-list-area .ant-table { font-size: 13px; }
    .ooh-list-area .ant-table-thead > tr > th { background: #FAFAFA; font-size: 12px; font-weight: 600; }
    .ooh-stato-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; flex-shrink: 0; }


    /* ── SysRow (planning-def-POI style) ── */
    .ss-sys-row { border-bottom: 1px solid #F0F0F0; }
    .ss-sys-row:last-child { border-bottom: none; }
    .ss-sys-head {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 12px; transition: background 0.1s;
    }
    .ss-sys-head:hover { background: #FAFAFA; }
    .ss-sys-head.ss-sys-selected { background: #F7F5FF; }
    .ss-sys-head.ss-sys-hovered  { background: #F3F3F3; }
    .ss-sys-info { flex: 1; min-width: 0; }
    .ss-sys-code {
      font-size: 10px; font-family: 'SF Mono','Fira Code',monospace;
      color: rgba(0,0,0,0.28); margin-top: 1px;
    }
    .ss-sys-addr {
      font-size: 11px; color: rgba(0,0,0,0.45);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px;
    }
    .ss-sys-label { font-size: 13px; font-weight: 500; color: rgba(0,0,0,0.88); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
    .ss-sys-label.ss-sys-premium { font-weight: 600; }
    .ss-sys-meta { display: flex; align-items: center; gap: 5px; margin-top: 3px; font-size: 11px; color: rgba(0,0,0,0.40); }
    .ss-sys-meta-icon { font-size: 11px; color: rgba(0,0,0,0.30); flex-shrink: 0; display: flex; align-items: center; }
    .ss-sys-meta-type { font-weight: 500; color: rgba(0,0,0,0.45); }
    .ss-sys-meta-sep { color: rgba(0,0,0,0.20); margin: 0 1px; }
    .ss-sys-meta-fmt { font-family: 'SF Mono','Fira Code',monospace; font-size: 10px; color: rgba(0,0,0,0.30); }
    /* Label chip + button */
    .ss-label-chip {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 1px 6px; border-radius: 10px; border: 1px solid;
      font-size: 10px; font-weight: 500; cursor: pointer;
      white-space: nowrap; flex-shrink: 0;
    }
    .ss-label-btn {
      color: rgba(0,0,0,0.20); font-size: 12px; cursor: pointer;
      padding: 2px 3px; border-radius: 4px; line-height: 1; flex-shrink: 0;
      display: inline-flex; align-items: center;
    }
    .ss-label-btn:hover { color: #3E00FB; background: rgba(62,0,251,0.06); }
    /* Label picker popover */
    .ss-label-picker { width: 210px; }
    .ss-label-picker-title { font-size: 11px; font-weight: 600; color: rgba(0,0,0,0.45); text-transform: uppercase; letter-spacing: 0.4px; padding: 0 0 8px; }
    .ss-label-picker-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; cursor: pointer; border-radius: 4px; }
    .ss-label-picker-row:hover { background: #F5F5F5; padding-left: 4px; margin: 0 -4px; }
    /* Color palette for new label */
    .ss-color-palette { display: flex; gap: 5px; margin: 8px 0; }
    .ss-color-swatch { width: 18px; height: 18px; border-radius: 3px; cursor: pointer; transition: transform 0.1s; }
    .ss-color-swatch:hover { transform: scale(1.15); }
    .ss-face-badge { font-size: 11px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
    .ss-face-badge-all  { color: #52C41A; }
    .ss-face-badge-part { color: #3E00FB; }
    .ss-face-badge-none { color: rgba(0,0,0,0.35); }
    .ss-expand-btn {
      color: rgba(0,0,0,0.25); font-size: 10px; cursor: pointer;
      padding: 4px 6px; border-radius: 4px; flex-shrink: 0;
      transition: color 0.15s, background 0.1s;
    }
    .ss-expand-btn:hover { color: #3E00FB; background: rgba(62,0,251,0.06); }
    .ss-faces-body { background: #FAFAFA; border-top: 1px solid #F0F0F0; padding: 3px 0 5px; }
    .ss-face-row {
      display: flex; align-items: center; gap: 7px;
      padding: 5px 12px 5px 30px; cursor: pointer; transition: background 0.1s;
    }
    .ss-face-row:hover { background: rgba(0,0,0,0.02); }
    .ss-face-row.ss-face-selected { background: rgba(62,0,251,0.05); }
    .ss-face-type { font-size: 11px; font-weight: 500; color: rgba(0,0,0,0.65); min-width: 95px; flex-shrink: 0; }
    .ss-face-format { font-size: 10px; color: rgba(0,0,0,0.30); font-family: 'SF Mono','Fira Code',monospace; flex: 1; white-space: nowrap; }
    .ss-face-state { display: flex; align-items: center; gap: 4px; font-size: 11px; color: rgba(0,0,0,0.45); white-space: nowrap; flex-shrink: 0; }
    .ss-face-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

    /* ── Map floating card ── */
    .ss-map-floatcard {
      position: absolute; top: 16px; left: 16px; z-index: 450;
      background: #fff; border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.16), 0 1px 4px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.06); width: 320px; overflow: hidden;
    }
    .ss-map-floatcard-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px 6px; border-bottom: 1px solid #F0F0F0;
    }
    .ss-map-floatcard-title {
      font-size: 10px; font-weight: 600; color: rgba(0,0,0,0.35);
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .ss-map-floatcard-close {
      background: none; border: none; cursor: pointer; color: rgba(0,0,0,0.3);
      padding: 2px 4px; border-radius: 4px; display: flex; align-items: center;
    }
    .ss-map-floatcard-close:hover { color: rgba(0,0,0,0.65); background: rgba(0,0,0,0.05); }

/* ── Filter drawer: sezioni/chip iniettate da filter-drawer.js ── */
.ant-drawer-body { padding-top: 8px !important; }

/* ── Geocoding progress banner ── */
.geocoding-banner {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  background: rgba(62,0,251,0.92); color: #fff;
  padding: 6px 16px 6px 14px; border-radius: 0 0 10px 10px;
  font-size: 12px; font-weight: 500; z-index: 200;
  white-space: nowrap; display: flex; align-items: center; gap: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.18);
}
.geocoding-progress-bar {
  width: 100px; height: 3px; background: rgba(255,255,255,0.3);
  border-radius: 2px; overflow: hidden;
}
.geocoding-progress-fill {
  height: 100%; background: #fff; border-radius: 2px; transition: width 0.25s;
}


    /* ── Nuovo Impianto (drawer) ──────────────────────────── */
    .ni-section { padding: 10px 0; }
    .ni-section:first-child { padding-top: 4px; }
    .ni-section:last-child { padding-bottom: 0; }
    .ni-section-title { font-size: 11px; font-weight: 600; color: rgba(0,0,0,0.35); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 16px; }
    .ni-grid { display: grid; gap: 16px 12px; margin-bottom: 16px; }
    .ni-grid:last-child { margin-bottom: 0; }
    /* In ogni riga del grid i campi sono colonne flex: il controllo si allinea in basso
       così gli input restano sulla stessa linea anche quando le label vanno a capo su 2 righe */
    .ni-grid .ni-field { margin-bottom: 0; display: flex; flex-direction: column; }
    .ni-grid .ni-field > :last-child { margin-top: auto; }
    .ni-grid-2 { grid-template-columns: 1fr 1fr; }
    .ni-grid-3 { grid-template-columns: 1fr 1fr 1fr; }
    .ni-grid-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }

    /* ── Create page ── */
    .create-page { flex: 1; min-height: 0; display: flex; flex-direction: column; background: #F5F5F5; overflow: hidden; }
    .create-topbar { display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 24px; background: #fff; border-bottom: 1px solid #F0F0F0; flex-shrink: 0; }
    .create-body { flex: 1; min-height: 0; display: flex; overflow: hidden; }
    .create-nav { width: 220px; flex-shrink: 0; padding: 24px 16px; background: #fff; border-right: 1px solid #F0F0F0; overflow-y: auto; }
    .create-nav-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: rgba(0,0,0,0.3); padding: 0 10px; margin-bottom: 8px; }
    .create-nav-item { display: block; padding: 7px 12px; border-radius: 6px; font-size: 13px; color: rgba(0,0,0,0.65); cursor: pointer; margin-bottom: 2px; transition: background 0.12s, color 0.12s; user-select: none; }
    .create-nav-item:hover { background: rgba(0,0,0,0.04); color: rgba(0,0,0,0.88); }
    .create-nav-item.active { background: rgba(62,0,251,0.07); color: #3E00FB; font-weight: 500; }
    /* Scheda impianto V2 */
    .dv2-nav-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; font-size: 13px; color: rgba(0,0,0,0.65); cursor: pointer; margin-bottom: 2px; transition: background .12s, color .12s; }
    .dv2-nav-item:hover { background: rgba(0,0,0,0.04); color: rgba(0,0,0,0.88); }
    .dv2-nav-item.active { background: rgba(62,0,251,0.07); color: #3E00FB; font-weight: 600; }
    .create-nav-item.disabled { color: rgba(0,0,0,0.25); cursor: not-allowed; }
    .create-nav-item.disabled:hover { background: transparent; color: rgba(0,0,0,0.25); }
    .create-scroll { flex: 1; overflow-y: auto; padding: 40px 0; background: #F5F5F5; display: flex; justify-content: center; align-items: flex-start; }
    .create-content { width: 80%; max-width: 100%; }
    .create-section { margin-bottom: 32px; }
    .create-section-title { font-size: 11px; font-weight: 600; color: rgba(0,0,0,0.35); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 14px; }
    .ni-field { margin-bottom: 14px; }
    .ni-field:last-child { margin-bottom: 0; }
    .ni-label { font-size: 13px; color: rgba(0,0,0,0.65); margin-bottom: 5px; }

// ── Popolamento sintetico per demo mappa/cluster ─────────────
// Genera impianti aggiuntivi in "blob" di densità crescente, così sulla mappa
// si vedono tutti gli scaglioni di cluster (da 1-2 fino a >50). RNG con seed:
// le posizioni restano stabili tra un refresh e l'altro.
(function generateImpianti() {
  let _seed = 20260616;
  const rnd = () => {
    _seed = (_seed + 0x6D2B79F5) | 0;
    let t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const pick = arr => arr[Math.floor(rnd() * arr.length)];

  const TIPI_GEN = ['Pensilina','Cartello','Palina','Fermata bus','Cassonetto','Palo luce','Speciale','Palina butterfly','Telo','Stendardo','Parapedonale','Rotor','Plancia','Insegna','Fioriera'];
  // distribuzione pesata: prevale Disponibile / Attivo, ma compaiono tutti i casi
  const STATI_GEN     = ['Disponibile','Disponibile','Disponibile','In Opzione','Riservato'];
  const STATI_AMM_GEN = ['Attivo','Attivo','Attivo','In Manutenzione','Inizializzato','Rimosso'];
  const VIE_GEN = ['Via della Libertà','Via Roma','Via Maqueda','Corso Calatafimi','Viale Strasburgo','Via Notarbartolo','Via Marchese di Villabianca','Via Sciuti','Via Empedocle Restivo','Via Dante','Via Ernesto Basile','Viale Regione Siciliana','Via Messina Marine','Via Oreto','Via Ausonia'];

  // ogni blob = un addensamento locale con un numero target di impianti
  const BLOBS = [
    { zona:'Sferracavallo',   lat:38.2030, lng:13.2780, n:1,   spread:0.003 },
    { zona:'Mondello',        lat:38.2000, lng:13.3250, n:2,   spread:0.004 },
    { zona:'Capaci',          lat:38.1700, lng:13.2400, n:4,   spread:0.005 },
    { zona:'Tommaso Natale',  lat:38.1950, lng:13.2900, n:5,   spread:0.005 },
    { zona:'Monreale',        lat:38.0820, lng:13.2920, n:6,   spread:0.006 },
    { zona:'Pallavicino',     lat:38.1800, lng:13.3200, n:8,   spread:0.006 },
    { zona:'Resuttana',       lat:38.1620, lng:13.3380, n:9,   spread:0.006 },
    { zona:'San Lorenzo',     lat:38.1550, lng:13.3300, n:14,  spread:0.008 },
    { zona:'Resuttana Nord',  lat:38.1480, lng:13.3460, n:18,  spread:0.008 },
    { zona:'Libertà Nord',    lat:38.1420, lng:13.3520, n:24,  spread:0.009 },
    { zona:'Bonagia',         lat:38.1000, lng:13.3560, n:30,  spread:0.010 },
    { zona:'Politeama',       lat:38.1230, lng:13.3500, n:38,  spread:0.010 },
    { zona:'Centro Storico',  lat:38.1150, lng:13.3640, n:48,  spread:0.011 },
    { zona:'Stazione',        lat:38.1080, lng:13.3700, n:70,  spread:0.012 },
    { zona:'Oreto',           lat:38.0980, lng:13.3850, n:110, spread:0.015 },
  ];

  let n = IMPIANTI.length;
  BLOBS.forEach(b => {
    for (let k = 0; k < b.n; k++) {
      n += 1;
      IMPIANTI.push({
        id:        'I' + String(n).padStart(3, '0'),
        tipo:      pick(TIPI_GEN),
        indirizzo: pick(VIE_GEN) + ', ' + (1 + Math.floor(rnd() * 250)),
        zona:      b.zona,
        lat:       b.lat + (rnd() - 0.5) * b.spread * 2,
        lng:       b.lng + (rnd() - 0.5) * b.spread * 2,
        faces:     1 + Math.floor(rnd() * 4),
        formato:   '120×180cm',
        stato:     pick(STATI_GEN),
        illuminato: rnd() < 0.5,
        stato_amm: pick(STATI_AMM_GEN),
      });
    }
  });
})();

// Campi sintetici per prototipo: canale, suolo, media_owner
(function enrichImpianti() {
  const MEDIA_OWNERS = ['Proprietario', 'IGPDecaux', 'Clear Channel', 'Verticals', 'Geonext', 'Pubbliemme', 'Cemusa', 'Neopolis', 'Mediacom', 'Urbanspot'];
  IMPIANTI.forEach((imp, i) => {
    imp.canale      = imp.illuminato ? 'DOOH' : 'OOH';
    imp.suolo       = i % 3 === 0 ? 'Privato' : 'Pubblico';
    imp.media_owner = MEDIA_OWNERS[i % MEDIA_OWNERS.length];
  });
})();

function getSuggestions(query) {
  if (!query || query.trim().length < 2) return [];
  const q = normalizeText(query.trim());
  const buckets = { city: [], province: [], zona: [], street: [] };
  LOCATION_SUGG.forEach(item => {
    const searchIn = normalizeText(item.text + ' ' + item.detail);
    if (!searchIn.includes(q) && !q.split(' ').every(w => searchIn.includes(w))) return;
    const bucket = ['via','corso','viale','piazza','area'].includes(item.type) ? 'street' : item.type;
    if (buckets[bucket] && buckets[bucket].length < 4) buckets[bucket].push(item);
  });
  return [
    { key: 'city',     label: 'Città e Comuni',     items: buckets.city },
    { key: 'province', label: 'Province',            items: buckets.province },
    { key: 'zona',     label: 'Quartieri e Zone',    items: buckets.zona },
    { key: 'street',   label: 'Strade e Aree',       items: buckets.street },
  ].filter(g => g.items.length > 0);
}

function highlightMatch(text, query) {
  if (!query) return React.createElement('span', null, text);
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx < 0) return React.createElement('span', null, text);
  return React.createElement('span', null,
    text.slice(0, idx),
    React.createElement('strong', { style: { color: '#3E00FB', fontWeight: 600 } }, text.slice(idx, idx + query.length)),
    text.slice(idx + query.length)
  );
}

// RICERCA — helpers normalizzazione e matching per parole
// ─────────────────────────────────────────────────────────
const STOP_WORDS = new Set(['via', 'corso', 'piazza', 'viale', 'largo', 'vicolo', 'lungomare', 'di', 'della', 'delle', 'degli', 'del', 'dei', 'de', 'in', 'a', 'e', 'il', 'la', 'lo', 'le', 'i', 'gli']);

function normalizeText(str) {
  return str
    .normalize('NFD').replace(/[̀-ͯ]/g, '') // rimuove accenti
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g, ' ')                     // punteggiatura → spazio
    .replace(/\s+/g, ' ')
    .trim();
}

// Restituisce true se ogni parola non-stop di query è contenuta in una parola di text
function matchesSearch(text, query) {
  if (!query) return true;
  const textWords  = normalizeText(text).split(' ');
  const queryWords = normalizeText(query).split(' ').filter(w => w.length > 1 && !STOP_WORDS.has(w));
  if (queryWords.length === 0) return true;
  return queryWords.every(qw => textWords.some(tw => tw.includes(qw)));
}

// Rendering marker/cluster forniti dal modulo condiviso GravityMap
// (makeMarkerIcon, makeClusterSvg, getMarkerSize, clusterColor, markerSrc).

function GoogleMap({ impianti, highlightedId, selectedIds, filteredIds, onSelect, onMarkerClick, cardImp, onCardClose, onDetail, flyToTarget }) {
  const containerRef  = useRef(null);
  const mapRef        = useRef(null);
  const clusterMarkersRef = useRef([]);  // bolle cluster (griglia condivisa)
  const markersRef    = useRef({});   // id → { marker, imp }
  const cardImpRef         = useRef(null);
  const highlightedIdRef   = useRef(null);
  const hoveredMarkerIdRef = useRef(null);
  const filteredIdsRef     = useRef(null);
  const [cardPx, setCardPx] = useState(null);
  const [cardReady, setCardReady] = useState(false); // popover visibile solo a fine zoom

  const recalcCardPx = React.useCallback(() => {
    const imp = cardImpRef.current;
    const map = mapRef.current;
    if (!imp || !map) { setCardPx(null); return; }
    const proj = map.getProjection();
    const bounds = map.getBounds();
    if (!proj || !bounds) { setCardPx(null); return; }
    const scale = Math.pow(2, map.getZoom());
    const nw = proj.fromLatLngToPoint(new google.maps.LatLng(bounds.getNorthEast().lat(), bounds.getSouthWest().lng()));
    const entry = markersRef.current[imp.id];
    const lat = entry ? entry.imp.lat : imp.lat;
    const lng = entry ? entry.imp.lng : imp.lng;
    const pt = proj.fromLatLngToPoint(new google.maps.LatLng(lat, lng));
    // Ancora il popover sopra il marker focalizzato (icona ×1.4) + 8px di gap
    const [, baseH] = GravityMap.getMarkerSize(map.getZoom());
    const markerH = Math.round(baseH * 1.4);
    setCardPx({
      x: Math.floor((pt.x - nw.x) * scale),
      y: Math.floor((pt.y - nw.y) * scale) - markerH - 8,
    });
  }, []);

  // ── Helper icona marker (stati di interazione, modulo condiviso) ──────────
  // Inventory non ha selezione visiva (decisione Fase 0): isSelected sempre false.
  // Il dimming è gestito da applyDim via setOpacity → hasFocus resta false qui.
  const markerSrcFor = (imp) => GravityMap.markerSrc(
    imp.tipo, (STATO_AMM_CONFIG[imp.stato_amm] || STATO_AMM_CONFIG['Attivo']).file, imp.canale);
  const flagsFor = (id) => ({
    isHovered:  id === hoveredMarkerIdRef.current,
    isFocused:  id === highlightedIdRef.current,
    isSelected: false,
    hasFocus:   false,
  });
  const iconFor = (imp) => GravityMap.makeMarkerIcon({
    src:   markerSrcFor(imp),
    zoom:  mapRef.current ? mapRef.current.getZoom() : 13,
    flags: flagsFor(imp.id),
  });
  const zIndexFor = (id) => {
    const f = flagsFor(id);
    return f.isFocused ? 2000 : f.isHovered ? 500 : 1;
  };

  const refreshAllIconsRef = useRef(null);
  refreshAllIconsRef.current = () => {
    Object.values(markersRef.current).forEach(({ marker, imp }) => {
      marker.setIcon(iconFor(imp));
      marker.setZIndex(zIndexFor(imp.id));
    });
  };
  const refreshIcon = (id) => {
    const entry = markersRef.current[id];
    if (!entry) return;
    entry.marker.setIcon(iconFor(entry.imp));
    entry.marker.setZIndex(zIndexFor(id));
  };

  // ── Dim: opacità ridotta sugli altri quando c'è un focus / card aperta ────
  const applyDimRef = useRef(null);
  applyDimRef.current = () => {
    const hasFocus = !!highlightedIdRef.current || !!cardImpRef.current;
    Object.values(markersRef.current).forEach(({ marker, imp }) => {
      if (!marker.getMap()) return;
      const isFocused = imp.id === highlightedIdRef.current;
      marker.setOpacity(hasFocus && !isFocused ? 0.3 : 1);
    });
  };

  // ── Clustering a griglia (motore condiviso GravityMap) ────────────────────
  const applyClusteringRef = useRef(null);
  applyClusteringRef.current = () => {
    const map = mapRef.current;
    if (!map) return;
    clusterMarkersRef.current.forEach(m => m.setMap(null));
    clusterMarkersRef.current = [];

    const byId = markersRef.current;
    // Marker fuori dal filtro: nascosti e fuori dal clustering
    const active = [];
    Object.values(byId).forEach(({ marker, imp }) => {
      const inFilter = !filteredIdsRef.current || filteredIdsRef.current.has(imp.id);
      if (inFilter) active.push({ marker, imp });
      else marker.setMap(null);
    });

    const items = active.map(({ marker, imp }) => ({
      id: imp.id,
      position: { lat: marker.getPosition().lat(), lng: marker.getPosition().lng() },
    }));
    const res = GravityMap.computeGridClusters(map, items);

    // Ridimensiona le icone dei marker VISIBILI allo zoom corrente (getMarkerSize)
    if (res.mode === 'individual') {
      active.forEach(({ marker, imp }) => { marker.setIcon(iconFor(imp)); marker.setMap(map); });
    } else {
      res.members.forEach(it => { const e = byId[it.id]; e.marker.setIcon(iconFor(e.imp)); e.marker.setMap(map); });
      res.clusters.forEach(cl => {
        cl.members.forEach(it => byId[it.id].marker.setMap(null));
        const draw = (hovered) => {
          const { url, size } = GravityMap.makeClusterSvg(cl.members.length, { hovered });
          return { url, scaledSize: new google.maps.Size(size, size), anchor: new google.maps.Point(size / 2, size / 2) };
        };
        const cm = new google.maps.Marker({
          position: cl.center, icon: draw(false), map,
          zIndex: 10000 + cl.members.length,
        });
        cm.addListener('click',     () => GravityMap.fitBoundsToMembers(map, cl.members));
        cm.addListener('mouseover', () => cm.setIcon(draw(true)));
        cm.addListener('mouseout',  () => cm.setIcon(draw(false)));
        clusterMarkersRef.current.push(cm);
      });
    }
    applyDimRef.current();
  };

  // ── Preload SVG marker (path corretto via modulo) ─────
  useEffect(() => {
    const srcs = new Set();
    impianti.forEach(imp => srcs.add(markerSrcFor(imp)));
    GravityMap.preloadAll([...srcs]).then(() => {
      if (refreshAllIconsRef.current) refreshAllIconsRef.current();
    });
  }, []);

  // ── Init mappa + marker ───────────────────────────────
  useEffect(() => {
    if (mapRef.current || !containerRef.current) return;

    const map = new google.maps.Map(containerRef.current, {
      center: { lat: 38.1155, lng: 13.3615 },
      zoom: 13,
      styles: MAP_STYLES,
      disableDefaultUI: true,
      zoomControl: true,
      zoomControlOptions: { position: google.maps.ControlPosition.LEFT_TOP },
      gestureHandling: 'greedy',
    });
    // Imposta subito il ref: iconFor() legge lo zoom reale già alla creazione
    // (evita il fallback a zoom 13 e marker sottodimensionati al primo paint).
    mapRef.current = map;

    impianti.forEach(imp => {
      const marker = new google.maps.Marker({
        position: { lat: imp.lat, lng: imp.lng },
        icon: iconFor(imp),
      });

      // Hover: solo marker ingrandito (nessun popover). Il popover è al click.
      marker.addListener('mouseover', () => {
        hoveredMarkerIdRef.current = imp.id;
        refreshIcon(imp.id);
      });
      marker.addListener('mouseout', () => {
        hoveredMarkerIdRef.current = null;
        refreshIcon(imp.id);
      });
      marker.addListener('click', () => { if (onMarkerClick) onMarkerClick(imp); else onSelect(imp.id); });

      markersRef.current[imp.id] = { marker, imp };
    });

    // Clustering a griglia (motore condiviso): riapplica a ogni zoom e all'idle
    // iniziale (la proiezione è disponibile solo dopo il primo idle).
    map.addListener('zoom_changed', () => { if (applyClusteringRef.current) applyClusteringRef.current(); });
    google.maps.event.addListenerOnce(map, 'idle', () => { if (applyClusteringRef.current) applyClusteringRef.current(); });
    google.maps.event.addListener(map, 'bounds_changed', recalcCardPx);

    return () => { mapRef.current = null; };
  }, []);

  // ── Aggiorna posizioni marker quando cambiano le coordinate (geocoding) ──
  useEffect(() => {
    if (!mapRef.current) return;
    let changed = false;
    impianti.forEach(imp => {
      const entry = markersRef.current[imp.id];
      if (!entry) return;
      const curr = entry.marker.getPosition();
      if (!curr ||
          Math.abs(curr.lat() - imp.lat) > 0.000005 ||
          Math.abs(curr.lng() - imp.lng) > 0.000005) {
        entry.marker.setPosition({ lat: imp.lat, lng: imp.lng });
        entry.imp = { ...entry.imp, lat: imp.lat, lng: imp.lng };
        changed = true;
      }
    });
    if (changed && applyClusteringRef.current) applyClusteringRef.current();
  }, [impianti]);

  // ── Filtro + highlight: aggiorna icone, riclusterizza, centra ─────────────
  // L'highlight non usa più un overlay separato: il marker focalizzato riceve
  // lo stato `isFocused` dal modulo (×1.4 + drop-shadow + outline viola) e, se
  // serve, lo zoom porta sopra la soglia di decluster così è sempre individuale.
  useEffect(() => {
    if (!mapRef.current) return;
    filteredIdsRef.current   = filteredIds;
    highlightedIdRef.current = highlightedId;
    cardImpRef.current       = cardImp;

    refreshAllIconsRef.current();
    applyClusteringRef.current();

    if (highlightedId && markersRef.current[highlightedId]) {
      const { imp } = markersRef.current[highlightedId];
      mapRef.current.panTo({ lat: imp.lat, lng: imp.lng });
      if (mapRef.current.getZoom() < 15) mapRef.current.setZoom(16);
    }
  }, [highlightedId, selectedIds, filteredIds, cardImp]);

  // ── Posizione card sul marker ────────────────────────
  useEffect(() => {
    cardImpRef.current = cardImp;
    setCardPx(null);
  }, [cardImp]);

  // ── Popover: appare alla fine dell'animazione di zoom sul marker ─────────
  // Il click avvia pan+zoom (effect highlight); attendiamo l'idle della mappa
  // prima di mostrare il popover, con fallback se non c'è movimento.
  useEffect(() => {
    if (!cardImp || !mapRef.current) { setCardReady(false); return; }
    const map = mapRef.current;
    setCardReady(false);
    const show = () => { recalcCardPx(); setCardReady(true); };
    const l = google.maps.event.addListenerOnce(map, 'idle', show);
    const t = setTimeout(show, 600);
    return () => { google.maps.event.removeListener(l); clearTimeout(t); };
  }, [cardImp, recalcCardPx]);

  // ── Fly to zona cercata ───────────────────────────────
  useEffect(() => {
    if (!flyToTarget || !mapRef.current) return;
    mapRef.current.panTo({ lat: flyToTarget.lat, lng: flyToTarget.lng });
    mapRef.current.setZoom(flyToTarget.zoom || 14);

async function fetchAddrSuggestions(q) {
  if (!q || q.length < 3) return [];
  try {
    const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=12&lang=default&lat=41.9&lon=12.4&zoom=12&bbox=6.6,35.5,18.5,47.1`;
    const res = await fetch(url, { signal: AbortSignal.timeout(4000) });
    if (!res.ok) return [];
    const data = await res.json();
    const seen = new Set();
    const qHasNum = /\d/.test(q);
    return (data.features || [])
      .filter(f => f.properties.street || f.properties.name)
      .flatMap(f => {
        const p = f.properties;
        const [lng, lat] = f.geometry.coordinates;
        if (!lat || !lng) return [];
        const via    = p.street || p.name || '';
        const civico = p.housenumber || '';
        const citta  = p.city || p.town || p.village || '';
        const label  = [via, civico].filter(Boolean).join(' ') || citta;
        if (!label || seen.has(label)) return [];
        seen.add(label);
        const subParts = [];
        if (citta && citta !== label) subParts.push(citta);
        if (p.state) subParts.push(p.state);
        return [{
          id: `${lng.toFixed(5)}-${lat.toFixed(5)}`,
          display: [[via, civico].filter(Boolean).join(' '), citta, p.country].filter(Boolean).join(', '),
          sub: subParts.join(', ') || p.country || '',
          via,
          civico,
          cap: p.postcode || '',
          citta,
          provincia: p.county || '',
          regione: p.state || '',
          nazione: p.country || '',
          lat,
          lng,
          _hasNum: !!p.housenumber,
        }];
      })
      .sort((a, b) => qHasNum && a._hasNum !== b._hasNum ? (a._hasNum ? -1 : 1) : 0)
      .slice(0, 8);
  } catch { return []; }
}

// Etichetta sintetica dell'illuminazione di una faccia (es. "Illuminato · Faretti (6 · 150W)")
function faceIllumLabel(f) {
  if (!f.illumStato) return null;
  if (f.illumStato === 'Spento') return 'Spento';
  let s = f.illumStato + (f.illumMezzo ? ' · ' + f.illumMezzo : '');
  if (f.illumMezzo === 'Faretti' && (f.illumNFaretti || f.illumWatt)) {
    const parts = [];
    if (f.illumNFaretti) parts.push(f.illumNFaretti + ' faretti');
    if (f.illumWatt) parts.push(f.illumWatt + 'W');
    s += ' (' + parts.join(' · ') + ')';
  }
  return s;
}

// Etichetta illuminazione sintetica per la card (es. "3 faretti · 150W" oppure "Neon")
function faceIllumShort(f) {
  if (!f.illumStato || f.illumStato === 'Spento') return '—';
  if (f.illumMezzo === 'Faretti') {
    const parts = [];
    if (f.illumNFaretti) parts.push(f.illumNFaretti + ' faretti');
    if (f.illumWatt) parts.push(f.illumWatt + 'W');
    return parts.length ? parts.join(' · ') : 'Faretti';
  }
  return f.illumMezzo || f.illumStato;
}

function NewImpiantoFullDrawer({ open, onClose, initialValues = {}, onSave }) {

  React.useEffect(() => {
    if (!open) return;
    const v = initialValues;
    setCanale(v.canale || null);
    setNome(v.nome || '');
    setTipologia(v.tipologia || null);
    setStato(v.stato || null);
    setVia(v.via || '');
    setCivico(v.civico || '');
    setCap(v.cap || '');
    setCitta(v.citta || '');
    setProvincia(v.provincia || '');
    setRegione(v.regione || '');
    setNazione(v.nazione || '');
    setLat(v.lat || '');
    setLng(v.lng || '');
    setZn(v.zona || '');
    // formato dopo tipologia perché useMemo(formatiOpts) dipende da tipologia
    setTimeout(() => setFormato(v.formato || null), 0);
  }, [open]);

  // ── Localizzazione
  const [addrSuggs,   setAddrSuggs]   = useState([]);
  const [via,         setVia]         = useState(iv.via       || '');
  const [civico,      setCivico]      = useState(iv.civico    || '');
  const [cap,         setCap]         = useState(iv.cap       || '');
  const [citta,       setCitta]       = useState(iv.citta     || '');
  const [provincia,   setProvincia]   = useState(iv.provincia || '');
  const [regione,     setRegione]     = useState(iv.regione   || '');
  const [nazione,     setNazione]     = useState(iv.nazione   || '');
  const [lat,         setLat]         = useState(iv.lat       || '');
  const [lng,         setLng]         = useState(iv.lng       || '');
  const [catSuolo,    setCatSuolo]    = useState(null);
  const [utenza,      setUtenza]      = useState('');
  const [zn,          setZn]          = useState('');

  // ── Caratteristiche
  const [largImp,      setLargImp]      = useState('');
  const [altImp,       setAltImp]       = useState('');
  const [profImp,      setProfImp]      = useState('');
  const [altTerra,     setAltTerra]     = useState('');
  const [tipoAltezza,  setTipoAltezza]  = useState(null);
  const [riparato,     setRiparato]     = useState(null);
  // Facce — gestite con drawer di creazione + card (come permessi). Ogni faccia ha
  // illuminazione propria che segue lo stesso modello dell'impianto.
  const [facce,         setFacce]         = useState([]);
  const [faceDrawerOpen, setFaceDrawerOpen] = useState(false);
  const [faceEditId,    setFaceEditId]    = useState(null);
  const [fcTipo,        setFcTipo]        = useState('Anteriore');
  const [fcSlot,        setFcSlot]        = useState(null);
  const [fcLat,         setFcLat]         = useState('');
  const [fcLng,         setFcLng]         = useState('');
  const [fcCoordLock,   setFcCoordLock]   = useState(true);  // coordinate ereditate dall'impianto finché bloccate
  const [fcOrient,      setFcOrient]      = useState(0);     // orientamento in gradi 0–360
  const [fcCono,        setFcCono]        = useState(null);  // raggio cono visibilità (cm)
  const [fcFormL,       setFcFormL]       = useState(null);  // larghezza faccia (cm)
  const [fcFormH,       setFcFormH]       = useState(null);  // altezza faccia (cm)
  const [fcIllumStato,    setFcIllumStato]    = useState(null);
  const [fcIllumMezzo,    setFcIllumMezzo]    = useState(null);
  const [fcIllumNFaretti, setFcIllumNFaretti] = useState(null);
  const [fcIllumWatt,     setFcIllumWatt]     = useState(null);
  const [fcVendita,     setFcVendita]     = useState(null);
  const [fcPrezzo,      setFcPrezzo]      = useState(null);
  const [fcVisMarcia,   setFcVisMarcia]   = useState(false);  // faccia visibile nel senso di marcia

  const areaEspositiva = React.useMemo(() => {
    const w = parseFloat(largImp), h = parseFloat(altImp);
    if (!w || !h) return null;
    return Math.round((w * h / 10000) * 100) / 100;
  }, [largImp, altImp]);

  // ── Facce — handler drawer/card
  const onFcIllumStato = (v) => {
    setFcIllumStato(v);

  };
  const onFcIllumMezzo = (v) => {
    setFcIllumMezzo(v);
    if (v !== 'Faretti') { setFcIllumNFaretti(null); setFcIllumWatt(null); }
  };
  const resetFaceForm = () => {
    setFcTipo('Anteriore'); setFcSlot(null); setFcLat(''); setFcLng(''); setFcCoordLock(true);
    setFcOrient(0); setFcCono(null); setFcFormL(null); setFcFormH(null);
    setFcIllumStato(null); setFcIllumMezzo(null); setFcIllumNFaretti(null); setFcIllumWatt(null);
    setFcVendita(null); setFcPrezzo(null); setFcVisMarcia(false);
  };
  // Nuova faccia: eredita coordinate e illuminazione dall'impianto (logica dell'impianto)
  // Coordinate ereditate dall'impianto finché il lucchetto è chiuso
  const inheritFaceCoord = () => { setFcLat(lat || ''); setFcLng(lng || ''); };
  const toggleFcCoordLock = () => {
    setFcCoordLock(prev => {
      const next = !prev;
      if (next) inheritFaceCoord(); // ri-bloccando, reimposta le coordinate dell'impianto
      return next;
    });
  };

    setFaceEditId(null);
    setFcCoordLock(true);
    setFcLat(lat || ''); setFcLng(lng || '');
    setFaceDrawerOpen(true);
  };

    setFaceEditId(f.id);
    const locked = f.coordLock !== false;
    setFcCoordLock(locked);
    setFcTipo(f.tipo); setFcSlot(f.slot);
    setFcLat(locked ? (lat || '') : (f.lat || ''));
    setFcLng(locked ? (lng || '') : (f.lng || ''));
    setFcOrient(f.orient ?? 0); setFcCono(f.cono ?? null); setFcFormL(f.formL ?? null); setFcFormH(f.formH ?? null);
    setFcIllumStato(f.illumStato); setFcIllumMezzo(f.illumMezzo);
    setFcIllumNFaretti(f.illumNFaretti); setFcIllumWatt(f.illumWatt);
    setFcVendita(f.vendita); setFcPrezzo(f.prezzo);
    setFcVisMarcia(!!f.visMarcia);
    setFaceDrawerOpen(true);
  };
  const closeFaceDrawer = () => { setFaceDrawerOpen(false); setFaceEditId(null); };
  const saveFace = () => {
    if (!fcTipo) { antdMsg.warning('Seleziona il tipo di faccia'); return; }
    const data = {
      tipo: fcTipo, slot: fcSlot,
      lat: fcCoordLock ? (lat || '') : fcLat, lng: fcCoordLock ? (lng || '') : fcLng, coordLock: fcCoordLock,
      orient: fcOrient, cono: fcCono, formL: fcFormL, formH: fcFormH,
      illumStato: fcIllumStato, illumMezzo: fcIllumMezzo, illumNFaretti: fcIllumNFaretti, illumWatt: fcIllumWatt,
      vendita: fcVendita, prezzo: fcPrezzo, visMarcia: fcVisMarcia,
    };
    if (faceEditId) {
      setFacce(prev => prev.map(f => {
        if (f.id === faceEditId) return { ...f, ...data };
        // Modificando l'anteriore, ri-sincronizza i campi condivisi della posteriore collegata
        if (f.pairOf === faceEditId) return { ...f, ...syncedFromAnteriore({ ...f, ...data }) };
        return f;
      }));
      antdMsg.success('Faccia aggiornata');
    } else {
      setFacce(prev => [...prev, { id: 'face-' + (prev.length + 1) + '-' + prev.reduce((m, f) => Math.max(m, +String(f.id).split('-')[1] || 0), 0), ...data }]);
      antdMsg.success('Faccia aggiunta');
    }
    closeFaceDrawer();
  };
  const removeFace = (id) => {
    // Eliminando l'anteriore si elimina anche la posteriore collegata
    setFacce(prev => prev.filter(f => f.id !== id && f.pairOf !== id));
    antdMsg.success('Faccia rimossa');
  };
  // Faccia posteriore collegata: campi fisici condivisi, orientamento speculare (+180°)
  const createPosteriore = (f) => {
    if (facce.some(x => x.pairOf === f.id)) { antdMsg.warning('Questa faccia ha già una posteriore collegata'); return; }
    setFacce(prev => [...prev, {
      ...f, id: 'face-post-' + f.id, tipo: 'Posteriore', pairOf: f.id,
      ...syncedFromAnteriore(f),
    }]);
    antdMsg.success('Faccia posteriore creata e collegata (speculare)');
  };
  // Pre-crea le facce previste dalla tipologia (tipo + slot progressivo, coordinate ereditate)
  const buildFacceForTipo = (tipo) => (FACCE_PER_TIPO[tipo] || ['Anteriore']).map((t, i) => ({
    id: 'face-auto-' + (i + 1), tipo: t, slot: i + 1,

      React.createElement('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3, auto)', alignItems: 'center', justifyItems: 'center', gap: 4, flexShrink: 0, paddingTop: 2 } },

        React.createElement('span'),

        React.createElement('div', { style: { width: 30, height: 30, borderRadius: 4, border: '1.5px solid rgba(0,0,0,0.2)', background: '#fafafa' } }),

// ─────────────────────────────────────────────────────────
// APP
// ─────────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState('map'); // 'map' | 'detail'
  const [modalOpen,      setModalOpen]      = useState(false);
  const [fullFormOpen,   setFullFormOpen]   = useState(false);
  const [prefillData,    setPrefillData]    = useState({});
  const [savedFormData,  setSavedFormData]  = useState(null);
  const [detailImpianto, setDetailImpianto] = useState(null);
  const [cardImp,        setCardImp]        = useState(null);
  const [highlightedId, setHighlightedId] = useState(null);
  const [selectedIds,   setSelectedIds]   = useState(new Set());
  const [expandedIds,   setExpandedIds]   = useState(new Set());
  const [viewMode,           setViewMode]           = useState('map');
  const [activeTab,          setActiveTab]          = useState('tutti');

  // ── Ricerca zona ──────────────────────────────────────
  const [searchQuery,    setSearchQuery]    = useState('');
  const [appliedZone,    setAppliedZone]    = useState(null);   // filtro attivo
  const [showSugg,       setShowSugg]       = useState(false);
  const [flyToTarget,    setFlyToTarget]    = useState(null);
  const inputRef = useRef(null);

  // ── Label system ──────────────────────────────────────
  const [availableLabels, setAvailableLabels] = useState(INITIAL_LABELS);
  const [implantiLabels,  setImplantiLabels]  = useState(INITIAL_IMP_LABELS);
  const [pickerOpenId,    setPickerOpenId]    = useState(null);
  const [showNewForm,     setShowNewForm]     = useState(false);
  const [newLabelName,    setNewLabelName]    = useState('');
  const [newLabelColor,   setNewLabelColor]   = useState(LABEL_COLORS[0]);

  const closePicker = useCallback(() => {
    setPickerOpenId(null); setShowNewForm(false); setNewLabelName('');
  }, []);

  const toggleImpLabel = useCallback((impId, labelId) => {
    setImplantiLabels(prev => {
      const cur = prev[impId]?.[0];
      return { ...prev, [impId]: cur === labelId ? [] : [labelId] };
    });
  }, []);

  const createLabel = useCallback(() => {
    if (!newLabelName.trim()) return;
    const lbl = { id: `lbl-${Date.now()}`, name: newLabelName.trim(), color: newLabelColor };
    setAvailableLabels(prev => [...prev, lbl]);
    setNewLabelName(''); setShowNewForm(false);
  }, [newLabelName, newLabelColor]);

  const renderLabelPicker = useCallback((impId) => {
    const current = implantiLabels[impId]?.[0] || null;
    return React.createElement('div', { className: 'ss-label-picker', onClick: e => e.stopPropagation() },
      React.createElement('div', { className: 'ss-label-picker-title' }, current ? 'Cambia etichetta' : 'Etichetta'),
      availableLabels.map(lbl => {
        const isSel = current === lbl.id;
        return React.createElement('div', {
          key: lbl.id,
          className: 'ss-label-picker-row',
          style: isSel ? { background: lbl.color + '12' } : {},
          onClick: () => { toggleImpLabel(impId, lbl.id); closePicker(); },
        },
          React.createElement('span', {
            style: { width: 14, height: 14, borderRadius: '50%', flexShrink: 0, display: 'inline-block',
              background: isSel ? lbl.color : 'transparent', border: `2px solid ${lbl.color}` },
          }),
          React.createElement('span', { style: { fontSize: 13, color: 'rgba(0,0,0,0.75)' } }, lbl.name),
        );
      }),
      React.createElement('div', { style: { borderTop: '1px solid #F0F0F0', margin: '8px 0 4px' } }),
      !showNewForm
        ? React.createElement('div', {
            style: { display: 'flex', alignItems: 'center', gap: 6, padding: '4px 0', cursor: 'pointer', color: '#3E00FB', fontSize: 13 },
            onClick: () => setShowNewForm(true),
          },

          )
        : React.createElement('div', null,

            }),

              ...LABEL_COLORS.map(c => React.createElement('span', {
                key: c, className: 'ss-color-swatch',

                onClick: () => setNewLabelColor(c),
              }))
            ),
            React.createElement('div', { style: { display: 'flex', gap: 6, justifyContent: 'flex-end' } },
              React.createElement(Button, { size: 'small', onClick: () => { setShowNewForm(false); setNewLabelName(''); } }, 'Annulla'),
              React.createElement(Button, { size: 'small', type: 'primary', onClick: createLabel, disabled: !newLabelName.trim() }, 'Crea'),
            )
          )
    );
  }, [availableLabels, implantiLabels, pickerOpenId, showNewForm, newLabelName, newLabelColor, toggleImpLabel, closePicker, createLabel]);

  // ── Geocoding ─────────────────────────────────────────
  const [geocodedImpianti,  setGeocodedImpianti]  = useState(IMPIANTI);
  const [geocodingProgress, setGeocodingProgress] = useState(null);

  useEffect(() => {
    const CACHE_KEY = 'gravity_geocache_v3';
    let cache = {};
    try { cache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}'); } catch(e) {}

    const applyCache = (c) => {
      setGeocodedImpianti(IMPIANTI.map(imp =>
        c[imp.id] ? { ...imp, lat: c[imp.id].lat, lng: c[imp.id].lng } : imp
      ));
    };

    const toGeocode = IMPIANTI.filter(imp => !cache[imp.id]);

    if (toGeocode.length === 0) {
      applyCache(cache);
      return;
    }

    setGeocodingProgress({ done: 0, total: toGeocode.length });
    const geocoder = new google.maps.Geocoder();
    let done = 0;
    let cancelled = false;

    const next = (i) => {
      if (cancelled) return;
      if (i >= toGeocode.length) {
        applyCache(cache);
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch(e) {}
        setGeocodingProgress(null);
        return;
      }
      const imp = toGeocode[i];
      const palermoBounds = new google.maps.LatLngBounds(
        { lat: 38.055, lng: 13.285 },
        { lat: 38.245, lng: 13.455 }
      );
      geocoder.geocode(
        {
          address: `${imp.indirizzo}, Palermo`,
          componentRestrictions: { country: 'IT', locality: 'Palermo' },
          bounds: palermoBounds,
        },
        (results, status) => {
          if (status === 'OK' && results[0]) {
            const lat = results[0].geometry.location.lat();
            const lng = results[0].geometry.location.lng();
            // Accetta solo risultati dentro il bounding box di Palermo
            if (lat >= 38.055 && lat <= 38.245 && lng >= 13.285 && lng <= 13.455) {
              cache[imp.id] = { lat, lng };
            }
          }
          done++;
          setGeocodingProgress({ done, total: toGeocode.length });
          if (done % 10 === 0) {
            applyCache(cache);
            try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch(e) {}
          }
          setTimeout(() => next(i + 1), 80);
        }
      );
    };

    next(0);
    return () => { cancelled = true; };
  }, []);

  const [filterDrawerOpen, setFilterDrawerOpen] = useState(false);

  const FILTERS_EMPTY = {
    statiAmm: [], canale: [], suolo: [], mediaOwner: [],
    tipologia: [], formato: [], illuminazione: [], numeroFacce: [],
  };

  // Draft — modificati nel drawer, non ancora applicati
  const [draftFilters, setDraftFilters] = useState({ ...FILTERS_EMPTY });
  // Applied — effettivamente usati per filtrare
  const [appliedFilters, setAppliedFilters] = useState({ ...FILTERS_EMPTY });

  const setDraft = useCallback((key, value) => {
    setDraftFilters(prev => ({
      ...prev,
      [key]: typeof value === 'function' ? value(prev[key]) : value,
    }));
  }, []);

  const resetFilters = useCallback(() => {
    setDraftFilters({ ...FILTERS_EMPTY });
    setAppliedFilters({ ...FILTERS_EMPTY });
  }, []);

  const applyFilters = useCallback(() => {
    setAppliedFilters({ ...draftFilters });
    setFilterDrawerOpen(false);
  }, [draftFilters]);

  const openFilterDrawer = useCallback(() => {
    setDraftFilters({ ...appliedFilters });
    setFilterDrawerOpen(true);
  }, [appliedFilters]);

  // Suggerimenti raggruppati per tipo
  const suggestions = useMemo(() => getSuggestions(searchQuery), [searchQuery]);

  // Suggerimenti indirizzo reali (geocoding Photon/OSM) per la ricerca mappa
  const [addrSugg, setAddrSugg] = useState([]);
  const addrDebRef = useRef(null);
  useEffect(() => {
    const q = searchQuery.trim();
    if (addrDebRef.current) clearTimeout(addrDebRef.current);
    if (q.length < 3) { setAddrSugg([]); return; }
    addrDebRef.current = setTimeout(async () => { setAddrSugg(await fetchAddrSuggestions(q)); }, 350);
  }, [searchQuery]);

  // Applica la ricerca zona: aggiorna filtro + naviga la mappa
  const applyZoneSearch = useCallback((query, target) => {
    const q = (query || searchQuery).trim();
    if (!q) { setAppliedZone(null); return; }
    setAppliedZone(q);
    setShowSugg(false);
    if (target) {
      setFlyToTarget({ ...target, _ts: Date.now() });
    } else {
      const isCity = matchesSearch('Palermo Provincia', q) || normalizeText(q) === 'pa';
      if (isCity) {
        setFlyToTarget({ lat: 38.1155, lng: 13.3615, zoom: 12, _ts: Date.now() });
      } else {
        const isZona = ZONE.some(z => normalizeText(z) === normalizeText(q));
        const matching = geocodedImpianti.filter(i =>
          isZona ? matchesSearch(i.zona, q) : matchesSearch(i.indirizzo, q)
        );
        if (matching.length > 0) {
          const lat = matching.reduce((s, i) => s + i.lat, 0) / matching.length;
          const lng = matching.reduce((s, i) => s + i.lng, 0) / matching.length;
          const zoom = matching.length >= 30 ? 12 : matching.length >= 10 ? 14 : 15;
          setFlyToTarget({ lat, lng, zoom, _ts: Date.now() });
        }
      }
    }
  }, [searchQuery]);

  const clearZoneSearch = useCallback(() => {
    setAppliedZone(null);
    setSearchQuery('');
    setShowSugg(false);
  }, []);

  const filteredImpianti = useMemo(() => {
    const f = appliedFilters;
    return geocodedImpianti.filter(imp => {
      if (f.statiAmm.length > 0 && !f.statiAmm.includes(imp.stato_amm)) return false;
      if (f.canale.length > 0 && !f.canale.includes(imp.canale)) return false;
      if (f.suolo.length > 0 && !f.suolo.includes(imp.suolo)) return false;
      if (f.mediaOwner.length > 0 && !f.mediaOwner.includes(imp.media_owner)) return false;
      if (f.tipologia.length > 0 && !f.tipologia.includes(imp.tipo)) return false;
      if (f.formato.length > 0 && !f.formato.includes(imp.formato)) return false;
      if (f.illuminazione.length > 0) {
        // Il dato è booleano: tra gli illuminati, 1 su 3 (per id) è retroilluminato
        const retro = imp.illuminato && parseInt(imp.id.slice(1), 10) % 3 === 0;
        const k = !imp.illuminato ? 'Non illuminate' : retro ? 'Retroilluminate' : 'Illuminate';
        if (!f.illuminazione.includes(k)) return false;
      }
      if (f.numeroFacce.length > 0 && !f.numeroFacce.includes(window.gravityFaceCountKey(imp.faces))) return false;
      // ── Filtro zona search ──
      if (appliedZone) {
        const q = appliedZone;
        const isCity    = matchesSearch('Palermo Provincia', q) || normalizeText(q) === 'pa';
        const isZona    = ZONE.some(z => normalizeText(z) === normalizeText(q));
        if (!isCity) {
          if (isZona) {
            // Zona/quartiere: filtra per zona
            if (!matchesSearch(imp.zona, q)) return false;
          } else {
            // Via specifica: filtra SOLO per indirizzo
            if (!matchesSearch(imp.indirizzo, q)) return false;
          }
        }
      }
      return true;
    });
  }, [geocodedImpianti, appliedFilters, appliedZone]);

  const tabCounts = useMemo(() => ({
    tutti: filteredImpianti.length,
    ooh:   filteredImpianti.filter(i => i.canale === 'OOH').length,
    dooh:  filteredImpianti.filter(i => i.canale === 'DOOH').length,
  }), [filteredImpianti]);

  const tabFilteredImpianti = useMemo(() => {
    if (activeTab === 'ooh')  return filteredImpianti.filter(i => i.canale === 'OOH');
    if (activeTab === 'dooh') return filteredImpianti.filter(i => i.canale === 'DOOH');
    return filteredImpianti;
  }, [filteredImpianti, activeTab]);

  const filteredIds = useMemo(() => new Set(tabFilteredImpianti.map(i => i.id)), [tabFilteredImpianti]);

  const activeFilterCount = useMemo(() => {
    const f = appliedFilters;
    return [
      f.statiAmm.length > 0, f.canale.length > 0, f.suolo.length > 0,
      f.mediaOwner.length > 0, f.tipologia.length > 0, f.formato.length > 0,
      f.illuminazione.length > 0, f.numeroFacce.length > 0,
    ].filter(Boolean).length;
  }, [appliedFilters]);

  const removeApplied = useCallback((key, value) => {
    setAppliedFilters(prev => {
      const cur = prev[key];
      if (Array.isArray(cur)) {
        return { ...prev, [key]: cur.filter(v => v !== value) };
      }
      return prev;
    });
    setDraftFilters(prev => {
      const cur = prev[key];
      if (Array.isArray(cur)) {
        return { ...prev, [key]: cur.filter(v => v !== value) };
      }
      return prev;
    });
  }, []);

  const activeFilterChips = useMemo(() => {
    const f = appliedFilters;
    const chips = [];
    const LABEL_MAP = {
      statiAmm:  v => v,
      canale:    v => v,
      suolo:     v => `Suolo ${v}`,
      mediaOwner:v => v,
      tipologia: v => v,
      formato:   v => v,
      illuminazione: v => v === 'Illuminate' ? 'Illuminato' : v === 'Retroilluminate' ? 'Retroilluminato' : 'Non illuminato',
      numeroFacce: v => v === '1' ? '1 faccia' : `${v} facce`,
    };
    ['statiAmm','canale','suolo','mediaOwner','tipologia','formato','illuminazione','numeroFacce'].forEach(key => {
      (f[key] || []).forEach(v => {
        chips.push({ key: `${key}:${v}`, label: LABEL_MAP[key](v), onRemove: () => removeApplied(key, v),
          icon: key === 'tipologia' ? GravityMap.systypeIconSrc(v) : null });
      });
    });
    return chips;
  }, [appliedFilters, removeApplied]);

  const itemRefs = useRef({});

  const handleHighlight = useCallback((id) => {
    setHighlightedId(prev => prev === id ? null : id);
  }, []);

  const handleMarkerClick = useCallback((imp) => {
    setHighlightedId(prev => prev === imp.id ? null : imp.id);
    setCardImp(prev => prev?.id === imp.id ? null : imp);
  }, []);

  const handleToggleAdd = useCallback((id) => {
    if (id === null) {
      setSelectedIds(new Set());
      return;
    }
    setSelectedIds(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  }, []);

  const handleToggleExpand = useCallback((id) => {
    setExpandedIds(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  }, []);



  return React.createElement('div', { className: 'app-shell' },
    React.createElement(window.GravityNavbar, null),

    page === 'detail'
      ? React.createElement(ImpiantoDetailV2, { imp: detailImpianto, onBack: () => setPage('map') })
      : false ? React.createElement(ImpiantoDetailPage, { imp: detailImpianto, onBack: () => setPage('map'), onEdit: () => {
          if (savedFormData) {
            setPrefillData(savedFormData);
          } else {
            const imp = detailImpianto;
            const [via, civico] = (() => { const parts = (imp.indirizzo || '').split(','); return [parts[0] || '', (parts[1] || '').trim()]; })();
            const normalizeFormato = f => f ? f.replace(/([0-9])(cm|m)$/, '$1 $2') : null;
            setPrefillData({
              canale:    imp.canale    || 'OOH',
              tipologia: imp.tipo      || null,
              formato:   normalizeFormato(imp.formato),
              stato:     imp.stato_amm || null,
              illuminato: !!imp.illuminato,
              via, civico,
              citta: 'Palermo', provincia: 'PA',
              lat:  imp.lat ? String(imp.lat) : '',
              lng:  imp.lng ? String(imp.lng) : '',
              zona: imp.zona || '',
            });
          }
          setFullFormOpen(true);
        } })
      : React.createElement('div', { className: 'ooh-workspace' },

      // ── SEARCH BLOCK: tab bar + card ──────────────────
      React.createElement('div', { style: { display: 'flex', flexDirection: 'column', gap: 0, flexShrink: 0 } },

        // Tab bar
        React.createElement('div', { className: 'ss-tab-bar' },
          [
            { key: 'tutti', label: 'Tutti' },
            { key: 'ooh',   label: 'OOH'   },
            { key: 'dooh',  label: 'DOOH'  },
          ].map(tab =>
            React.createElement('button', {
              key: tab.key,
              className: `ss-tab-btn${activeTab === tab.key ? ' active' : ''}`,
              onClick: () => setActiveTab(tab.key),
            }, tab.label)
          )
        ),

      // ── SEARCH CARD ────────────────────────────────────
      React.createElement('div', { className: 'ooh-search-card' },
        React.createElement('div', { className: 'ooh-search-area' },

          // ── Riga header: titolo | searchbar centrata | CTA ──
          React.createElement('div', { style: { display: 'flex', alignItems: 'center' } },

          // Titolo — sinistra (flex:1 per bilanciare)
          React.createElement('div', { style: { flex: 1 } },
            React.createElement('span', { style: { fontSize: 22, fontWeight: 700, color: 'rgba(0,0,0,0.88)', letterSpacing: '-0.3px' } }, 'Parco Impianti'),
          ),

          // Search bar — centro (unified bar)
          React.createElement('div', { className: 'ss-searchbar-wrap', style: { width: 700, flex: 'none' } },

            React.createElement('div', { className: 'ss-unified-bar' },

              // Input zona con tag
              React.createElement('div', {
                className: 'ss-bar-input',
                onClick: () => inputRef.current && inputRef.current.focus(),
              },
                React.createElement('div', { className: 'ss-tag-input-area' },
                  appliedZone && React.createElement('span', { className: 'ss-input-tag' },
                    React.createElement(EnvironmentOutlined, { style: { fontSize: 11, opacity: 0.5 } }),
                    ' ', appliedZone,
                    React.createElement('span', {
                      className: 'ss-input-tag-x',
                      onMouseDown: e => { e.preventDefault(); clearZoneSearch(); },
                    }, '×')
                  ),
                  React.createElement(SearchOutlined, { style: { color: 'rgba(0,0,0,0.3)', fontSize: 14, flexShrink: 0 } }),
                  React.createElement('input', {
                    ref: inputRef,
                    className: 'ss-tag-real-input',
                    placeholder: appliedZone ? 'Aggiungi zona…' : 'Cerca via, quartiere, città, provincia…',
                    value: searchQuery,
                    onChange: e => {
                      setSearchQuery(e.target.value);
                      setShowSugg(e.target.value.length >= 2);
                      if (!e.target.value) clearZoneSearch();
                    },
                    onFocus: () => { if (searchQuery.length >= 2) setShowSugg(true); },
                    onBlur: () => setTimeout(() => setShowSugg(false), 180),
                    onKeyDown: e => {
                      if (e.key === 'Enter') applyZoneSearch();
                      if (e.key === 'Backspace' && !searchQuery && appliedZone) clearZoneSearch();
                    },
                  })
                )
              ),

              React.createElement('div', { className: 'ss-bar-sep' }),

              // Filtri
              React.createElement('button', {
                className: `ss-bar-trigger${activeFilterCount > 0 ? ' active' : ''}`,
                onMouseDown: e => { e.preventDefault(); openFilterDrawer(); },
              },
                React.createElement(SlidersOutlined, { style: { fontSize: 14 } }),
                'Filtri avanzati',
                activeFilterCount > 0 && React.createElement('span', { className: 'ss-bar-count' }, activeFilterCount),
              ),

              React.createElement('div', { className: 'ss-bar-sep' }),

              // Cerca (default)
              React.createElement('button', {
                className: 'ss-bar-cerca',
                onClick: () => applyZoneSearch(),
              },
                React.createElement(SearchOutlined, { style: { fontSize: 14 } }),
                'Cerca',
              ),

            ), // ss-unified-bar

            // Dropdown suggerimenti
            showSugg && (suggestions.length > 0 || addrSugg.length > 0) && React.createElement('div', { className: 'ss-suggestions-wrap' },
              suggestions.map(group =>
                React.createElement(React.Fragment, { key: group.key },
                  React.createElement('div', { className: 'ss-sugg-group-title' }, group.label),
                  group.items.map(s => {
                    const cfg = SUGG_CONFIG[s.type] || SUGG_CONFIG.area;
                    return React.createElement('div', {
                      key: s.text,
                      className: 'ss-suggestion-item',
                      onMouseDown: () => { setSearchQuery(s.text); applyZoneSearch(s.text, s); },
                    },
                      React.createElement('div', {
                        style: { width: 28, height: 28, borderRadius: 6, background: cfg.bg,
                          display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }
                      },
                        React.createElement(EnvironmentOutlined, { style: { fontSize: 12, color: cfg.color } })
                      ),
                      React.createElement('div', { style: { flex: 1, minWidth: 0 } },
                        React.createElement('div', { style: { fontSize: 13, color: 'rgba(0,0,0,0.85)', lineHeight: '18px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } },
                          highlightMatch(s.text, searchQuery)
                        ),
                        React.createElement('div', { style: { fontSize: 11, color: 'rgba(0,0,0,0.38)', lineHeight: '16px', marginTop: 1 } }, s.detail)
                      ),
                      React.createElement('span', {
                        style: { fontSize: 10, fontWeight: 600, padding: '1px 6px', borderRadius: 3,
                          background: cfg.bg, color: cfg.color, border: `1px solid ${cfg.color}33`,
                          flexShrink: 0, textTransform: 'uppercase', letterSpacing: '.04em' }
                      }, cfg.label)
                    );
                  })
                )
              ),
              addrSugg.length > 0 && React.createElement(React.Fragment, { key: 'addr-group' },
                React.createElement('div', { className: 'ss-sugg-group-title' }, 'Indirizzi'),
                addrSugg.map(s => React.createElement('div', {
                  key: s.id, className: 'ss-suggestion-item',
                  onMouseDown: () => { setSearchQuery(s.display); setShowSugg(false); setFlyToTarget({ lat: s.lat, lng: s.lng, zoom: 16, _ts: Date.now() }); },
                },
                  React.createElement('div', { style: { width: 28, height: 28, borderRadius: 6, background: '#F0EEFF', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 } },
                    React.createElement(EnvironmentOutlined, { style: { fontSize: 12, color: '#3E00FB' } })
                  ),
                  React.createElement('div', { style: { flex: 1, minWidth: 0 } },
                    React.createElement('div', { style: { fontSize: 13, color: 'rgba(0,0,0,0.85)', lineHeight: '18px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } },
                      [s.via, s.civico].filter(Boolean).join(' ') || s.display
                    ),
                    React.createElement('div', { style: { fontSize: 11, color: 'rgba(0,0,0,0.38)', lineHeight: '16px', marginTop: 1 } }, s.sub || s.display)
                  )
                ))
              ),
            ),

          ), // ss-searchbar-wrap

          // CTA — destra (flex:1 per bilanciare, allineato a destra)
          React.createElement('div', { style: { flex: 1, display: 'flex', justifyContent: 'flex-end' } },
            React.createElement(Space, null,
              React.createElement(Dropdown, {
                menu: {
                  items: [
                    { key: 'nuova-tipologia', label: 'Aggiungi tipologia' },
                    { key: 'nuovo-formato',   label: 'Aggiungi formato' },
                  ],
                },
                trigger: ['click'],
                placement: 'bottomRight',
              },
                React.createElement(Button, {
                  icon: React.createElement(PlusOutlined),
                }, 'Aggiungi'),
              ),
              React.createElement(Button, {
                type: 'primary',
                icon: React.createElement(PlusOutlined),
                onClick: () => setFullFormOpen(true),
              }, 'Nuovo Impianto'),
            ),
          ),

          ), // riga header

          // ── Chips filtri attivi ──
          activeFilterChips.length > 0 && React.createElement('div', { className: 'ss-active-filters' },
            activeFilterChips.map(chip =>
              React.createElement('span', { key: chip.key, className: 'ss-filter-chip' },
                chip.icon && React.createElement('img', { src: chip.icon, style: { width: 12, height: 12, marginRight: 4, verticalAlign: 'middle', display: 'inline-block', flexShrink: 0 } }),
                chip.label,
                React.createElement('span', {
                  className: 'ss-filter-chip-x',
                  onClick: chip.onRemove,
                }, '×')
              )
            )
          ),

        ),
      ), // ooh-search-card
      ), // search block wrapper

      // ── MAP / LIST AREA ────────────────────────────────
      viewMode === 'map'
        ? React.createElement('div', { className: 'ooh-map-area' },

            React.createElement(GoogleMap, {
              impianti:         geocodedImpianti,
              highlightedId,
              selectedIds,
              filteredIds,
              onSelect:         handleHighlight,
              onMarkerClick:    handleMarkerClick,
              cardImp,
              onCardClose:      () => { setCardImp(null); setHighlightedId(null); },
              onDetail:         (imp) => { setDetailImpianto(imp); setSavedFormData(null); setPage('detail'); },
              flyToTarget,
            }),


            !cardImp && React.createElement(MapInfobox, {
              total:             tabFilteredImpianti.length,
              filteredImpianti:  tabFilteredImpianti,
            }),

            // View toggle — floating top-right
            React.createElement('div', {
              style: { position: 'absolute', top: 16, right: 16, zIndex: 450 },
            },
              React.createElement(Segmented, {
                value: viewMode,
                onChange: setViewMode,
                style: { boxShadow: '0 2px 8px rgba(0,0,0,0.14)' },
                options: [
                  { value: 'map',  icon: React.createElement(EnvironmentOutlined), label: 'Mappa' },
                  { value: 'list', icon: React.createElement(BarsOutlined),        label: 'Lista' },
                ],
              })
            ),
          )
        : React.createElement(ListView, { impianti: tabFilteredImpianti, viewMode, setViewMode, onDetail: (imp) => { setDetailImpianto(imp); setSavedFormData(null); setPage('detail'); } })
    ),

    // ── Drawer: Filtri (componente condiviso GravityFilterDrawer) ──
    React.createElement(window.GravityFilterDrawer, {
      open: filterDrawerOpen,
      onClose: () => setFilterDrawerOpen(false),
      onApply: applyFilters,
      onReset: resetFilters,
      activeCount: activeFilterCount,
      sections: ['statiAmm', 'canale', 'suolo', 'mediaOwner', 'tipologia', 'numeroFacce', 'illuminazione', 'formato'],
      values: draftFilters,
      onChange: setDraft,
      options: { allTypes: MACRO_TIPI, typeFormats: TIPO_FORMATI, allFormats: ALL_TIPO_FORMATI },
    }),

    React.createElement(NewImpiantoModal, {
      open: modalOpen,
      onClose: () => setModalOpen(false),
      onCrea: (imp) => {
        setDetailImpianto(imp);
        setPage('detail');
      },
      onContinua: (data) => {
        setPrefillData(data);
        setModalOpen(false);
        setFullFormOpen(true);
      },
    }),
    React.createElement(NewImpiantoFullDrawer, {
      open: fullFormOpen,
      onClose: () => setFullFormOpen(false),
      initialValues: prefillData,
      onSave: (data) => {
        setSavedFormData(data);
        // Aggiungi davvero il nuovo impianto alla mappa/lista (se ha coordinate dal geocoding indirizzo)
        const lat = parseFloat(data.lat), lng = parseFloat(data.lng);
        if (isFinite(lat) && isFinite(lng)) {
          const newImp = {
            id: 'NEW-' + Date.now(),
            tipo: data.tipologia || 'Speciale',
            indirizzo: [data.via, data.civico].filter(Boolean).join(', ') || data.citta || 'Nuovo impianto',
            zona: data.zona || data.citta || '—',
            lat: lat, lng: lng,
            faces: (data.facce && data.facce.length) || 1,
            formato: data.formato || '',
            stato: 'Disponibile',
            illuminato: !!(data.facce && data.facce.some(x => x.illumStato && x.illumStato !== 'Spento')),
            stato_amm: data.stato || 'Attivo',
          };
          setGeocodedImpianti(prev => [...prev, newImp]);
          setFlyToTarget({ lat: lat, lng: lng, zoom: 16, _ts: Date.now() });
        }
      },
    }),
  );
}

// ─────────────────────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────────────────────
window.applyGravityTokens && window.applyGravityTokens();
ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(ConfigProvider, { theme: window.GRAVITY_THEME },
    React.createElement(App)
  )
);
</script>
</body>
</html>
