// ── DonutChart ──────────────────────────────────────────────────────────────────
function DonutChart({ segments, centerLine1, centerLine2 }) {
  const total = segments.reduce((s, x) => s + x.value, 0);
  const r = 50;
  const cx = 72;
  const cy = 72;
  const circ = 2 * Math.PI * r;
  let drawn = 0;
  const arcs = segments.map(seg => {
    const len = (seg.value / total) * circ;
    const arc = {
      ...seg,
      dasharray: `${len} ${circ - len}`,
      dashoffset: -drawn,
    };
    drawn += len;
    return arc;
  });

  const line1 = centerLine1 !== undefined ? centerLine1 : segments.length;
  const line2 = centerLine2 !== undefined ? centerLine2 : 'Canali';

  return React.createElement('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center' } },
    React.createElement('svg', { width: 144, height: 144, viewBox: '0 0 144 144' },
      React.createElement('circle', { cx, cy, r, fill: 'none', stroke: '#f0f0f0', strokeWidth: 18 }),
      ...arcs.map((arc, i) =>
        React.createElement('circle', {
          key: i, cx, cy, r,
          fill: 'none',
          stroke: arc.color,
          strokeWidth: 18,
          strokeDasharray: arc.dasharray,
          strokeDashoffset: arc.dashoffset,
          transform: `rotate(-90 ${cx} ${cy})`,
        })
      ),
      React.createElement('text', {
        x: cx, y: cy - 6,
        textAnchor: 'middle',
        fontSize: 18, fontWeight: 700,
        fill: 'rgba(0,0,0,0.88)',
        fontFamily: "-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif",
      }, line1),
      React.createElement('text', {
        x: cx, y: cy + 13,
        textAnchor: 'middle',
        fontSize: 11,
        fill: 'rgba(0,0,0,0.45)',
        fontFamily: "-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif",
      }, line2)

const AVATAR_PALETTE = [
  { bg: '#F0EAFF', fg: '#3E00FB' },
  { bg: '#E6F7FF', fg: '#0958D9' },
  { bg: '#FFF7E6', fg: '#D46B08' },
  { bg: '#F6FFED', fg: '#389E0D' },
  { bg: '#FFF1F0', fg: '#CF1322' },
  { bg: '#E8F5E9', fg: '#2E7D32' },
];
function nameColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
  return AVATAR_PALETTE[Math.abs(h) % AVATAR_PALETTE.length];
}
function AdvertiserAvatar({ name, size = 24 }) {
  const [logoFailed, setLogoFailed] = React.useState(false);
  const logoUrl = ADVERTISER_LOGOS[name];
  const initials = name.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  const { bg, fg } = nameColor(name);

  if (logoUrl && !logoFailed) {
    return React.createElement(Avatar, {
      size,
      shape: 'circle',
      src: logoUrl,
      style: { flexShrink: 0, background: '#fff', border: '1px solid rgba(0,0,0,0.08)', padding: 2 },
      onError: () => { setLogoFailed(true); return false; },
    });
  }
  return React.createElement(Avatar, {
    size,
    shape: 'circle',
    style: { background: bg, color: fg, fontWeight: 700, fontSize: size * 0.38, flexShrink: 0 },
  }, initials);
}

              onCreaStrategia: handleCreaStrategia,
              onVediStrategia: handleVediStrategia,
              onVediDettaglio: handleVediDettaglio,
            })
          : view === 'dettaglio'
          ? React.createElement(TrattativaDetailView, {
              trattativa: currentTrattativa,
              onBack: () => setView('lista'),
              onVediStrategia: handleVediStrategia,
            })
          : React.createElement(ConfiguratoreView, {
              trattativa: currentTrattativa,
              strategia: currentStrategia,
              onBack: () => setView('lista'),
            })
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(AppRoot));
</script>

  <script src="../../handoff.js"></script>
</body>
