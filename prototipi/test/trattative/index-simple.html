// ── DonutChart ──────────────────────────────────────────────────────────────────
function DonutChart({ segments }) {
  const total = segments.reduce((s, x) => s + x.value, 0);
  const r = 50;
  const cx = 72;
  const cy = 72;
  const circ = 2 * Math.PI * r;
  let drawn = 0;
  const arcs = segments.map(seg => {
    const len = (seg.value / total) * circ;
    const arc = {
      ...seg,
      dasharray: `${len} ${circ - len}`,
      dashoffset: -drawn,
    };
    drawn += len;
    return arc;
  });

  return React.createElement('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center' } },
    React.createElement('svg', { width: 144, height: 144, viewBox: '0 0 144 144' },
      React.createElement('circle', { cx, cy, r, fill: 'none', stroke: '#f0f0f0', strokeWidth: 18 }),
      ...arcs.map((arc, i) =>
        React.createElement('circle', {
          key: i, cx, cy, r,
          fill: 'none',
          stroke: arc.color,
          strokeWidth: 18,
          strokeDasharray: arc.dasharray,
          strokeDashoffset: arc.dashoffset,
          transform: `rotate(-90 ${cx} ${cy})`,
        })
      ),
      React.createElement('text', {
        x: cx, y: cy - 6,
        textAnchor: 'middle',
        fontSize: 24, fontWeight: 700,
        fill: 'rgba(0,0,0,0.88)',
        fontFamily: "-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif",
      }, segments.length),
      React.createElement('text', {
        x: cx, y: cy + 14,
        textAnchor: 'middle',
        fontSize: 11,
        fill: 'rgba(0,0,0,0.45)',
        fontFamily: "-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif",
      }, 'Canali')
    ),
    React.createElement('div', { className: 'donut-legend' },
      arcs.map(arc =>
        React.createElement('div', { key: arc.label, className: 'legend-item' },
          React.createElement('span', { className: 'legend-dot', style: { background: arc.color } }),
          React.createElement('span', null, arc.label),
          React.createElement('span', { style: { color: 'rgba(0,0,0,0.45)', marginLeft: 4 } },
            EUR(arc.value)
          )
        )
      )
    )
  );
}

// ── AstronautSVG ─────────────────────────────────────────────────────────────────
function AstronautSVG({ size = 80 }) {

  );

// ── WizardModal ─────────────────────────────────────────────────────────────────
function WizardModal({ open, trattativaNome, budgetTot, onClose, onComplete }) {
  const [step, setStep] = useState(0);
  const [channels, setChannels] = useState([]);
  const [objective, setObjective] = useState(null);
  const [pctOOH, setPctOOH] = useState(50);

  const allChannels = [
    { key: 'OOH',        label: 'OOH (Out Of Home)',           enabled: true },
    { key: 'DOOH',       label: 'DOOH (Digital Out Of Home)',  enabled: true },
    { key: 'Web',        label: 'Web',                         enabled: true },
    { key: 'Dinamica',   label: 'Dinamica',                    enabled: true },
    { key: 'Aeroporto',  label: 'Aeroporto',                   enabled: true },
    { key: 'Advertorial',label: 'Advertorial',                 enabled: false },
  ];

  const objectives = [
    { key: 'brand',          title: 'Consapevolezza del brand',  desc: 'Aumenta la visibilità e il riconoscimento del tuo brand presso il tuo pubblico.' },
    { key: 'fidelizzazione', title: 'Fidelizzazione dei clienti', desc: 'Costruisci fedeltà e mantieni coinvolti i tuoi clienti nel tempo.' },
    { key: 'traffico',       title: 'Traffico',                   desc: 'Porta più visitatori al tuo sito web o ai tuoi canali digitali.' },
    { key: 'lead',           title: 'Generazione di lead',        desc: 'Attira potenziali clienti e raccogli contatti qualificati.' },
    { key: 'coinvolgimento', title: 'Coinvolgimento',              desc: 'Favorisci le interazioni e rafforza le relazioni con il tuo pubblico.' },
    { key: 'conversione',    title: 'Conversione',                 desc: 'Trasforma i visitatori o i lead in clienti attivi.' },
  ];

  const toggleChannel = (key) =>
    setChannels(prev => prev.includes(key) ? prev.filter(c => c !== key) : [...prev, key]);

  const bothChannels = channels.includes('OOH') && channels.includes('DOOH');
  const pctDOOH = 100 - pctOOH;
  const budgetOOH = channels.includes('OOH') ? budgetTot * (bothChannels ? pctOOH / 100 : 1) : 0;
  const budgetDOOH = channels.includes('DOOH') ? budgetTot * (bothChannels ? pctDOOH / 100 : 1) : 0;

  const objLabel = objectives.find(o => o.key === objective)?.title;

  const handleClose = () => {
    setStep(0); setChannels([]); setObjective(null); setPctOOH(50);
    onClose();
  };

  const handleComplete = () => {
    onComplete({ channels, objective, budgetOOH, budgetDOOH });
    setStep(0); setChannels([]); setObjective(null); setPctOOH(50);
  };

  const stepContent = [
    // ── Step 0: Canali ──
    React.createElement('div', null,
      React.createElement('h3', { style: { fontSize: 20, fontWeight: 600, marginBottom: 6 } }, 'Scegli i canali di comunicazione'),
      React.createElement('p', { style: { color: 'rgba(0,0,0,0.45)', fontSize: 14, marginBottom: 24 } },
        'Seleziona uno o più canali che si adattano meglio alle esigenze dei tuoi clienti.'
      ),
      allChannels.map(ch =>
        React.createElement('div', {
          key: ch.key,
          className: `channel-option${channels.includes(ch.key) ? ' selected' : ''}${!ch.enabled ? ' disabled' : ''}`,
          onClick: () => ch.enabled && toggleChannel(ch.key),
        },
          React.createElement(Checkbox, {
            checked: channels.includes(ch.key),
            disabled: !ch.enabled,
            onClick: e => e.stopPropagation(),
            onChange: () => ch.enabled && toggleChannel(ch.key),
          }),
          React.createElement('span', { style: { fontSize: 14, color: ch.enabled ? 'rgba(0,0,0,0.88)' : 'rgba(0,0,0,0.25)' } }, ch.label)
        )
      )
    ),

    // ── Step 1: Obiettivo ──
    React.createElement('div', null,
      React.createElement('h3', { style: { fontSize: 20, fontWeight: 600, marginBottom: 6 } }, 'Imposta un obiettivo'),
      React.createElement('p', { style: { color: 'rgba(0,0,0,0.45)', fontSize: 14, marginBottom: 24 } },
        'Seleziona quello che rappresenta meglio ciò che il tuo cliente desidera ottenere di più.'
      ),
      React.createElement('div', { className: 'objective-grid' },
        objectives.map(obj =>
          React.createElement('div', {
            key: obj.key,
            className: `objective-card${objective === obj.key ? ' selected' : ''}`,
            onClick: () => setObjective(obj.key),
          },
            React.createElement('h4', null, obj.title),
            React.createElement('p', null, obj.desc)
          )
        )
      ),
      React.createElement('div', { className: 'wizard-summary' },
        React.createElement('span', { style: { fontWeight: 600 } }, 'Canali: '),
        channels.join(', ') || '—'
      )
    ),

    // ── Step 2: Budget ──
    React.createElement('div', null,
      React.createElement('h3', { style: { fontSize: 20, fontWeight: 600, marginBottom: 6 } }, 'Allocazione del Budget'),
      React.createElement('p', { style: { color: 'rgba(0,0,0,0.65)', fontSize: 14, marginBottom: 16 } },
        'Distribuisci il tuo budget di negoziazione tra i canali selezionati nel Passo 1.'
      ),
      React.createElement(Alert, {
        type: 'warning',
        showIcon: true,
        icon: React.createElement('span', { style: { fontSize: 13 } }, '💡'),
        message: 'Suggerimento: Se preferisci definire i prezzi tramite la pianificazione, imposta il budget di negoziazione a 0 e crea direttamente la tua strategia.',
        style: { marginBottom: 20, fontSize: 13 },
      }),
      React.createElement('div', { style: { marginBottom: 20 } },
        React.createElement('span', { style: { fontSize: 13, color: 'rgba(0,0,0,0.65)' } }, 'Budget di trattativa: '),
        React.createElement('span', { style: { fontSize: 13, fontWeight: 600 } }, EUR(budgetTot))
      ),
      channels.includes('OOH') && React.createElement('div', { style: { marginBottom: 20 } },
        React.createElement('p', { style: { fontWeight: 600, fontSize: 14, marginBottom: 10 } }, 'Canale: OOH'),
        bothChannels && React.createElement(Slider, {
          value: pctOOH,
          onChange: v => setPctOOH(v),
          min: 0, max: 100,
          tooltip: { formatter: v => `${v}%` },
          style: { marginBottom: 10 },
        }),
        React.createElement(Space, null,
          React.createElement(InputNumber, {
            value: Math.round(budgetOOH * 100) / 100,
            readOnly: true,
            style: { width: 180 },
            formatter: v => new Intl.NumberFormat('it-IT').format(v),
          }),
          React.createElement('span', null, '€')
        )
      ),
      channels.includes('DOOH') && React.createElement('div', { style: { marginBottom: 20 } },
        React.createElement('p', { style: { fontWeight: 600, fontSize: 14, marginBottom: 10 } }, 'Canale: DOOH'),
        bothChannels && React.createElement(Slider, {
          value: pctDOOH,
          onChange: v => setPctOOH(100 - v),
          min: 0, max: 100,
          tooltip: { formatter: v => `${v}%` },
          style: { marginBottom: 10 },
        }),
        React.createElement(Space, null,
          React.createElement(InputNumber, {
            value: Math.round(budgetDOOH * 100) / 100,
            readOnly: true,
            style: { width: 180 },
            formatter: v => new Intl.NumberFormat('it-IT').format(v),
          }),
          React.createElement('span', null, '€')
        )
      ),
      React.createElement('div', { className: 'wizard-summary' },
        React.createElement('div', null,
          React.createElement('span', { style: { fontWeight: 600 } }, 'Canali: '), channels.join(', ') || '—'
        ),
        React.createElement('div', null,
          React.createElement('span', { style: { fontWeight: 600 } }, 'Obiettivo: '), objLabel || '—'
        ),
        React.createElement('div', { style: { marginTop: 4 } }, 'Allocazioni:'),
        channels.includes('OOH') && React.createElement('div', { style: { paddingLeft: 12 } }, `• OOH: ${EUR(budgetOOH)}`),
        channels.includes('DOOH') && React.createElement('div', { style: { paddingLeft: 12 } }, `• DOOH: ${EUR(budgetDOOH)}`)
      )
    ),
  ];

  const canNext = step === 0 ? channels.length > 0 : step === 1 ? !!objective : true;

  return React.createElement(Modal, {
    open,
    onCancel: handleClose,
    width: 700,
    footer: null,
    title: React.createElement('div', { style: { fontSize: 16, fontWeight: 600 } },
      'Nuova Strategia',
      React.createElement('span', { style: { color: 'rgba(0,0,0,0.45)', fontWeight: 400, marginLeft: 8 } },
        `| ${trattativaNome}`
      )
    ),
  },
    React.createElement('div', { style: { padding: '8px 0 0' } },
      React.createElement(Steps, {
        current: step,
        size: 'small',
        items: [{ title: 'Canale' }, { title: 'Obiettivo' }, { title: 'Budget' }],
        style: { marginBottom: 28 },
      }),
      stepContent[step],
      React.createElement('div', {
        style: {
          display: 'flex', justifyContent: 'flex-end', gap: 8,
          marginTop: 24, paddingTop: 16, borderTop: '1px solid #f0f0f0',
        },
      },
        step === 0
          ? React.createElement(Button, { onClick: handleClose }, 'Cancella')
          : React.createElement(Button, { onClick: () => setStep(s => s - 1) }, 'Indietro'),
        step < 2
          ? React.createElement(Button, {
              type: 'primary',
              disabled: !canNext,
              onClick: () => setStep(s => s + 1),
            }, 'Avanti')
          : React.createElement(Button, {
              type: 'primary',
              onClick: handleComplete,
            }, 'Crea Strategia')
      )
    )
  );
}

// ── AddCampagnaModal ────────────────────────────────────────────────────────────
function AddCampagnaModal({ open, canale, budgetTot, onClose, onAdd }) {
  const [nome, setNome] = useState('');
  const [pct, setPct] = useState(100);
  const [durata, setDurata] = useState('standard');
  const [datePeriod, setDatePeriod] = useState(null);
  const [soggetti, setSoggetti] = useState(1);
  const [costiGrafica, setCostiGrafica] = useState(false);
  const [costiStampa, setCostiStampa] = useState(false);

  const budgetVal = budgetTot * pct / 100;

const AVATAR_PALETTE = [
  { bg: '#F0EAFF', fg: '#3E00FB' },
  { bg: '#E6F7FF', fg: '#0958D9' },
  { bg: '#FFF7E6', fg: '#D46B08' },
  { bg: '#F6FFED', fg: '#389E0D' },
  { bg: '#FFF1F0', fg: '#CF1322' },
  { bg: '#E8F5E9', fg: '#2E7D32' },
];
function nameColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
  return AVATAR_PALETTE[Math.abs(h) % AVATAR_PALETTE.length];
}
function AdvertiserAvatar({ name, size = 24 }) {
  const [logoFailed, setLogoFailed] = React.useState(false);
  const logoUrl = ADVERTISER_LOGOS[name];
  const initials = name.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  const { bg, fg } = nameColor(name);

  if (logoUrl && !logoFailed) {
    return React.createElement(Avatar, {
      size,
      shape: 'circle',
      src: logoUrl,
      style: { flexShrink: 0, background: '#fff', border: '1px solid rgba(0,0,0,0.08)', padding: 2 },
      onError: () => { setLogoFailed(true); return false; },
    });
  }
  return React.createElement(Avatar, {
    size,
    shape: 'circle',
    style: { background: bg, color: fg, fontWeight: 700, fontSize: size * 0.38, flexShrink: 0 },
  }, initials);
}

// ── AppRoot ───────────────────────────────────────────────────────────────────
function AppRoot() {
  const [view, setView] = useState('lista');
  const [currentTrattativa, setCurrentTrattativa] = useState(null);
  const [currentStrategia, setCurrentStrategia] = useState(null);

  // Default strategia per "Vedi Strategia" (trattative già con strategia)
  const defaultStrategia = {
    channels: ['OOH', 'DOOH'],
    objective: 'brand',
    budgetOOH: 3338433.50,
    budgetDOOH: 3338433.50,
  };

  const handleVediStrategia = (row) => {
    setCurrentTrattativa(row);
    setCurrentStrategia(defaultStrategia);
    setView('configuratore');
  };

  const handleCreaStrategia = (row, data) => {
    setCurrentTrattativa(row);
    setCurrentStrategia(data);
    setView('configuratore');
  };

  return React.createElement(ConfigProvider, { theme: window.GRAVITY_THEME },
    React.createElement(App, null,
      React.createElement('div', { className: 'app-shell' },
        React.createElement(window.GravityNavbar),
        view === 'lista'
          ? React.createElement(ListaView, {
              onCreaStrategia: handleCreaStrategia,
              onVediStrategia: handleVediStrategia,
            })
          : React.createElement(ConfiguratoreView, {
              trattativa: currentTrattativa,
              strategia: currentStrategia,
              onBack: () => setView('lista'),
            })
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(AppRoot));
