  const out = [];
  const max = Math.max.apply(null, lists.map((l) => l.length));
  for (let i = 0; i < max; i++) lists.forEach((l) => { if (i < l.length) out.push(l[i]); });

};

// ── Tenant switcher (dropdown con loghi aziendali) ────────────────────────────
function TenantSwitcher({ tenantKey, onTenantChange, loading }) {
  const h = React.createElement;
  const [open, setOpen] = useState(false);
  const tenant = TENANTS[tenantKey];

  const logoBox = (t, size) => h('div', {
    style: {
      width: size, height: size, borderRadius: 6, overflow: 'hidden', flexShrink: 0,
      background: '#fff', border: '1px solid rgba(0,0,0,0.06)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
    },
  },
    h('img', {
      src: t.logo, alt: t.name,
      style: { width: '100%', height: '100%', objectFit: 'contain' },
      onError: (e) => { e.target.style.display = 'none'; },
    })
  );

  return h('div', { style: { position: 'relative' } },
    h('button', {
      type: 'button',
      className: 'gv-tenant-trigger',
      onClick: () => setOpen((v) => !v),
      style: {
        display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer',
        border: 'none', background: 'transparent', borderRadius: 8, padding: '4px 8px',
        transition: 'background 0.15s ease',
      },
    },
      h('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'flex-start', lineHeight: 1 } },
        h('span', { style: { fontSize: 10, color: 'rgba(0,0,0,0.35)', letterSpacing: '0.04em', marginBottom: 4 } }, 'AZIENDA'),
        h('span', { style: { fontSize: 13, fontWeight: 600, color: 'rgba(0,0,0,0.88)', maxWidth: 150, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, tenant.name)
      ),
      loading
        ? h(LoadingOutlined, { style: { fontSize: 12, color: '#3E00FB' }, spin: true })
        : h(DownOutlined, { style: { fontSize: 10, color: 'rgba(0,0,0,0.45)' } })
    ),

    open && h(React.Fragment, null,
      h('div', { style: { position: 'fixed', inset: 0, zIndex: 10 }, onClick: () => setOpen(false) }),
      h('div', {
        style: {
          position: 'absolute', right: 0, top: 'calc(100% + 8px)', zIndex: 20,
          background: '#fff', borderRadius: 8, minWidth: 260, padding: '6px 0',
          border: '1px solid #f0f0f0', boxShadow: '0 6px 16px rgba(0,0,0,0.08)',
        },
      },
        h('div', { style: { padding: '6px 12px', fontSize: 11, textTransform: 'uppercase', letterSpacing: '0.08em', color: 'rgba(0,0,0,0.45)' } }, 'Cambia tenant'),
        Object.values(TENANTS).map((t) => {
          const active = t.key === tenantKey;
          return h('button', {
            key: t.key,
            type: 'button',
            onClick: () => { setOpen(false); onTenantChange(t.key); },
            style: {
              width: '100%', textAlign: 'left', display: 'flex', alignItems: 'center', gap: 10,
              padding: '8px 12px', border: 'none', background: active ? 'rgba(62,0,251,0.04)' : 'transparent',
              cursor: 'pointer',
            },
            onMouseEnter: (e) => { if (!active) e.currentTarget.style.background = 'rgba(62,0,251,0.04)'; },
            onMouseLeave: (e) => { if (!active) e.currentTarget.style.background = 'transparent'; },
          },
            logoBox(t, 28),
            h('div', { style: { display: 'flex', flexDirection: 'column', flex: 1, minWidth: 0 } },
              h('span', { style: { fontSize: 13, fontWeight: 600, color: 'rgba(0,0,0,0.88)' } }, t.name),
              h('span', { style: { fontSize: 11, color: 'rgba(0,0,0,0.45)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, t.company)
            ),
            active && h(CheckOutlined, { style: { color: '#3E00FB', fontSize: 12 } })
          );
        })
      )
    )
  );
}

// ── GravityNavbarTenant — navbar role-driven + tenant switcher ────────────────
function GravityNavbarTenant({ role, onRoleChange, tenantKey, onTenantChange, tenantLoading, avatarSrc }) {
  const h = React.createElement;

  const user    = ROLE_USER[role] || { nome: 'U', cognome: '' };
  const abbr    = (user.nome[0] + (user.cognome[0] || '')).toUpperCase();
  const palette = nameColor(user.nome + ' ' + user.cognome);
  // "Panoramica" (con "Per te") è l'area personale: sempre disponibile per ogni ruolo,
  // anche se non elencata in ROLE_NAV (es. Sales). La forziamo come prima sezione.
  const sections = ['Overview', ...(ROLE_NAV[role] || []).filter((s) => s !== 'Overview')];

  const menuItems = sections.map((sec) => {
    const conf = NAV[sec];
    return {
      key: sec,
      label: SECTION_LABEL[sec] || sec,
      children: conf.items.map((item) => {
        const link = conf.links[item];
        const lbl  = ITEM_LABEL[item] || item;
        return {
          key: sec + '/' + item,
          label: link
            ? h('a', { href: link }, lbl)
            : h(Popover, { content: 'Funzionalità da implementare', placement: 'right' },
                h('span', { style: { color: 'rgba(0,0,0,0.25)', cursor: 'not-allowed' } }, lbl)
              ),
        };
      }),
    };
  });

  const avatarMenuItems = [
    {
      key: '_user', disabled: true,
      label: h('div', { style: { padding: '4px 0 8px', minWidth: 200, display: 'flex', alignItems: 'center', gap: 12 } },
        h('div', {
          style: {
            width: 40, height: 40, borderRadius: '50%', flexShrink: 0,
            background: palette.bg, border: '1.5px solid ' + palette.fg + '22',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          },
        }, h('span', { style: { color: palette.fg, fontSize: 13, fontWeight: 700 } }, abbr)),
        h('div', null,
          h('div', { style: { fontWeight: 600, fontSize: 14, color: 'rgba(0,0,0,0.88)', lineHeight: '22px' } },
            user.nome + ' ' + user.cognome),
          h('div', { style: { fontSize: 12, color: 'rgba(0,0,0,0.45)' } }, role)
        )
      ),
    },

    h(Button, { icon: h(FilterOutlined), onClick: () => setOpen((v) => !v) },
      label, h(DownOutlined, { style: { fontSize: 10, marginLeft: 4 } })
    ),
    open && h(React.Fragment, null,
      h('div', { style: { position: 'fixed', inset: 0, zIndex: 10 }, onClick: () => setOpen(false) }),
      h('div', {
        style: { position: 'absolute', right: 0, top: 'calc(100% + 6px)', zIndex: 20,
          background: '#fff', borderRadius: 8, minWidth: 200, padding: '6px 0',
          border: '1px solid #f0f0f0', boxShadow: '0 6px 16px rgba(0,0,0,0.08)' },
      },
        h('div', {
          onClick: onClear,
          style: { display: 'flex', alignItems: 'center', gap: 10, padding: '8px 12px', cursor: 'pointer' },
        },
          h(Checkbox, { checked: selected.length === 0 }),
          h('span', { style: { fontSize: 14, color: 'rgba(0,0,0,0.88)' } }, 'Tutte le attività')
        ),
        h('div', { style: { borderTop: '1px solid #f0f0f0', margin: '4px 12px' } }),
        categories.map((c) => {
          const s = catStyle(c);
          return h('div', {
            key: c,
            onClick: () => onToggle(c),
            style: { display: 'flex', alignItems: 'center', gap: 10, padding: '8px 12px', cursor: 'pointer' },
          },
            h(Checkbox, { checked: selected.includes(c) }),
            h('span', { style: { width: 8, height: 8, borderRadius: '50%', background: s.color, flexShrink: 0 } }),
            h('span', { style: { fontSize: 14, color: 'rgba(0,0,0,0.88)' } }, c)
          );
        })
      )
    )
  );
}

function TaskColumn({ tasks, label }) {
  return React.createElement('div', { style: { flex: 1, minWidth: 0 } },
    React.createElement('div', { style: { padding: '0 6px 12px', display: 'flex', alignItems: 'center', gap: 8 } },
      React.createElement(Text, {
        style: { fontSize: 12, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.08em', color: 'rgba(0,0,0,0.45)' },
      }, label),
      React.createElement('span', {
        style: { background: 'rgba(62,0,251,0.08)', color: '#3E00FB', borderRadius: 10, padding: '0 6px', fontSize: 11, fontWeight: 600 },
      }, tasks.length)
    ),
    tasks.length === 0
      ? React.createElement('div', { style: { padding: '24px 0', textAlign: 'center', fontSize: 13, color: 'rgba(0,0,0,0.35)' } },
          'Nessuna attività per i filtri selezionati')
      : React.createElement(Space, { direction: 'vertical', size: 8, style: { width: '100%' } },
          tasks.map((t, i) => React.createElement(TaskCard, { key: i, ...t }))

}

const PRIORITY_RANK = { high: 0, medium: 1, low: 2 };

// Marker nota di design (icona Coffee rossa) — popover in hover. Riusato in più punti.
function DesignNoteBulb({ note, placement }) {
  return React.createElement(Popover, {
    trigger: 'hover', placement: placement || 'top',
    content: React.createElement('div', { style: { maxWidth: 300 } },
      React.createElement('div', { style: { fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.04em', color: '#FF4A1C', marginBottom: 6 } }, 'Nota di design'),
      React.createElement('div', { style: { fontSize: 13, lineHeight: 1.55, color: 'rgba(0,0,0,0.65)' } }, note)
    ),
  },
    React.createElement('span', { style: { display: 'inline-flex', alignItems: 'center', cursor: 'help', color: '#FF4A1C' } },
      React.createElement(icons.CoffeeOutlined, { style: { fontSize: 15 } }))
  );
}

function ActivitiesSection({ role, onOpenHistory }) {
  const all = ROLE_PENDING[role] || [];
  const studied = STUDIED_ROLES.includes(role) && all.length > 0;

  // Ruolo non ancora studiato → attività placeholder (vuote) + nota
  if (!studied) {
    return React.createElement('div', { style: { display: 'flex', flexDirection: 'column', gap: 16, width: '100%' } },
      React.createElement(Title, { level: 4, style: { margin: 0 } }, 'Le tue attività'),
      React.createElement('div', { style: { border: '1px dashed #d9d9d9', borderRadius: 8, background: '#fafafa', padding: '36px 24px' } },
        React.createElement(antd.Empty, {
          image: antd.Empty.PRESENTED_IMAGE_SIMPLE,
          description: React.createElement('div', { style: { maxWidth: 440, margin: '0 auto', lineHeight: 1.6 } },
            React.createElement('div', { style: { fontSize: 14, fontWeight: 600, color: 'rgba(0,0,0,0.65)', marginBottom: 4 } }, 'Studio del ruolo in corso'),
            React.createElement('div', { style: { fontSize: 13, color: 'rgba(0,0,0,0.45)' } },
              'Card e attività per il ruolo ',
              React.createElement('strong', null, role),
              ' non sono ancora definite: lo studio del ruolo per questi dati va ancora effettuato con la UX research.'
            )
          ),
        })
      )
    );
  }

  // Feed dashboard: le più urgenti (priorità, ordine stabile), prime 6.
  // Il totale resta nel "Vedi tutte (N)" → cronologia completa filtrabile.
  const feed = all.slice()
    .sort((a, b) => (PRIORITY_RANK[a.priority] == null ? 3 : PRIORITY_RANK[a.priority]) - (PRIORITY_RANK[b.priority] == null ? 3 : PRIORITY_RANK[b.priority]))
    .slice(0, 6);

  return React.createElement('div', { style: { display: 'flex', flexDirection: 'column', gap: 16, width: '100%' } },
    // Header: titolo (+ nota di design) a sinistra, "Vedi tutte (N)" all'estrema destra
    React.createElement('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, width: '100%' } },
      React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: 8 } },
        React.createElement(Title, { level: 4, style: { margin: 0 } }, 'Le tue attività'),
        React.createElement(DesignNoteBulb, { placement: 'bottomLeft', note: 'Le attività sono conseguenza della realizzazione dei flussi descritti dalle card delle metriche.' })
      ),
      React.createElement(Button, { type: 'link', onClick: onOpenHistory, icon: React.createElement(icons.ArrowRightOutlined, { style: { fontSize: 12 } }), iconPosition: 'end', style: { padding: 0, height: 'auto' } },
        'Vedi tutte (' + all.length + ')'
      )
    ),
    // Card delle attività più urgenti
    feed.length === 0
      ? React.createElement('div', { style: { padding: '24px 0', textAlign: 'center', fontSize: 13, color: 'rgba(0,0,0,0.35)' } },
          'Nessuna attività')
      : React.createElement(Space, { direction: 'vertical', size: 8, style: { width: '100%' } },
          feed.map((t, i) => React.createElement(TaskCard, { key: i, ...t }))
        )
  );
}

// ── Corpo del drawer "Vedi tutte" ───────────────────────────────────────────────
// Lista completa delle attività da fare (Da gestire), filtrabile per categoria.
// Titolo e chiusura sono forniti dal Drawer contenitore.
function ActivitiesDrawerBody({ role }) {
  const [filter, setFilter] = useState([]);
  const pendingAll = ROLE_PENDING[role] || [];
  const categories = Array.from(new Set(pendingAll.map((t) => t.category)));
  const toggle = (c) => setFilter((prev) => prev.includes(c) ? prev.filter((x) => x !== c) : [...prev, c]);
  const apply = (tasks) => filter.length === 0 ? tasks : tasks.filter((t) => filter.includes(t.category));
  const pending = apply(pendingAll);

  return React.createElement(Space, { direction: 'vertical', size: 16, style: { width: '100%' } },
    React.createElement('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, width: '100%' } },
      React.createElement(Text, { type: 'secondary', style: { fontSize: 13 } },
        pending.length + (pending.length === 1 ? ' attività' : ' attività')),
      React.createElement(ActivityFilter, { categories, selected: filter, onToggle: toggle, onClear: () => setFilter([]) })
    ),
    pending.length === 0
      ? React.createElement('div', { style: { padding: '40px 0', textAlign: 'center', fontSize: 14, color: 'rgba(0,0,0,0.35)' } },
          'Nessuna attività per i filtri selezionati')
      : React.createElement(Space, { direction: 'vertical', size: 8, style: { width: '100%' } },
          pending.map((t, i) => React.createElement(TaskCard, { key: i, ...t }))
        )
  );
}

    React.createElement(Card, { bordered: false, style: { border: '1px solid #f0f0f0' }, styles: { body: { padding: '16px' } } },
      React.createElement(Space, { size: 24, align: 'center' },
        React.createElement(Skeleton.Avatar, { active: true, size: 88 }),
        React.createElement('div', { style: { flex: 1 } }, React.createElement(Skeleton, { active: true, paragraph: { rows: 2 } })),
        React.createElement(Skeleton.Button, { active: true, style: { width: 120, height: 32 } })
      )
    ),
    React.createElement('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 10 } },
      ...[0,1,2,3,4].map((i) =>
        React.createElement(Card, { key: i, bordered: false, style: { flex: '1 1 0', minWidth: 180, border: '1px solid #f0f0f0' }, styles: { body: { padding: 0 } } },
          React.createElement('div', { style: { padding: '8px 12px', display: 'flex', gap: 8, alignItems: 'center' } },
            React.createElement(Skeleton.Avatar, { active: true, size: 16 }),
            React.createElement(Skeleton.Button, { active: true, size: 'small', style: { width: 120, height: 14 } })),
          React.createElement('div', { style: { padding: '20px 12px' } },
            React.createElement(Skeleton.Button, { active: true, size: 'small', style: { width: 80, height: 28 } })),
          React.createElement('div', { style: { padding: '0 12px 12px' } },
            React.createElement('div', { style: { borderTop: '1px solid #f0f0f0', margin: '0 0 12px' } }),
            React.createElement(Skeleton.Button, { active: true, size: 'small', style: { width: 70, height: 16 } }))
        )
      )
    ),
    React.createElement(Skeleton.Button, { active: true, size: 'small', style: { width: 120, height: 20 } }),
    React.createElement('div', { style: { display: 'flex', gap: 16 } },
      ...[0,1,2,3].map((i) =>
        React.createElement(Card, { key: i, bordered: false, style: { flex: 1, border: '1px solid #f0f0f0' }, styles: { body: { padding: 16 } } },
          React.createElement(Space, { size: 12 },
            React.createElement(Skeleton.Avatar, { active: true, shape: 'square', size: 40 }),
            React.createElement('div', { style: { flex: 1 } },
              React.createElement(Skeleton, { active: true, title: { width: 120 }, paragraph: { rows: 1, width: 80 } }))
          )
        )
      )
    ),
    React.createElement(Skeleton.Button, { active: true, size: 'small', style: { width: 130, height: 20 } }),
    React.createElement('div', { style: { display: 'flex', gap: 8 } },
      ...[0,1].map((col) =>
        React.createElement('div', { key: col, style: { flex: 1 } },
          React.createElement(Space, { direction: 'vertical', size: 8, style: { width: '100%' } },
            ...[0,1,2,3,4].map((i) =>
              React.createElement(Card, { key: i, bordered: false, style: { border: '1px solid #f0f0f0' }, styles: { body: { padding: '12px 16px' } } },
                React.createElement(Skeleton, { active: true, avatar: { size: 32, shape: 'square' }, title: { width: 180 }, paragraph: { rows: 1, width: 220 } })
              )
            )
          )
        )
      )
    )
  );
}

// ── App Root ──────────────────────────────────────────────────────────────────
function AppRoot() {
  const [role, setRole] = useState(localStorage.getItem('gravity_proto_role') || 'Operation Manager');
  const [tenantKey, setTenantKey] = useState('gravity');
  const [loading, setLoading] = useState(true);
  const [tenantLoading, setTenantLoading] = useState(false);
  const [avatarSrc, setAvatarSrc] = useState(null);
  const [historyOpen, setHistoryOpen] = useState(false);
  // Area app esplorativa: nascondibile per test layout. Stato in memoria →
  // si ripristina (le app riappaiono) al reload della pagina.
  const [appsHidden, setAppsHidden] = useState(false);

  const tenant = TENANTS[tenantKey];

  useEffect(() => {
    const t = setTimeout(() => setLoading(false), 200);
    return () => clearTimeout(t);
  }, []);

  const handleRoleChange = (r) => {
    localStorage.setItem('gravity_proto_role', r);
    setHistoryOpen(false);
    setLoading(true);
    setTimeout(() => { setRole(r); setLoading(false); }, 600);
  };

  const handleTenantChange = (k) => {
    if (k === 'alessi' || k === 'movingup') {
      const tenantParam = k === 'alessi' ? 'alessi-pubblicita' : 'moving-up';
      setTenantLoading(true);
      window.location.href = '../../prototipo%20approvato/single-signon/index.html?tenant=' + tenantParam;
      return;
    }
    setHistoryOpen(false);
    setLoading(true);
    setTimeout(() => { setTenantKey(k); setLoading(false); }, 200);
  };

  const openHistory = () => setHistoryOpen(true);

  let content = loading
      ? React.createElement(ContentSkeleton)
      : React.createElement('div', { style: { display: 'flex', flexDirection: 'column', gap: 32, width: '100%' } },
          React.createElement(HeaderCard, { role, tenant, avatarSrc, onAvatarChange: setAvatarSrc }),
          React.createElement(MetricRow, { role }),
          // Due colonne: sinistra "Le tue attività", destra "Le tue app".
          // Area app esplorativa: hover → spiegazione + button per nasconderla.
          // Nascosta → attività full width (si ripristina al reload).
          appsHidden
            ? React.createElement(ActivitiesSection, { role, onOpenHistory: openHistory })
            : React.createElement('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 32, alignItems: 'flex-start', width: '100%' } },
                React.createElement('div', { style: { flex: '1 1 0', minWidth: 320 } },
                  React.createElement(ActivitiesSection, { role, onOpenHistory: openHistory })
                ),
                // Area app esplorativa: nota + nascondi sull'icona Coffee del titolo
                React.createElement('div', { style: { flex: '0 1 500px', minWidth: 320 } },
                  React.createElement(ProductsSection, { role, onHide: () => setAppsHidden(true) })
                )
              )
        );

  return React.createElement(ConfigProvider, { theme: window.GRAVITY_THEME },
    React.createElement(App, null,
      React.createElement(Layout, { style: { minHeight: '100vh', background: '#f5f5f5' } },
        React.createElement(GravityNavbarTenant, {
          role, onRoleChange: handleRoleChange,
          tenantKey, onTenantChange: handleTenantChange, tenantLoading,
          avatarSrc,
        }),
        React.createElement(Layout.Content, {
          style: { padding: '16px 80px', background: '#f5f5f5', overflowY: 'auto' },
        },
          content,
          React.createElement('div', { style: { height: 24 } })
        ),
        // Drawer "Vedi tutte" — lista completa attività (DS: *Drawer* Placement=Right)
        React.createElement(Drawer, {
          title: 'Attività da fare',
          placement: 'right',
          width: 480,
          open: historyOpen,
          onClose: () => setHistoryOpen(false),
          styles: { body: { padding: '16px 20px' } },
        },
          historyOpen ? React.createElement(ActivitiesDrawerBody, { role }) : null
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(AppRoot));
</script>
</body>
