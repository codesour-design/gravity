  let h = 0;

// ── App Root ──────────────────────────────────────────────────────────────────
function AppRoot() {
  const [role, setRole] = useState(localStorage.getItem('gravity_proto_role') || 'Operation Manager');
  const [tenantKey, setTenantKey] = useState('gravity');
  const [loading, setLoading] = useState(true);
  const [tenantLoading, setTenantLoading] = useState(false);
  const [avatarSrc, setAvatarSrc] = useState(null);
  const [view, setView] = useState('dashboard');

  const tenant = TENANTS[tenantKey];

  useEffect(() => {
    const t = setTimeout(() => setLoading(false), 200);
    return () => clearTimeout(t);
  }, []);

  const handleRoleChange = (r) => {
    localStorage.setItem('gravity_proto_role', r);
    setView('dashboard');
    setLoading(true);
    setTimeout(() => { setRole(r); setLoading(false); }, 600);
  };

  const handleTenantChange = (k) => {
    if (k === 'alessi' || k === 'movingup') {
      const tenantParam = k === 'alessi' ? 'alessi-pubblicita' : 'moving-up';
      setTenantLoading(true);
      window.location.href = '../../prototipo%20approvato/single-signon/index.html?tenant=' + tenantParam;
      return;
    }
    setView('dashboard');
    setLoading(true);
    setTimeout(() => { setTenantKey(k); setLoading(false); }, 200);
  };

  const openHistory = () => {
    setView('history');
    setLoading(true);
    setTimeout(() => setLoading(false), 500);
  };

  let content;
  if (view === 'history') {
    content = loading
      ? React.createElement(HistorySkeleton)
      : React.createElement(HistoryScreen, { role, onBack: () => setView('dashboard') });
  } else {
    content = loading
      ? React.createElement(ContentSkeleton)
      : React.createElement('div', { style: { display: 'flex', flexDirection: 'column', gap: 32, width: '100%' } },
          React.createElement(HeaderCard, { role, tenant, avatarSrc, onAvatarChange: setAvatarSrc }),
          React.createElement(MetricRow, { role }),
          // Due colonne: sinistra "Le tue attività", destra "Le tue app"
          React.createElement('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 32, alignItems: 'flex-start', width: '100%' } },
            React.createElement('div', { style: { flex: '1 1 0', minWidth: 320 } },
              React.createElement(ActivitiesSection, { role, onOpenHistory: openHistory })
            ),
            React.createElement('div', { style: { flex: '0 1 500px', minWidth: 320 } },
              React.createElement(ProductsSection)
            )
          )
        );
  }

  return React.createElement(ConfigProvider, { theme: window.GRAVITY_THEME },
    React.createElement(App, null,
      React.createElement(Layout, { style: { minHeight: '100vh', background: '#f5f5f5' } },
        React.createElement(GravityNavbarTenant, {
          role, onRoleChange: handleRoleChange,
          tenantKey, onTenantChange: handleTenantChange, tenantLoading,
          avatarSrc,
        }),
        React.createElement(Layout.Content, {
          style: { padding: '16px 80px', background: '#f5f5f5', overflowY: 'auto' },
        },
          content,
          React.createElement('div', { style: { height: 24 } })
        )
      )
    )
  );
}
