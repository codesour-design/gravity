// ── GravityNavbarTenant — variante con tenant switcher ────────────────────────
function GravityNavbarTenant({ role, onRoleChange, tenantKey, onTenantChange }) {
  const h = React.createElement;

  const user    = ROLE_USER[role] || { nome: 'U', cognome: '' };
  const abbr    = (user.nome[0] + (user.cognome[0] || '')).toUpperCase();
  const palette = nameColor(user.nome + ' ' + user.cognome);
  const sections = ROLE_NAV[role] || [];

  const menuItems = sections.map((sec) => {
    const conf = NAV[sec];
    return {
      key: sec,
      label: SECTION_LABEL[sec] || sec,
      children: conf.items.map((item) => {
        const link = conf.links[item];
        const lbl  = ITEM_LABEL[item] || item;
        return {
          key: sec + '/' + item,
          label: link
            ? h('a', { href: link }, lbl)
            : h('span', { style: { color: 'rgba(0,0,0,0.25)', cursor: 'default' } }, lbl),
        };
      }),
    };
  });

  // Questa pagina è accessibile da tutti i ruoli: nessun selectedKey fisso
  // ma mostriamo Overview come sezione di appartenenza quando disponibile
  const selectedKeys = sections.includes('Overview') ? [] : [];

  const avatarMenuItems = [
    {
      key: '_user', disabled: true,
      label: h('div', { style: { padding: '4px 0 8px', minWidth: 200, display: 'flex', alignItems: 'center', gap: 12 } },
        h('div', {
          style: {
            width: 40, height: 40, borderRadius: '50%', flexShrink: 0,
            background: palette.bg,
            border: '1.5px solid ' + palette.fg + '22',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          },
        }, h('span', { style: { color: palette.fg, fontSize: 13, fontWeight: 700 } }, abbr)),
        h('div', null,
          h('div', { style: { fontWeight: 600, fontSize: 14, color: 'rgba(0,0,0,0.88)', lineHeight: '22px' } },
            user.nome + ' ' + user.cognome),
          h('div', { style: { fontSize: 12, color: 'rgba(0,0,0,0.45)' } }, role)
        )
      ),
    },
    { type: 'divider' },
    { key: '_hd', disabled: true,
      label: h('span', { style: { fontSize: 11, color: 'rgba(0,0,0,0.45)', textTransform: 'uppercase', letterSpacing: '0.5px' } },
        'Vista ruolo'),
    },
    ...ROLES.map((r) => ({
      key: r,
      label: h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 32, minWidth: 200 } },
        h('span', { style: { fontWeight: r === role ? 600 : 400 } }, r),
        r === role ? h(icons.CheckOutlined, { style: { color: '#3e00fb', fontSize: 12 } }) : null
      ),
      onClick: () => onRoleChange(r),
    })),
  ];

  const tenantOptions = Object.values(TENANTS).map((t) => ({ value: t.key, label: t.name }));

  return h('nav', {
    style: {
      background: '#fff',
      borderBottom: '1px solid rgba(0,0,0,0.06)',
      display: 'flex',
      alignItems: 'center',
      justifyContent: 'space-between',
      height: 64,
      position: 'sticky',
      top: 0,
      zIndex: 100,
      flexShrink: 0,
    },
  },
    // Sinistra: logo + menu
    h('div', { style: { display: 'flex', alignItems: 'stretch', height: '100%', flex: 1, minWidth: 0 } },
      h('a', {
        href: './index.html',
        style: { padding: '0 24px', display: 'flex', alignItems: 'center', textDecoration: 'none', flexShrink: 0 },
      },
        h('img', {
          src: '../../../brand/Gravity_type.svg',

// ── App Root ──────────────────────────────────────────────────────────────────
function AppRoot() {
  const [role, setRole] = useState(localStorage.getItem('gravity_proto_role') || 'Tenant Admin');
  const [tenantKey, setTenantKey] = useState('gravity');
  const [loading, setLoading] = useState(true);
  const [avatarSrc, setAvatarSrc] = useState(null);

  const tenant = TENANTS[tenantKey];

  useEffect(() => {
    const t = setTimeout(() => setLoading(false), 200);
    return () => clearTimeout(t);
  }, []);

  const handleRoleChange = (r) => {
    localStorage.setItem('gravity_proto_role', r);
    setLoading(true);
    setTimeout(() => { setRole(r); setLoading(false); }, 600);
  };

  const handleTenantChange = (k) => {
    if (k === 'alessi' || k === 'movingup') {
      const tenantParam = k === 'alessi' ? 'alessi-pubblicita' : 'moving-up';
      window.location.href = '../../prototipo%20approvato/single-signon/index.html?tenant=' + tenantParam;
      return;
    }
    setLoading(true);
    setTimeout(() => { setTenantKey(k); setLoading(false); }, 200);
  };

  const content = loading
    ? React.createElement(ContentSkeleton)
    : React.createElement(Space, { direction: 'vertical', size: 16, style: { width: '100%' } },
        React.createElement(HeaderCard, { role, tenant, avatarSrc, onAvatarChange: setAvatarSrc }),
        React.createElement(MetricRow, { role }),
        React.createElement(SpacesSection, { role, tenant }),
        React.createElement(ActivitiesSection, { role })
      );

  return React.createElement(ConfigProvider, { theme: window.GRAVITY_THEME },
    React.createElement(App, null,
      React.createElement(Layout, { style: { minHeight: '100vh', background: '#f5f5f5' } },
        React.createElement(GravityNavbarTenant, {
          role, onRoleChange: handleRoleChange,
          tenantKey, onTenantChange: handleTenantChange,
        }),
        React.createElement(Layout.Content, {
          style: { padding: '16px 24px', background: '#f5f5f5', overflowY: 'auto' },
        },
          content,
          React.createElement('div', { style: { height: 24 } })
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(AppRoot));
