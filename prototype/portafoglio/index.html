function ListaInserzionistiOM(props) {
  const { data } = props;
  const daRevisionare = useMemo(() => data.flatMap(r => getRevisioni(r).map(it => ({ ...it, inserzionista: r }))), [data]);
  // KPI: contano inserzionisti + contatti/lead per stato, indipendenti dalla tab attiva.
  const kpi = useMemo(() => {
    const out = {};
    Object.keys(STATI_V2).forEach(k => { out[k] = { ins: 0, cont: 0 }; });
    data.forEach(r => {
      if (out[r.statoV2]) out[r.statoV2].ins++;
      (r.contatti || []).forEach(c => { if (out[c.stato]) out[c.stato].cont++; });
    });
    return out;
  }, [data]);
  const daAssegnare = data.filter(r => !r.commerciale).length;
  const kpiCard = (key, icon, label) => React.createElement(DataCard, {
    icon, label,
    value: kpi[key].ins + kpi[key].cont,
    valueExtra: `${kpi[key].ins} inserzionist${kpi[key].ins === 1 ? 'a' : 'i'} · ${kpi[key].cont} contatt${kpi[key].cont === 1 ? 'o' : 'i'}`,
  });
  return React.createElement(React.Fragment, null,
    React.createElement('div', {
      style: { display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 12, marginBottom: 28 },
    },
      kpiCard('in_attesa', ClockCircleOutlined, 'Da verificare'),
      kpiCard('da_completare', EditOutlined, 'Da completare'),
      React.createElement(DataCard, {
        icon: UserOutlined, label: 'Da assegnare',
        value: daAssegnare,
        valueExtra: `su ${data.length} inserzionisti · senza commerciale`,
      }),
    ),
  React.createElement('div', {
    style: { background: '#fff', borderRadius: 10, border: '1px solid rgba(0,0,0,0.06)', overflow: 'hidden' },
  },
    React.createElement(Tabs, {
      // ?tab=revisione apre direttamente "Da revisionare" (link dalla card in home)
      defaultActiveKey: new URLSearchParams(location.search).get('tab') === 'revisione' ? 'revisione' : 'tutti',
      tabBarStyle: { padding: '0 20px', margin: 0 },
      items: [
        { key: 'tutti', label: 'Inserzionisti',
          children: React.createElement(RevisioneTable, { ...props, data, allData: data }) },
        { key: 'revisione', label: 'Da revisionare',
          children: React.createElement(DaRevisionareTable, { rows: daRevisionare, allData: data, onViewDetail: props.onViewDetail, onModifica: props.onModifica }) },
      ],
    })

}

// ── AppRoot ───────────────────────────────────────────────────────────────────
// Deep link dalla home (V2): ?ins=<key>&rev=<id revisione> apre il dettaglio dell'inserzionista da lavorare.
const _deepParams = new URLSearchParams(location.search);
const _deepIns = (window.__PORTAFOGLIO_UI_VERSION === 'v2' && _deepParams.get('ins'))
  ? (MOCK_INSERZIONISTI.find((r) => r.key === _deepParams.get('ins')) || null) : null;
const _deepRev = _deepParams.get('rev');

function AppRoot() {
  const [view, setView] = useState(_deepIns ? 'dettaglio' : 'lista'); // 'lista' | 'dettaglio'
  const [current, setCurrent] = useState(_deepIns);
  const [data, setData] = useState(MOCK_INSERZIONISTI);
  // V2: lo stato corrente viene salvato, così la home ("Anagrafiche da verificare") resta allineata.
  useEffect(() => {
    if (window.__PORTAFOGLIO_UI_VERSION === 'v2') window.GravityPortafoglio.save(data);
  }, [data]);
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [drawerTarget, setDrawerTarget] = useState(null); // null = nuovo, obj = modifica
  const [elimina, setElimina] = useState(null); // obj da eliminare
  const [role, setRole] = useState(() => localStorage.getItem('gravity_proto_role') || 'Sales');

  useEffect(() => {
    const handler = (e) => setRole(e.detail);
    window.addEventListener('gravity:role-change', handler);
    return () => window.removeEventListener('gravity:role-change', handler);
  }, []);

  const handleViewDetail = (row) => { setCurrent(row); setView('dettaglio'); };
  const handleBack       = () => { setCurrent(null); setView('lista'); };

  const handleNuovo = () => { setDrawerTarget(null); setDrawerOpen(true); };
  const handleModifica = (row) => { setDrawerTarget(row || current); setDrawerOpen(true); };

  const handleSave = (values) => {
    if (drawerTarget) {
      // modifica
      setData(prev => prev.map(r => r.key === drawerTarget.key ? { ...r, ...values, contatto: values.contatto } : r));
      if (current?.key === drawerTarget.key) setCurrent(prev => ({ ...prev, ...values, contatto: values.contatto }));
      antd.message.success('Inserzionista aggiornato.');
    } else {
      // creazione
      const newRec = { ...values, key: `ins-${Date.now()}`, trattativaCollegata: null };
      setData(prev => [newRec, ...prev]);
      antd.message.success('Inserzionista creato.');
    }
    setDrawerOpen(false);
  };

  const handleApprova = (row) => {
    setData(prev => prev.map(r => r.key === row.key
      ? { ...r, stato: 'approvato', statoV2: r.statoV2 === 'in_attesa' ? 'da_completare' : r.statoV2 } : r));
    antd.message.success(`${row.ragioneSociale} approvato.`);
  };

  const handleElimina = (row) => setElimina(row);
  const handleEliminaConfirm = () => {
    setData(prev => prev.filter(r => r.key !== elimina.key));
    if (current?.key === elimina.key) handleBack();
    antd.message.success(`${elimina.ragioneSociale} eliminato.`);
    setElimina(null);
  };

  return React.createElement('div', { className: 'app-shell' },
    React.createElement(window.GravityNavbar),

    view === 'lista'
      ? React.createElement('div', { className: 'page-content' },
          // ── Header lista ──────────────────────────────────────────────────
          React.createElement('div', {
            style: {
              display: 'flex', alignItems: 'center', justifyContent: 'space-between',
              background: '#fff', borderRadius: 8, padding: '16px 20px',
              border: '1px solid rgba(0,0,0,0.06)', marginBottom: 20,
            },
          },
            React.createElement(Title, { level: 3, style: { margin: 0 } }, 'Lista Inserzionisti'),
            React.createElement(Button, {
              type: 'primary', icon: React.createElement(PlusOutlined),
              onClick: handleNuovo,
            }, 'Nuovo Inserzionista')
          ),
          React.createElement(
            (window.__PORTAFOGLIO_UI_VERSION === 'v2' && role === 'Operation Manager') ? ListaInserzionistiOM : ListaInserzionisti, {
            data,
            role,
            onViewDetail: handleViewDetail,
            onNuovo: handleNuovo,
            onModifica: handleModifica,
            onElimina: handleElimina,
            onApprova: handleApprova,
          })
        )
      : React.createElement(InserzionistiDetail, {
          inserzionista: current,
          // Revisioni da gestire su questo inserzionista (solo V2, Operation Manager)
          revisioni: (window.__PORTAFOGLIO_UI_VERSION === 'v2' && role === 'Operation Manager' && current)
            ? getRevisioni((data.find((r) => r.key === current.key)) || current) : [],
          onBack: handleBack,
          onModifica: () => handleModifica(current),
        }),

    // ── Drawer creazione / modifica ─────────────────────────────────────────
    React.createElement(InserzionistaSectionDrawer, {
      open: drawerOpen,
      onClose: () => setDrawerOpen(false),
      inserzionista: drawerTarget,
      onSave: handleSave,
    }),

    // ── Modale eliminazione ─────────────────────────────────────────────────
    React.createElement(EliminaModal, {
      open: !!elimina,
      ragioneSociale: elimina?.ragioneSociale || '',
      onConfirm: handleEliminaConfirm,
      onCancel: () => setElimina(null),
    })
  );
}

function Root() {
  return React.createElement(ConfigProvider, { theme: window.GRAVITY_THEME },
    React.createElement(App, null,
      React.createElement(AppRoot)
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Root));
</script>
