        })

        },

            React.createElement('div', { key: a.id, className: 'activity-item' },

  const tabItems = [

  return React.createElement('div', { className: 'page-content' },
    React.createElement(GravityPageHeader, {

    React.createElement(Tabs, {

  );
}

// ── ListaInserzionisti ────────────────────────────────────────────────────────

  const columns = [
    {
      title: 'Nome Inserzionista',
      key: 'ragioneSociale',
      dataIndex: 'ragioneSociale',
      width: 280,
      fixed: 'left',
      ...makeSearchColumn('ragioneSociale', 'Cerca per ragione sociale...'),

        React.createElement('div', { className: 'nome-cell' },
          React.createElement('span', { style: { display: 'inline-flex', alignItems: 'center', gap: 10 } },

            React.createElement('span', { style: { fontSize: 13, color: 'rgba(0,0,0,0.88)', fontWeight: 500 } }, v)
          ),
          React.createElement(EyeOutlined, { className: 'nome-eye' })
        ),
    },
    {
      title: 'Indirizzo',
      key: 'indirizzo',
      dataIndex: 'indirizzo',
      width: 240,
      ...makeSearchColumn('indirizzo', 'Cerca per indirizzo...'),
      render: (v, row) => {
        const full = [v, row.comune, row.cap].filter(Boolean).join(', ');
        return React.createElement('span', { style: { fontSize: 13, color: 'rgba(0,0,0,0.65)' } }, full || '—');
      },
    },
    {
      title: 'Settore Commerciale',
      key: 'businessArea',
      dataIndex: 'businessArea',
      width: 170,

        ? React.createElement(Tag, { color: 'purple', style: { margin: 0 } }, v)
        : React.createElement('span', { style: { color: 'rgba(0,0,0,0.25)' } }, '—'),
    },
    {
      title: 'Contatto',
      key: 'contatto',
      width: 180,
      render: (_, row) => {
        if (!row.contatto) return React.createElement('span', { style: { color: 'rgba(0,0,0,0.25)' } }, '—');
        const fullName = `${row.contatto.nome} ${row.contatto.cognome}`;
        return React.createElement('span', { style: { display: 'inline-flex', alignItems: 'center', gap: 8 } },
          React.createElement(AdvertiserAvatar, { name: fullName, size: 24 }),
          React.createElement('span', { style: { fontSize: 13, color: 'rgba(0,0,0,0.65)' } }, fullName)
        );
      },
    },
    {
      title: 'Commerciale',
      key: 'commerciale',
      dataIndex: 'commerciale',
      width: 180,
      render: (v) => {
        if (!v) return React.createElement('span', { style: { color: 'rgba(0,0,0,0.25)' } }, '—');
        return React.createElement('span', { style: { display: 'inline-flex', alignItems: 'center', gap: 8 } },
          React.createElement(AdvertiserAvatar, { name: v, size: 24 }),
          React.createElement('span', { style: { fontSize: 13, color: 'rgba(0,0,0,0.65)' } }, v)

    {
      title: 'Preventivo',
      key: 'preventivo',
      width: 260,
      render: (_, row) => {
        if (row.trattativaCollegata) {
          return React.createElement(Tag, {
            icon: React.createElement(FileTextOutlined),
            color: 'purple',
            style: { maxWidth: 230, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', cursor: 'pointer' },
            onClick: (e) => { e.stopPropagation(); antd.message.info('Apre la trattativa collegata.'); },

        return React.createElement(Tooltip, {
          title: 'Non è stato possibile trovare una trattativa associata a questo inserzionista.',

// ── AppRoot ───────────────────────────────────────────────────────────────────
function AppRoot() {
  const [view, setView] = useState('lista'); // 'lista' | 'dettaglio'
  const [current, setCurrent] = useState(null);
  const [data, setData] = useState(MOCK_INSERZIONISTI);
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [drawerTarget, setDrawerTarget] = useState(null); // null = nuovo, obj = modifica
  const [elimina, setElimina] = useState(null); // obj da eliminare

  const handleViewDetail = (row) => { setCurrent(row); setView('dettaglio'); };
  const handleBack       = () => { setCurrent(null); setView('lista'); };

  const handleNuovo = () => { setDrawerTarget(null); setDrawerOpen(true); };
  const handleModifica = (row) => { setDrawerTarget(row || current); setDrawerOpen(true); };

  const handleSave = (values) => {
    if (drawerTarget) {
      // modifica
      setData(prev => prev.map(r => r.key === drawerTarget.key ? { ...r, ...values, contatto: values.contatto } : r));
      if (current?.key === drawerTarget.key) setCurrent(prev => ({ ...prev, ...values, contatto: values.contatto }));
      antd.message.success('Inserzionista aggiornato.');
    } else {
      // creazione
      const newRec = { ...values, key: `ins-${Date.now()}`, trattativaCollegata: null };
      setData(prev => [newRec, ...prev]);
      antd.message.success('Inserzionista creato.');
    }
    setDrawerOpen(false);
  };

  const handleElimina = (row) => setElimina(row);
  const handleEliminaConfirm = () => {
    setData(prev => prev.filter(r => r.key !== elimina.key));
    if (current?.key === elimina.key) handleBack();
    antd.message.success(`${elimina.ragioneSociale} eliminato.`);
    setElimina(null);
  };

  return React.createElement('div', { className: 'app-shell' },
    React.createElement(window.GravityNavbar),

    view === 'lista'
      ? React.createElement('div', { className: 'page-content' },
          // ── Header lista ──────────────────────────────────────────────────
          React.createElement('div', {
            style: {
              display: 'flex', alignItems: 'center', justifyContent: 'space-between',
              background: '#fff', borderRadius: 8, padding: '16px 20px',
              border: '1px solid rgba(0,0,0,0.06)', marginBottom: 20,
            },
          },
            React.createElement(Title, { level: 3, style: { margin: 0 } }, 'Lista Inserzionisti'),
            React.createElement(Button, {
              type: 'primary', icon: React.createElement(PlusOutlined),
              onClick: handleNuovo,
            }, 'Nuovo Inserzionista')
          ),
          React.createElement(ListaInserzionisti, {
            data,
            onViewDetail: handleViewDetail,
            onNuovo: handleNuovo,
            onModifica: handleModifica,
            onElimina: handleElimina,
          })
        )
      : React.createElement(InserzionistiDetail, {
          inserzionista: current,
          onBack: handleBack,
          onModifica: () => handleModifica(current),
        }),

    // ── Drawer creazione / modifica ─────────────────────────────────────────
    React.createElement(InserzionistaSectionDrawer, {
      open: drawerOpen,
      onClose: () => setDrawerOpen(false),
      inserzionista: drawerTarget,
      onSave: handleSave,
    }),

    // ── Modale eliminazione ─────────────────────────────────────────────────
    React.createElement(EliminaModal, {
      open: !!elimina,
      ragioneSociale: elimina?.ragioneSociale || '',
      onConfirm: handleEliminaConfirm,
      onCancel: () => setElimina(null),
    })
  );
}

function Root() {
  return React.createElement(ConfigProvider, { theme: window.GRAVITY_THEME },
    React.createElement(App, null,
      React.createElement(AppRoot)
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Root));
</script>
