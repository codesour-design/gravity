       semplificata) SOLO con ?handoff=<versione>. Senza il parametro questo è il
       prototipo pulito. Le versioni sono file di config: il prototipo resta unico.
       Il document.write in <head> carica la config in modo sincrono, così le note
       inline (window.HANDOFF_NOTES) sono disponibili già al primo render.

       ECCEZIONE documentata (vedi components/handoff-engine.md → "Switch UI reale
       v1/v2 — Permessi"): qui la versione handoff pilota ANCHE un vero switch di UI
       della lista (window.__PERMESSI_UI_VERSION), non solo le annotazioni. Senza
       ?handoff, o con ?handoff=v1, resta la UI v1 (approvata, invariata); solo
       ?handoff=v2 attiva la UI v2 (nuova, components/list-table.md). -->
  <script>
    (function () {
      var CONFIGS  = { v1: './handoff-steps-v1.js', v2: './handoff-steps.js' };
      var APPROVED = 'v1';
      window.__PERMESSI_UI_VERSION = APPROVED;
      var params = new URLSearchParams(location.search);
      if (!params.has('handoff')) return;
      var v = (params.get('handoff') || APPROVED).toLowerCase();
      var cfg = CONFIGS[v] || CONFIGS[APPROVED];
      window.__PERMESSI_UI_VERSION = CONFIGS[v] ? v : APPROVED;
      window.__HANDOFF_ACTIVE = true;
      document.write('<scr' + 'ipt src="' + cfg + '"></scr' + 'ipt>');
    })();

const fmtEuro = (n) => {
  const v = Math.round((Number(n) || 0) * 100) / 100;
  const [int, dec] = v.toFixed(2).split('.');

};
// v2 — CUP di un'Autorizzazione è la somma delle righe di Tab 2 (impiantiAutorizzati, nota
// 'autorizzazione-impianti-tab-dedicata'), non più il campo singolo `cup` (sempre 0 sui

const parseItDate = (s) => {
  if (!s) return 0;
  const [d, m, y] = s.split('/').map(Number);
  return new Date(y, m - 1, d).getTime();
};

function computeStatoAutomaticoV2(dataDecorrenza, dataScadenza, giorniPreavviso) {
  const oggiTs = oggiMezzanotte();
  const decorrenzaTs = dataDecorrenza ? parseItDate(dataDecorrenza) : null;
  const scadenzaTs = dataScadenza ? parseItDate(dataScadenza) : null;
  if (decorrenzaTs != null && oggiTs < decorrenzaTs) return 'In istruttoria';
  if (scadenzaTs != null && oggiTs >= scadenzaTs) return 'Scaduta';
  if (scadenzaTs != null && giorniPreavviso != null && oggiTs >= scadenzaTs - giorniPreavviso * 86400000) return 'In scadenza';
  return 'Attiva';
}

const EMPTY_PERMIT_STATE = {
  tipoConcessione: null, tipoAutorizzazione: null, enteEmittente: '', partitaIva: '',
  tipoDocumento: null, idDocumento: '', numeroProtocollo: '', dataStipula: null, dataDecorrenza: null, dataScadenza: null,

  // vuoto da sbloccare con un'azione — `_seed: true` la esclude da dirty/validità/salvataggio

  // primo tocco).
  impiantiConcessione: [{ impiantoId: null, numeroUtenza: '', _manualKey: 'manual-seed', _seed: true }],
  // v2 — Autorizzazione: estensioni. impiantiAutorizzati sostituisce Impianti coperti/Codice
  // Autorizzazione (per cimasa)/Riferimento allegato/CUP a valore singolo (nota

  includeConcessioneSuoloPubblico: false, attiProvenienzaIds: [],

  estensioneOccupazioneMq: null, tipoOccupazione: null, durataOccupazioneGiorni: null,

  // v2 — Contratto Privato (autorizzazioneComunaleCollegata rimosso, nota 'contratto-vista-derivata')
  proprietarioLocatore: '', tipoContratto: null, identificativoContratto: '',
  foglio: '', particella: '', subalterno: '', indirizzo: '',
  impiantiContratto: [{ impiantoId: null, numeroUtenza: '', _manualKey: 'manual-seed', _seed: true }],

function PermitFormDrawer({ open, type, isV2, concessioniList, autorizzazioniList, contrattiList, onClose, onSave }) {
  const [f, setF] = useState(EMPTY_PERMIT_STATE);
  const set = (key) => (val) => setF(prev => ({ ...prev, [key]: val }));
  // Tracciamento modifiche (stesso sistema di "Nuovo Impianto", components/section-drawer.md):
  // in creazione la base è lo stato vuoto, quindi ogni campo compilato è "da salvare" — stroke
  // primary sul controllo (mod) e pallino primary sulla sezione (sectionMod).
  const isMod = (k) => JSON.stringify(f[k]) !== JSON.stringify(EMPTY_PERMIT_STATE[k]);
  const mod = (k, control) => window.GravityModified(isMod(k), control);
  const sectionMod = (keys) => keys.some(isMod);

  // v2 — Autorizzazione: drawer a due tab (nota 'autorizzazione-impianti-tab-dedicata'),
  // ispirato al Nuovo Impianto di inventory-systems. 'info' = dati generali (ex unico
  // pannello), 'impianti' = editor a righe per impianto — disabilitata finché il Tipo
  // Autorizzazione non è scelto (serve a filtrare gli impianti già autorizzati).
  const [activeTab, setActiveTab] = useState('info');

  useEffect(() => {
    if (open) {
      setF(EMPTY_PERMIT_STATE);
      setActiveTab('info');
    }
  }, [open, type]);

  const isConcessione = type === 'concessione';
  const isAutorizzazione = type === 'autorizzazione';
  const isContratto = type === 'contratto';
  const title = isConcessione ? 'Nuova Concessione' : isAutorizzazione ? 'Nuova Autorizzazione' : 'Nuovo Contratto Privato';

  // Cambiare enum di classificazione pulisce i campi condizionali ora irrilevanti, così il
  // salvataggio non porta con sé dati "fantasma" di una scelta precedente non più visibile.
  const onModalitaAttribuzioneChange = (v) => setF(prev => ({
    ...prev, modalitaAttribuzione: v,
    ...(v !== 'Bando pubblico' ? { riferimentoBando: '', enteBanditore: '', dataAggiudicazione: null, lotto: '', noteBando: '' } : {}),
  }));
  // v2 — Include concessione suolo pubblico e Atto di provenienza (Concessione/Contratto)
  // sono due situazioni MUTUALMENTE ESCLUSIVE, non una il figlio dell'altra (nota
  // 'autorizzazione-atto-provenienza-scollegato'): il check dice che l'atto autorizzativo
  // include già di per sé una concessione implicita; senza check, l'Autorizzazione è invece
  // collegata a un atto (Concessione o Contratto Privato) che ha dato il bene poi autorizzato.
  const onIncludeSuoloChange = (checked) => setF(prev => ({
    ...prev, includeConcessioneSuoloPubblico: checked,
    ...(checked
      ? { attiProvenienzaIds: [] }
      : { estensioneOccupazioneMq: null, tipoOccupazione: null, durataOccupazioneGiorni: null }),
  }));
  // v2 — cambiare Tipo Occupazione azzera la durata: 'Permanente' non ne prevede una (canone
  // annuale implicito), 'Temporanea' la richiede in giorni — un valore lasciato dalla scelta
  // precedente non avrebbe più senso per la nuova.
  const onTipoOccupazioneChange = (v) => setF(prev => ({ ...prev, tipoOccupazione: v, durataOccupazioneGiorni: null }));
  // v2 — cambiare Tipo Autorizzazione cambia l'anagrafica enti selezionabile
  // (ENTI_PER_TIPO_AUTORIZZAZIONE) e l'elenco impianti già autorizzati escluso in Tab 2: righe
  // scelte per il tipo precedente non sono necessariamente valide per il nuovo, si azzerano —
  // tornando a una singola riga vuota (`_seed`, nota 'permessi-elenco-mai-vuoto'), non a [].
  const onTipoAutorizzazioneChange = (v) => setF(prev => ({
    ...prev, tipoAutorizzazione: v, enteEmittente: '',
    impiantiAutorizzati: [{ impiantoId: null, codiceAutorizzazione: '', _manualKey: 'manual-seed', _seed: true }],
  }));

  const dirty = f.tipoConcessione != null || f.tipoAutorizzazione != null || !!f.enteEmittente.trim()
    || !!f.partitaIva.trim() || f.tipoDocumento != null || !!f.idDocumento.trim() || !!f.numeroProtocollo.trim()
    || !!f.dataStipula || !!f.dataDecorrenza || !!f.dataScadenza || f.promemoria !== 'No Promemoria' || f.utenze.length > 0 || f.cup != null
    || f.modalitaAttribuzione != null || f.includeConcessioneSuoloPubblico || f.attiProvenienzaIds.length > 0
    || f.estensioneOccupazioneMq != null || f.tipoOccupazione != null || f.durataOccupazioneGiorni != null
    || f.impiantiAutorizzati.some(r => !r._seed)
    || !!f.proprietarioLocatore.trim() || f.tipoContratto != null || !!f.identificativoContratto.trim()
    || !!f.foglio.trim() || !!f.particella.trim() || !!f.indirizzo.trim()
    || !!f.ubicazione.trim() || f.superficieConcessaMq != null
    || f.impiantiConcessione.some(r => !r._seed) || f.impiantiContratto.some(r => !r._seed);

  const utenzeValid = f.utenze.every(u => u.numero.trim() && u.canone != null && u.canone > 0);
  // v2 — Tab 2: l'impianto NON è più richiesto per riga (nota 'autorizzazione-impianti-tab-dedicata')
  // — un'autorizzazione spesso arriva prima che l'impianto sia censito in Inventario · Impianti,
  // quindi il codice cimasa va segnabile comunque. Una riga è valida se ha almeno un campo
  // compilato (impianto o codice cimasa): non è ammessa solo una riga totalmente vuota. La riga
  // seed intatta (nota 'permessi-elenco-mai-vuoto') non conta: equivale a zero righe, che resta
  // valido (Autorizzazione senza impianti ancora collegati). Il CUP non vive più qui (nota
  // 'cup-pratica-a-parte-legata-impianto'), quindi non entra più nella regola di validità.
  const impiantiAutorizzatiValid = f.impiantiAutorizzati.filter(r => !r._seed).every(r =>
    !!r.impiantoId || !!r.codiceAutorizzazione.trim());
  // v2 — Impianti collegati (Concessione/Contratto): stessa regola di validità per riga
  // dell'Autorizzazione — almeno un campo compilato, riga seed esclusa, zero righe è uno stato
  // valido (nota 'concessione-contratto-impianti-collegati').
  const impiantiConcessioneValid = f.impiantiConcessione.filter(r => !r._seed).every(r =>
    !!r.impiantoId || !!r.numeroUtenza.trim());
  const impiantiContrattoValid = f.impiantiContratto.filter(r => !r._seed).every(r =>
    !!r.impiantoId || !!r.numeroUtenza.trim());

  // v2 — CUP/Concessione suolo pubblico sono condizionali al SOLO tipo "Esposizione
  // pubblicitaria (Comunale)" (nota 'autorizzazione-tipologia-overhaul'): le altre 6
  // tipologie di Autorizzazione non hanno CUP. V1 (solo Comunale/Genio Civile, sempre col
  // CUP) resta invariata.
  const isEsposizionePubblicitaria = isV2 ? f.tipoAutorizzazione === TIPO_AUTORIZZAZIONE_ESPOSIZIONE : true;

  const canSave = isConcessione
    ? ((isV2 || !!f.tipoConcessione) && !!f.enteEmittente.trim() && !!f.tipoDocumento && !!f.idDocumento.trim()
        && !!f.dataStipula && (!isV2 || !!f.dataDecorrenza) && !!f.dataScadenza
        && (isV2 ? impiantiConcessioneValid : utenzeValid))
    : isAutorizzazione
    ? (!!f.tipoAutorizzazione && !!f.enteEmittente.trim() && !!f.numeroProtocollo.trim()
        && !!f.dataStipula && (!isV2 || !!f.dataDecorrenza) && !!f.dataScadenza
        && (isV2 ? impiantiAutorizzatiValid : (f.cup != null && f.cup > 0)))
    : (!!f.proprietarioLocatore.trim() && !!f.tipoContratto && !!f.identificativoContratto.trim()
        && impiantiContrattoValid && !!f.dataStipula && !!f.dataDecorrenza && !!f.dataScadenza);

  const handleClose = () => onClose();

  const handleSave = () => {
    const stato = f.dataScadenza && f.dataScadenza.isBefore(dayjs(), 'day') ? 'Scaduta' : 'Attiva';
    if (isConcessione) {
      onSave('concessione', {
        id: 'conc-' + Date.now(),
        tipologia: isV2 ? undefined : f.tipoConcessione,
        enteEmittente: f.enteEmittente.trim(),
        tipoDocumento: f.tipoDocumento,
        identificativoDocumento: f.idDocumento.trim(),
        // v2 — Numeri Utenza vive per-impianto in impiantiConcessione ora (nota
        // 'concessione-contratto-impianti-collegati'), non più come lista piatta sul record.
        numeriUtenze: isV2 ? [] : f.utenze.map(u => u.numero.trim()),
        dataStipula: f.dataStipula.format('DD/MM/YYYY'),
        dataDecorrenza: f.dataDecorrenza ? f.dataDecorrenza.format('DD/MM/YYYY') : undefined,
        dataScadenza: f.dataScadenza.format('DD/MM/YYYY'),
        // v2 — niente più canone: come il CUP su Autorizzazione, non si registra in questo form.
        totaleCanone: isV2 ? 0 : f.utenze.reduce((s, u) => s + (Number(u.canone) || 0), 0),
        stato, promemoria: f.promemoria,
        giorniPreavviso: PROMEMORIA_GIORNI[f.promemoria] ?? null, statoOverride: null,
        modalitaAttribuzione: f.modalitaAttribuzione,
        riferimentoBando: f.riferimentoBando.trim(),
        enteBanditore: f.enteBanditore.trim(),
        dataAggiudicazione: f.dataAggiudicazione ? f.dataAggiudicazione.format('DD/MM/YYYY') : null,
        lotto: f.lotto.trim(),
        noteBando: f.noteBando.trim(),
        ubicazione: f.ubicazione.trim(),
        superficieConcessaMq: f.superficieConcessaMq,
        // v2 — Impianti collegati: ogni riga è un impianto col proprio numero utenza e canone
        // patrimoniale. spaziCollegati si popola qui stesso, così "Spazi collegati" nel
        // dettaglio li mostra subito — stesso pattern dell'Autorizzazione.
        impiantiConcessione: isV2 ? f.impiantiConcessione.filter(r => !r._seed).map(r => ({ impiantoId: r.impiantoId, numeroUtenza: r.numeroUtenza.trim() })) : [],
        spaziCollegati: isV2 ? f.impiantiConcessione.filter(r => !r._seed).map(r => MOCK_SPAZI.find(s => s.id === r.impiantoId)).filter(Boolean) : [],
      });
    } else if (isAutorizzazione) {
      onSave('autorizzazione', {
        id: 'aut-' + Date.now(),
        // v2 — tipologia (vecchio enum, solo V1) vs tipologiaV2 (nuovo enum a 7 valori, nota
        // 'autorizzazione-tipologia-overhaul'): campi paralleli, mai lo stesso valore.
        tipologia: isV2 ? undefined : f.tipoAutorizzazione,
        tipologiaV2: isV2 ? f.tipoAutorizzazione : undefined,
        enteEmittente: f.enteEmittente.trim(),
        identificativoDocumento: f.numeroProtocollo.trim(),
        dataStipula: f.dataStipula.format('DD/MM/YYYY'),
        dataDecorrenza: f.dataDecorrenza ? f.dataDecorrenza.format('DD/MM/YYYY') : undefined,
        dataScadenza: f.dataScadenza.format('DD/MM/YYYY'),
        // v2 — CUP non è più un valore singolo sull'Autorizzazione: vive per riga in
        // impiantiAutorizzati (Tab 2, nota 'autorizzazione-impianti-tab-dedicata'). Il campo
        // `cup` a livello di record resta solo per V1 (form a pannello unico, invariato).
        cup: isV2 ? 0 : (Number(f.cup) || 0),
        stato, promemoria: f.promemoria,
        giorniPreavviso: PROMEMORIA_GIORNI[f.promemoria] ?? null, statoOverride: null,
        includeConcessioneSuoloPubblico: isEsposizionePubblicitaria && f.includeConcessioneSuoloPubblico,
        // v2 — attiProvenienzaIds è l'opposto di includeConcessioneSuoloPubblico, non un suo
        // figlio: si salva SOLO quando il check è spento (nota 'autorizzazione-atto-provenienza-scollegato').
        // Più atti collegabili (Concessioni e/o Contratti Privati), non più un legame singolo.
        attiProvenienzaIds: isEsposizionePubblicitaria && !f.includeConcessioneSuoloPubblico ? f.attiProvenienzaIds : [],
        // v2 — Estensione/Tipo/Durata Occupazione (box "Occupazione di Suolo Pubblico"): hanno
        // senso solo quando il check è acceso, si salvano solo in quel caso.
        estensioneOccupazioneMq: isEsposizionePubblicitaria && f.includeConcessioneSuoloPubblico ? f.estensioneOccupazioneMq : null,
        tipoOccupazione: isEsposizionePubblicitaria && f.includeConcessioneSuoloPubblico ? f.tipoOccupazione : null,
        durataOccupazioneGiorni: isEsposizionePubblicitaria && f.includeConcessioneSuoloPubblico && f.tipoOccupazione === 'Temporanea' ? f.durataOccupazioneGiorni : null,
        // v2 — Tab 2: ogni riga è un impianto con il proprio codice cimasa — il CUP non vive più
        // qui (nota 'cup-pratica-a-parte-legata-impianto'), è una pratica a sé legata
        // all'impianto. spaziCollegati si popola qui stesso dagli impianti scelti in Tab 2, così
        // "Spazi collegati" nel dettaglio li mostra subito — "Collega Spazi" resta comunque
        // disponibile dopo il salvataggio per aggiungerne altri senza cimasa dedicata.
        impiantiAutorizzati: isV2 ? f.impiantiAutorizzati.filter(r => !r._seed).map(r => ({ impiantoId: r.impiantoId, codiceAutorizzazione: r.codiceAutorizzazione.trim() })) : [],
        spaziCollegati: isV2 ? f.impiantiAutorizzati.filter(r => !r._seed).map(r => MOCK_SPAZI.find(s => s.id === r.impiantoId)).filter(Boolean) : [],
      });
    } else {
      onSave('contratto', {
        id: 'contr-' + Date.now(),
        proprietarioLocatore: f.proprietarioLocatore.trim(),
        tipoContratto: f.tipoContratto,
        identificativoContratto: f.identificativoContratto.trim(),
        dataStipula: f.dataStipula.format('DD/MM/YYYY'),
        dataDecorrenza: f.dataDecorrenza ? f.dataDecorrenza.format('DD/MM/YYYY') : undefined,
        dataScadenza: f.dataScadenza.format('DD/MM/YYYY'),
        foglio: f.foglio.trim(),
        particella: f.particella.trim(),
        subalterno: f.subalterno.trim(),
        indirizzo: f.indirizzo.trim(),
        stato, promemoria: f.promemoria,
        giorniPreavviso: PROMEMORIA_GIORNI[f.promemoria] ?? null, statoOverride: null,
        // v2 — Impianti collegati: ogni riga è un impianto col proprio numero utenza e canone
        // di locazione. spaziCollegati si popola qui stesso, come per Concessione/Autorizzazione.
        impiantiContratto: f.impiantiContratto.filter(r => !r._seed).map(r => ({ impiantoId: r.impiantoId, numeroUtenza: r.numeroUtenza.trim() })),
        spaziCollegati: f.impiantiContratto.filter(r => !r._seed).map(r => MOCK_SPAZI.find(s => s.id === r.impiantoId)).filter(Boolean),
      });
    }
  };

  const datePreset = [{ label: 'Oggi', value: dayjs() }];

  // Solo per l'handoff: Select/DatePicker AntD non rispondono a click sintetici
  // (serve un click reale del sistema operativo), quindi il tour non può
  // "compilarli" via JS — esponiamo i setter React direttamente, sempre
  // aggiornati ad ogni render (nessun array di dipendenze).
  React.useEffect(() => {
    if (!open) { delete window.__ghfPermitForm; return; }
    window.__ghfPermitForm = {
      fillConcessioneExample: () => setF(prev => ({

// un marker per impianto con l'icona tipologia dello stato amministrativo "Attivo"; si aggiorna
// a ogni collegamento/rimozione e inquadra i marker presenti. Senza impianti collegati mostra
// la città con un messaggio, non una mappa vuota senza spiegazione.
function ImpiantiLinkedMap({ spazi, height = 320 }) {
  const containerRef = useRef(null);
  const mapRef = useRef(null);
  const layerRef = useRef(null);
  const [iconsReady, setIconsReady] = useState(0);
  const srcOf = (s) => window.GravityMap.markerSrc(s.tipo, 'active', s.canale);

  useEffect(() => {
    if (mapRef.current || !containerRef.current || !window.L) return;
    const map = L.map(containerRef.current, { center: [38.1155, 13.3615], zoom: 13, zoomControl: true, attributionControl: false });
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16 }).addTo(map);
    layerRef.current = L.layerGroup().addTo(map);
    mapRef.current = map;
    map.on('zoomend', () => setIconsReady(n => n + 1));
    return () => { map.remove(); mapRef.current = null; };
  }, []);

    const map = mapRef.current;
    if (!map) return;
    let cancelled = false;
    window.GravityMap.preloadAll([...new Set(spazi.map(srcOf))]).then(() => {
      if (cancelled) return;
      layerRef.current.clearLayers();
      spazi.forEach(s => {
        L.marker([s.lat, s.lng], { icon: window.GravityMap.makeMarkerIcon({ src: srcOf(s), zoom: map.getZoom(), flags: {} }) })
          .bindTooltip(s.alias || s.id, { direction: 'top', offset: [0, -28] })
          .addTo(layerRef.current);
      });
      if (spazi.length === 1) map.setView([spazi[0].lat, spazi[0].lng], 15);
      else if (spazi.length > 1) map.fitBounds(L.latLngBounds(spazi.map(s => [s.lat, s.lng])), { padding: [48, 48], maxZoom: 15 });
      else map.setView([38.1155, 13.3615], 13);
    });
    return () => { cancelled = true; };
  }, [key, iconsReady]);

  return React.createElement('div', { style: { position: 'relative', borderRadius: 8, overflow: 'hidden', border: '1px solid #F0F0F0' } },

}

  const setterByKind = { concessione: setConcessioni, autorizzazione: setAutorizzazioni, contratto: setContratti };

  const stubEdit = () => messageApi.info('Disponibile nelle prossime fasi di questo prototipo.');

  const viewConcessione = record => openDetail('concessione', record);
  const viewAutorizzazione = record => openDetail('autorizzazione', record);
  const viewContratto = record => openDetail('contratto', record);

  // Solo per l'handoff: esposizione dei setter React per i tour di Sprint Jira —
  // sempre aggiornati ad ogni render (nessun array di dipendenze), niente guardia

  React.useEffect(() => {
    window.__ghfPermessi = {
      goToLista: () => setViewState({ page: 'list' }),
      goToConcessioniTab: () => setActiveTab('concessioni'),
      goToAutorizzazioniTab: () => setActiveTab('autorizzazioni'),

      openNuovaConcessione: () => setNewPermitType('concessione'),
      openNuovaAutorizzazione: () => setNewPermitType('autorizzazione'),
      openNuovoContratto: () => setNewPermitType('contratto'),
      closeNewPermit: () => setNewPermitType(null),

    return () => { delete window.__ghfPermessi; };
  });

  const connettiSpazi = (kind, id, nuoviSpazi) => {
    setterByKind[kind](prev => prev.map(r => r.id === id ? { ...r, spaziCollegati: [...r.spaziCollegati, ...nuoviSpazi] } : r));
  };
  const scollegaSpazio = (kind, id, spazioId) => {
    setterByKind[kind](prev => prev.map(r => r.id === id ? { ...r, spaziCollegati: r.spaziCollegati.filter(s => s.id !== spazioId) } : r));
    messageApi.success('Spazio scollegato');

  // v2 — override manuale dello Stato (nota 'stato-engine-base-comune'): null torna al calcolo automatico.
  const setStatoOverride = (kind, id, nextOverride) => {

    contrattiList: contratti,
    onBack: () => setViewState({ page: 'list' }),
    onConnettiSpazi: (nuoviSpazi) => connettiSpazi(viewState.kind, viewState.id, nuoviSpazi),
    onScollegaSpazio: (spazioId) => scollegaSpazio(viewState.kind, viewState.id, spazioId),
    onSetStatoOverride: (nextOverride) => setStatoOverride(viewState.kind, viewState.id, nextOverride),
  });

  return React.createElement(ConfigProvider, { theme: window.GRAVITY_THEME },
    React.createElement(AntApp, null,
      contextHolder,
      React.createElement('div', { className: 'app-shell' },
        React.createElement(window.GravityNavbar, null),
        React.createElement('div', { className: isV2 ? 'lic-content lic-v2' : 'lic-content' },
          viewState.page === 'detail' && currentRecord ? detailView : listView,
        ),
      ),

      React.createElement(PermitFormDrawer, {
        open: !!newPermitType, type: newPermitType, isV2,
        concessioniList: concessioni, autorizzazioniList: autorizzazioni, contrattiList: contratti,
        onClose: () => setNewPermitType(null),
        onSave: handleSaveNewPermit,
      }),
    ),
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(AppRoot));
</script>
<!-- Motore handoff — caricato solo se il loader in <head> ha attivato il layer. -->
<script>
  if (window.__HANDOFF_ACTIVE) document.write('<scr' + 'ipt src="../_shared/handoff.js"></scr' + 'ipt>');
</script>
<script>
  // Riparenta lo slot della dev bar su <body>: dentro <nav> (position:sticky,
  // z-index:100) resta intrappolato nel suo stacking context e nessun z-index
  // interno può superare i Drawer del prototipo (z-index:1000). Attivo solo in
  // modalità handoff (vedi loader in <head>). Pattern identico a inventory-systems.
  if (window.__HANDOFF_ACTIVE) {
    setInterval(function () {
      var slot = document.getElementById('ghf-nav-slot');
      if (!slot) return;
      if (slot.parentElement !== document.body) document.body.appendChild(slot);
    }, 300);
  }
</script>
</body>
</html>
