       semplificata) SOLO con ?handoff=<versione>. Senza il parametro questo è il
       prototipo pulito. Le versioni sono file di config: il prototipo resta unico.
       Il document.write in <head> carica la config in modo sincrono, così le note
       inline (window.HANDOFF_NOTES) sono disponibili già al primo render.

       ECCEZIONE documentata (vedi components/handoff-engine.md → "Switch UI reale
       v1/v2 — Permessi"): qui la versione handoff pilota ANCHE un vero switch di UI
       della lista (window.__PERMESSI_UI_VERSION), non solo le annotazioni. Senza
       ?handoff, o con ?handoff=v1, resta la UI v1 (approvata, invariata); solo
       ?handoff=v2 attiva la UI v2 (nuova, components/list-table.md). -->
  <script>
    (function () {
      var CONFIGS  = { v1: './handoff-steps-v1.js', v2: './handoff-steps.js' };
      var APPROVED = 'v1';
      window.__PERMESSI_UI_VERSION = APPROVED;
      var params = new URLSearchParams(location.search);
      if (!params.has('handoff')) return;
      var v = (params.get('handoff') || APPROVED).toLowerCase();
      var cfg = CONFIGS[v] || CONFIGS[APPROVED];
      window.__PERMESSI_UI_VERSION = CONFIGS[v] ? v : APPROVED;
      window.__HANDOFF_ACTIVE = true;
      document.write('<scr' + 'ipt src="' + cfg + '"></scr' + 'ipt>');
    })();
  </script>

function _ghfRenderNoteBody(body) {
  const inline = (txt, kp) => {
    const out = []; let k = 0, last = 0, m;
    const re = /(\*\*([^*]+)\*\*|==([^=]+)==)/g;
    while ((m = re.exec(txt))) {
      if (m.index > last) out.push(txt.slice(last, m.index));
      if (m[2] != null) out.push(React.createElement('strong', { key: kp+'b'+(k++), style: { color: 'rgba(0,0,0,0.88)' } }, m[2]));
      else out.push(React.createElement('mark', { key: kp+'h'+(k++), style: { background: '#FFF1E8', color: '#FF4A1C', padding: '0 2px', borderRadius: 2 } }, m[3]));
      last = m.index + m[0].length;
    }
    if (last < txt.length) out.push(txt.slice(last));
    return out;
  };
  const lines = String(body || '').split('\n');
  const nodes = []; let list = null;
  lines.forEach((ln, i) => {
    if (/^- /.test(ln)) { (list = list || []).push(React.createElement('li', { key: 'li'+i, style: { marginBottom: 2 } }, inline(ln.slice(2), 'li'+i))); }
    else {
      if (list) { nodes.push(React.createElement('ul', { key: 'ul'+i, style: { margin: '4px 0', paddingLeft: 18 } }, list)); list = null; }

    }
  });
  if (list) nodes.push(React.createElement('ul', { key: 'ulE', style: { margin: '4px 0', paddingLeft: 18 } }, list));
  return nodes;
}

const fmtEuro = (n) => {

  const [int, dec] = v.toFixed(2).split('.');
  return int.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + dec + ' €';

// 'autorizzazione-impianti-tab-dedicata'), non più il campo singolo `cup` (sempre 0 sui

const parseItDate = (s) => {
  if (!s) return 0;
  const [d, m, y] = s.split('/').map(Number);
  return new Date(y, m - 1, d).getTime();
};

// v2 — base comune: stato esteso a 7 valori (nota 'stato-engine-base-comune'). In istruttoria/
// Attiva/In scadenza/Scaduta sono CALCOLATI dalle date + giorniPreavviso; Revocata/Decaduta,
// In rinnovo e Cessata sono impostati MANUALMENTE (override) dall'operatore e prevalgono
// sempre sul calcolo automatico. V1 non usa questo enum: resta sul campo `stato` a 2 valori
// (Attiva/Scaduta) e su STATO_BADGE/renderStato sopra, invariati.
const STATO_OPTS_V2 = ['In istruttoria', 'Attiva', 'In scadenza', 'Scaduta', 'In rinnovo', 'Revocata/Decaduta', 'Cessata'];
const STATO_MANUALE_OPTS_V2 = ['In rinnovo', 'Revocata/Decaduta', 'Cessata'];

  'In rinnovo': 'processing',
  'Revocata/Decaduta': 'error',
  Cessata: 'default',
};
const oggiMezzanotte = () => new Date(new Date().toDateString()).getTime();
function computeStatoAutomaticoV2(dataDecorrenza, dataScadenza, giorniPreavviso) {
  const oggiTs = oggiMezzanotte();
  const decorrenzaTs = dataDecorrenza ? parseItDate(dataDecorrenza) : null;
  const scadenzaTs = dataScadenza ? parseItDate(dataScadenza) : null;
  if (decorrenzaTs != null && oggiTs < decorrenzaTs) return 'In istruttoria';
  if (scadenzaTs != null && oggiTs >= scadenzaTs) return 'Scaduta';
  if (scadenzaTs != null && giorniPreavviso != null && oggiTs >= scadenzaTs - giorniPreavviso * 86400000) return 'In scadenza';
  return 'Attiva';
}

function PermitFormDrawer({ open, type, isV2, concessioniList, autorizzazioniList, contrattiList, onClose, onSave }) {
  const [f, setF] = useState(EMPTY_PERMIT_STATE);
  const set = (key) => (val) => setF(prev => ({ ...prev, [key]: val }));

  // v2 — Autorizzazione: drawer a due tab (nota 'autorizzazione-impianti-tab-dedicata'),
  // ispirato al Nuovo Impianto di inventory-systems. 'info' = dati generali (ex unico
  // pannello), 'impianti' = editor a righe per impianto — disabilitata finché il Tipo
  // Autorizzazione non è scelto (serve a filtrare gli impianti già autorizzati).
  const [activeTab, setActiveTab] = useState('info');

  useEffect(() => {
    if (open) {
      setF(EMPTY_PERMIT_STATE);
      setActiveTab('info');
    }
  }, [open, type]);

  const isConcessione = type === 'concessione';
  const isAutorizzazione = type === 'autorizzazione';
  const isContratto = type === 'contratto';
  const title = isConcessione ? 'Nuova Concessione' : isAutorizzazione ? 'Nuova Autorizzazione' : 'Nuovo Contratto Privato';

  // Cambiare enum di classificazione pulisce i campi condizionali ora irrilevanti, così il
  // salvataggio non porta con sé dati "fantasma" di una scelta precedente non più visibile.
  const onModalitaAttribuzioneChange = (v) => setF(prev => ({
    ...prev, modalitaAttribuzione: v,
    ...(v !== 'Bando pubblico' ? { riferimentoBando: '', enteBanditore: '', dataAggiudicazione: null, lotto: '', noteBando: '' } : {}),
  }));
  // v2 — Include concessione suolo pubblico e Atto di provenienza (Concessione/Contratto)
  // sono due situazioni MUTUALMENTE ESCLUSIVE, non una il figlio dell'altra (nota
  // 'autorizzazione-atto-provenienza-scollegato'): il check dice che l'atto autorizzativo
  // include già di per sé una concessione implicita; senza check, l'Autorizzazione è invece
  // collegata a un atto (Concessione o Contratto Privato) che ha dato il bene poi autorizzato.
  const onIncludeSuoloChange = (checked) => setF(prev => ({
    ...prev, includeConcessioneSuoloPubblico: checked,
    ...(checked ? { attoProvenienzaId: null } : {}),

      (record.impiantiAutorizzati || []).length === 0
        ? React.createElement('span', { style: { fontSize: 13, color: 'rgba(0,0,0,0.45)' } }, 'Nessuno.')
        : React.createElement(Table, {

              { title: 'Codice Autorizzazione (per cimasa)', dataIndex: 'codiceAutorizzazione', render: v => v || '—' },

      React.createElement(Descriptions, { size: 'small', column: 3, bordered: true },
        React.createElement(Descriptions.Item, { label: 'Foglio' }, record.foglio || '—'),
        React.createElement(Descriptions.Item, { label: 'Particella' }, record.particella || '—'),
        React.createElement(Descriptions.Item, { label: 'Subalterno' }, record.subalterno || '—'),
      ),

    // v2 — nota 'contratto-vista-derivata': nessun FK, dedotte dagli impianti in comune.
    isContratto && React.createElement('div', { className: 'grav-detail-autorizzazioni-derivate', style: { marginBottom: 24 } },
      React.createElement(Title, { level: 4, style: { margin: '0 0 12px' } },
        tipLabel('Autorizzazioni collegate', 'Calcolate automaticamente dagli impianti che condividono con questo Contratto. Non devi collegarle manualmente.'),
        React.createElement(HandoffDesignNote, { id: 'contratto-vista-derivata', placement: 'right' })),
      autorizzazioniDerivate.length === 0
        ? React.createElement('span', { style: { fontSize: 13, color: 'rgba(0,0,0,0.45)' } }, 'Nessuna — nessun impianto di questo Contratto è collegato anche a un\'Autorizzazione.')
        : React.createElement(Space, { wrap: true }, autorizzazioniDerivate.map(a => React.createElement(Tag, { key: a.id }, `${a.identificativoDocumento} — ${a.enteEmittente}`))),
    ),

    React.createElement('div', { className: 'grav-detail-spazi-header', style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 } },
      React.createElement('div', { style: { display: 'flex', alignItems: 'center' } },
        React.createElement(Title, { level: 4, style: { margin: 0 } }, 'Spazi collegati'),
        isV2 && !isContratto && React.createElement(HandoffDesignNote, { id: 'promemoria-aggiorna-cimasa', placement: 'right' }),
        isV2 && React.createElement(HandoffDesignNote, { id: 'impianto-campi-trasversali-scope', placement: 'right' }),
        isV2 && React.createElement(HandoffDesignNote, { id: 'impianto-bidirezionale-solo-su-card', placement: 'right' }),
      ),
      React.createElement('span', { style: { fontSize: 13, color: 'rgba(0,0,0,0.45)' } },
        'Totale: ', spazi.length, spazi.length === 1 ? ' spazio' : ' spazi'),
    ),

    React.createElement('div', { className: 'grav-detail-spazi-area' },
      spazi.length === 0
        ? React.createElement(Empty, {
            description: 'Nessuno spazio collegato a questo permesso.',
            image: Empty.PRESENTED_IMAGE_SIMPLE,
            style: { padding: '32px 0', background: '#fff', border: '1px solid #F0F0F0', borderRadius: 8 },
          })
        : React.createElement(Row, { gutter: [16, 16] },
            spazi.map(s => React.createElement(Col, { span: 8, key: s.id },
              React.createElement(window.GravityEntityCard, {
                title: s.indirizzo,
                badges: [
                  { text: s.id, variant: 'default' },
                  { text: s.canale, variant: s.canale === 'OOH' ? 'ooh' : 'dooh' },
                ],
                fields: [
                  { icon: TYPE_ICON_NAMES_SPAZI[s.tipo], label: 'Tipo:', value: s.tipo },
                  { icon: 'ExpandOutlined', label: 'Formato:', value: s.formato },
                  { icon: 'AppstoreOutlined', label: 'Facce:', value: String(s.facce) },
                  { icon: 'ShopOutlined', label: 'Proprietario:', value: s.proprietario },
                  ...(isV2 ? [
                    { icon: 'FileProtectOutlined', label: 'Cimasa:', value: s.codiceCimasa ? `${s.statoCimasa} (${s.codiceCimasa})` : s.statoCimasa },
                    { icon: 'IdcardOutlined', label: 'Codice interno:', value: s.codiceInterno },
                    { icon: 'ExpandOutlined', label: 'Superficie:', value: `${s.superficieMq} mq${s.digitale ? ' · Digitale' : ''}` },
                    ...(s.utenzaElettrica ? [{ icon: 'ThunderboltOutlined', label: 'POD:', value: s.utenzaElettrica.codicePod }] : []),
                    // v2 — "dalla scheda impianto vedo i suoi permessi" (parziale, sulla
                    // card invece di una scheda Impianto dedicata — nota

                    // relazione per QUESTO impianto specifico.
                    ...(isAutorizzazione
                      ? (() => {

                          const contr = getContrattoDerivato([s], contrattiList);
                          return conc

                            : [];
                        })()
                      : (() => {
                          const derivate = getAutorizzazioniDerivate([s], autorizzazioniList);
                          return derivate.length > 0

    React.createElement(ConnettiImpiantiDrawer, {
      open: drawerOpen,
      excludeIds: spazi.map(s => s.id),
      isV2,
      naturaSuoloRichiesta: isV2 ? (isConcessione ? 'Pubblico' : isContratto ? 'Privato' : null) : null,
      onClose: () => setDrawerOpen(false),
      onConnetti: (nuoviSpazi) => {

        setDrawerOpen(false);

      },

// ─────────────────────────────────────────────────────────
// APP
// ─────────────────────────────────────────────────────────
function AppRoot() {
  const [messageApi, contextHolder] = message.useMessage();
  const [concessioni, setConcessioni] = useState(MOCK_CONCESSIONI);
  const [autorizzazioni, setAutorizzazioni] = useState(MOCK_AUTORIZZAZIONI);
  const [contratti, setContratti] = useState(MOCK_CONTRATTI);
  const [newPermitType, setNewPermitType] = useState(null); // null | 'concessione' | 'autorizzazione' | 'contratto'
  const [viewState, setViewState] = useState({ page: 'list' }); // { page: 'list' } | { page: 'detail', kind, id }

  // UI v2 (components/list-table.md) SOLO con ?handoff=v2 — eccezione documentata in
  // components/handoff-engine.md. Default e ?handoff=v1 restano sulla UI v1 (PermitTable,
  // 2 tab, invariata): il nuovo modello dati (Provenienza, CUP split, Copertura, Contratto
  // Privato, campi trasversali Impianto) vive SOLO dietro questo switch.
  const isV2 = window.__PERMESSI_UI_VERSION === 'v2';
  const TableComponent = isV2 ? PermitTableV2 : PermitTable;
  // v2 — ordine entità Autorizzazione, Concessione, Contratto Privato, su richiesta
  // esplicita; v1 resta 'concessioni' invariato.
  const [activeTab, setActiveTab] = useState(isV2 ? 'autorizzazioni' : 'concessioni');

  // Lookup per kind — evita triplicare ogni funzione (connetti/scollega/elimina/vedi/lista).
  const listByKind = { concessione: concessioni, autorizzazione: autorizzazioni, contratto: contratti };
  const setterByKind = { concessione: setConcessioni, autorizzazione: setAutorizzazioni, contratto: setContratti };

  const stubEdit = () => messageApi.info('Disponibile nelle prossime fasi di questo prototipo.');
  const openDetail = (kind, record) => setViewState({ page: 'detail', kind, id: record.id });
  const viewConcessione = record => openDetail('concessione', record);
  const viewAutorizzazione = record => openDetail('autorizzazione', record);
  const viewContratto = record => openDetail('contratto', record);

  // Solo per l'handoff: esposizione dei setter React per i tour di Sprint Jira —
  // sempre aggiornati ad ogni render (nessun array di dipendenze), niente guardia
  // su `open` perché AppRoot resta montato per tutta la sessione.
  React.useEffect(() => {
    window.__ghfPermessi = {
      goToLista: () => setViewState({ page: 'list' }),
      goToConcessioniTab: () => setActiveTab('concessioni'),
      goToAutorizzazioniTab: () => setActiveTab('autorizzazioni'),
      goToContrattiTab: () => setActiveTab('contratti'),
      openFirstDetail: (kind) => {
        const list = listByKind[kind];
        if (list[0]) setViewState({ page: 'detail', kind, id: list[0].id });
      },
      openNuovaConcessione: () => setNewPermitType('concessione'),
      openNuovaAutorizzazione: () => setNewPermitType('autorizzazione'),
      openNuovoContratto: () => setNewPermitType('contratto'),
      closeNewPermit: () => setNewPermitType(null),
    };
    return () => { delete window.__ghfPermessi; };
  });

  const connettiSpazi = (kind, id, nuoviSpazi) => {
    setterByKind[kind](prev => prev.map(r => r.id === id ? { ...r, spaziCollegati: [...r.spaziCollegati, ...nuoviSpazi] } : r));
  };
  const scollegaSpazio = (kind, id, spazioId) => {
    setterByKind[kind](prev => prev.map(r => r.id === id ? { ...r, spaziCollegati: r.spaziCollegati.filter(s => s.id !== spazioId) } : r));
    messageApi.success('Spazio scollegato');
  };
  // v2 — override manuale dello Stato (nota 'stato-engine-base-comune'): null torna al calcolo automatico.
  const setStatoOverride = (kind, id, nextOverride) => {
    setterByKind[kind](prev => prev.map(r => r.id === id ? { ...r, statoOverride: nextOverride } : r));
    messageApi.success(nextOverride ? `Stato impostato manualmente: ${nextOverride}` : 'Stato tornato automatico');
  };

  const deleteConcessione = (record) => {
    setConcessioni(prev => prev.filter(c => c.id !== record.id));
    messageApi.success('Concessione eliminata');
  };
  const deleteAutorizzazione = (record) => {
    setAutorizzazioni(prev => prev.filter(a => a.id !== record.id));
    messageApi.success('Autorizzazione eliminata');
  };
  const deleteContratto = (record) => {
    setContratti(prev => prev.filter(c => c.id !== record.id));
    messageApi.success('Contratto Privato eliminato');
  };

  const concessioniColumns = useMemo(() => {
    // v1 — colonna Tipologia (Pubblico/Privato) invariata: la Concessione era anche privata
    // nel modello as-is. v2 la rimuove: la Concessione è solo atto di diritto pubblico (nota
    // 'concessione-solo-pubblica'), il caso privato vive su Contratto Privato.
    const tipologiaColV1 = {
      title: 'Tipologia Concessione', dataIndex: 'tipologia', width: 170,
      filters: [{ text: 'Pubblico', value: 'Pubblico' }, { text: 'Privato', value: 'Privato' }],
      onFilter: (value, record) => record.tipologia === value,
      render: v => renderTipologia(CONCESSIONE_TIPO_META, v),
    };
    const base = [
      { title: 'Ente Emittente', dataIndex: 'enteEmittente', width: 220, ...makeSearchFilter('enteEmittente') },
      { title: 'Tipo Documento', dataIndex: 'tipoDocumento', width: 200 },
      { title: 'Identificativo Documento', dataIndex: 'identificativoDocumento', width: 180, ...makeSearchFilter('identificativoDocumento') },
      { title: 'Numeri Utenze', dataIndex: 'numeriUtenze', width: 200, render: renderNumeriUtenze },
      { title: 'Data Stipula', dataIndex: 'dataStipula', width: 120, sorter: (a, b) => parseItDate(a.dataStipula) - parseItDate(b.dataStipula) },
      { title: 'Data Scadenza', dataIndex: 'dataScadenza', width: 130, sorter: (a, b) => parseItDate(a.dataScadenza) - parseItDate(b.dataScadenza) },
      { title: 'Totale Canone', dataIndex: 'totaleCanone', width: 140, align: 'right', sorter: (a, b) => a.totaleCanone - b.totaleCanone, render: fmtEuro },
    ];
    const v2Extra = [
      { title: 'Data Decorrenza', dataIndex: 'dataDecorrenza', width: 130, sorter: (a, b) => parseItDate(a.dataDecorrenza) - parseItDate(b.dataDecorrenza) },
      { title: 'Modalità Attribuzione', dataIndex: 'modalitaAttribuzione', width: 200,
        filters: MODALITA_ATTRIBUZIONE_OPTS, onFilter: (v, r) => r.modalitaAttribuzione === v },
    ];
    const tail = [
      statoColumn(isV2),
      actionsColumn('concessione', viewConcessione, stubEdit, deleteConcessione),
    ];
    return isV2 ? [...base, ...v2Extra, ...tail] : [tipologiaColV1, ...base, ...tail];
  }, [isV2]);

  const autorizzazioniColumns = useMemo(() => {
    const base = [
      // v2 — legge tipologiaV2 + META_V2 (nota 'autorizzazione-tipologia-overhaul'); V1 resta
      // su tipologia + META originale, invariati.
      isV2 ? {
        title: 'Tipologia Autorizzazione', width: 240,
        filters: TIPO_AUTORIZZAZIONE_OPTS_V2.map(o => ({ text: o.label, value: o.value })),
        onFilter: (value, record) => record.tipologiaV2 === value,
        render: (_, record) => renderTipologia(AUTORIZZAZIONE_TIPO_META_V2, record.tipologiaV2),
      } : {
        title: 'Tipologia Autorizzazione', dataIndex: 'tipologia', width: 190,
        filters: TIPO_AUTORIZZAZIONE_OPTS.map(o => ({ text: o.label, value: o.value })),
        onFilter: (value, record) => record.tipologia === value,
        render: v => renderTipologia(AUTORIZZAZIONE_TIPO_META, v),
      },
      { title: 'Ente Emittente', dataIndex: 'enteEmittente', width: 220, ...makeSearchFilter('enteEmittente') },
      { title: 'Identificativo Documento', dataIndex: 'identificativoDocumento', width: 180, ...makeSearchFilter('identificativoDocumento') },
      { title: 'Data Stipula', dataIndex: 'dataStipula', width: 120, sorter: (a, b) => parseItDate(a.dataStipula) - parseItDate(b.dataStipula) },
      { title: 'Data Scadenza', dataIndex: 'dataScadenza', width: 130, sorter: (a, b) => parseItDate(a.dataScadenza) - parseItDate(b.dataScadenza) },
      // v2 — CUP condizionale al tipo "Esposizione pubblicitaria": '—' per le altre 6 (nota
      // 'autorizzazione-tipologia-overhaul'). V1 mostra sempre l'importo, invariato. In v2 il
      // valore è la somma delle righe di Tab 2 (nota 'autorizzazione-impianti-tab-dedicata'),
      // non più il campo singolo `cup` (sempre 0 sui record creati in v2).
      { title: 'CUP (€)', dataIndex: 'cup', width: 130, align: 'right',
        sorter: (a, b) => cupTotale(a, isV2) - cupTotale(b, isV2),
        render: (v, r) => (!isV2 || r.tipologiaV2 === TIPO_AUTORIZZAZIONE_ESPOSIZIONE) ? fmtEuro(cupTotale(r, isV2)) : React.createElement('span', { style: { color: 'rgba(0,0,0,0.25)' } }, '—') },
    ];
    const v2Extra = [
      { title: 'Data Decorrenza', dataIndex: 'dataDecorrenza', width: 130, sorter: (a, b) => parseItDate(a.dataDecorrenza) - parseItDate(b.dataDecorrenza) },
      { title: 'Impianti Autorizzati', dataIndex: 'impiantiAutorizzati', width: 160, align: 'right',
        sorter: (a, b) => (a.impiantiAutorizzati || []).length - (b.impiantiAutorizzati || []).length,
        render: v => (v || []).length },
    ];
    const tail = [
      statoColumn(isV2),
      actionsColumn('autorizzazione', viewAutorizzazione, stubEdit, deleteAutorizzazione),
    ];
    return isV2 ? [...base, ...v2Extra, ...tail] : [...base, ...tail];
  }, [isV2]);

  // v2 — nuova entità, nessun equivalente v1.
  const contrattiColumns = useMemo(() => ([
    { title: 'Tipo Contratto', dataIndex: 'tipoContratto', width: 140, render: renderTipoContratto,
      filters: TIPO_CONTRATTO_OPTS, onFilter: (v, r) => r.tipoContratto === v },
    { title: 'Proprietario/Locatore', dataIndex: 'proprietarioLocatore', width: 220, ...makeSearchFilter('proprietarioLocatore') },
    { title: 'Identificativo Contratto', dataIndex: 'identificativoContratto', width: 200, ...makeSearchFilter('identificativoContratto'),
      render: (v, r) => React.createElement('span', null, v,
        r.migrata && React.createElement(Tooltip, { title: `Arriva dalla Concessione ${r.migratoDa}. Controlla che i dati siano ancora corretti.` },
          React.createElement(Tag, { color: 'gold', style: { marginInlineStart: 6 } }, 'Migrata')),
        r.migrata && React.createElement(HandoffDesignNote, { id: 'migrazione-concessioni-privato', placement: 'right' })) },
    { title: 'Data Stipula', dataIndex: 'dataStipula', width: 120, sorter: (a, b) => parseItDate(a.dataStipula) - parseItDate(b.dataStipula) },
    { title: 'Data Decorrenza', dataIndex: 'dataDecorrenza', width: 130, sorter: (a, b) => parseItDate(a.dataDecorrenza) - parseItDate(b.dataDecorrenza) },
    { title: 'Data Scadenza', dataIndex: 'dataScadenza', width: 130, sorter: (a, b) => parseItDate(a.dataScadenza) - parseItDate(b.dataScadenza) },
    { title: 'Canone Locazione (€)', dataIndex: 'canoneLocazioneAnnuo', width: 160, align: 'right', sorter: (a, b) => a.canoneLocazioneAnnuo - b.canoneLocazioneAnnuo, render: fmtEuro },
    { title: 'Autorizzazioni collegate', width: 220, render: (_, r) => {
        const derivate = getAutorizzazioniDerivate(r.spaziCollegati, autorizzazioni);
        return derivate.length === 0
          ? React.createElement('span', { style: { color: 'rgba(0,0,0,0.25)' } }, '—')
          : derivate.map(a => a.identificativoDocumento).join(', ');
      } },
    statoColumn(true),
    actionsColumn('contratto', viewContratto, stubEdit, deleteContratto),
  ]), [autorizzazioni]);

  const handleSaveNewPermit = (kind, record) => {
    if (kind === 'concessione') {
      setConcessioni(prev => [record, ...prev]);
      messageApi.success('Concessione creata');
    } else if (kind === 'autorizzazione') {
      setAutorizzazioni(prev => [record, ...prev]);
      messageApi.success('Autorizzazione creata');
    } else {
      setContratti(prev => [record, ...prev]);
      messageApi.success('Contratto Privato creato');
    }
    setNewPermitType(null);
  };

  // v2 — la Concessione è solo atto di diritto pubblico (nota 'concessione-solo-pubblica'):
  // i record storici con tipologia 'Privato' restano nello stato condiviso (v1 li mostra
  // invariati) ma sono filtrati dalla vista Concessioni v2 — la loro controparte vive già,
  // migrata, su Contratti Privati (vedi MOCK_CONTRATTI, record con `migrata: true`).
  const concessioniVisibili = isV2 ? concessioni.filter(c => c.tipologia !== 'Privato') : concessioni;

  const concessioniKpis = useMemo(() => {
    if (!isV2) return null;
    const attive = concessioniVisibili.filter(c => c.stato === 'Attiva');
    const scadute = concessioniVisibili.filter(c => c.stato === 'Scaduta');
    return [
      { icon: FileTextOutlined, label: 'Totale concessioni', value: concessioniVisibili.length },
      {
        icon: CheckCircleOutlined, label: 'Attive', value: attive.length,
        valueExtra: `${fmtEuro(attive.reduce((s, c) => s + c.totaleCanone, 0))} canone/anno`,
      },
      { icon: ClockCircleOutlined, label: 'Scadute', value: scadute.length },
    ];
  }, [isV2, concessioniVisibili]);

  const autorizzazioniKpis = useMemo(() => {
    if (!isV2) return null;
    const attive = autorizzazioni.filter(a => a.stato === 'Attiva');
    const scadute = autorizzazioni.filter(a => a.stato === 'Scaduta');
    return [
      { icon: FileTextOutlined, label: 'Totale autorizzazioni', value: autorizzazioni.length },
      {
        icon: CheckCircleOutlined, label: 'Attive', value: attive.length,
        valueExtra: `${fmtEuro(attive.reduce((s, a) => s + a.cup, 0))} CUP/anno`,
      },
      { icon: ClockCircleOutlined, label: 'Scadute', value: scadute.length },
    ];
  }, [isV2, autorizzazioni]);

  const contrattiKpis = useMemo(() => {
    if (!isV2) return null;
    const attivi = contratti.filter(c => c.stato === 'Attiva');
    const scaduti = contratti.filter(c => c.stato === 'Scaduta');
    return [
      { icon: FileTextOutlined, label: 'Totale contratti', value: contratti.length },
      {
        icon: CheckCircleOutlined, label: 'Attivi', value: attivi.length,
        valueExtra: `${fmtEuro(attivi.reduce((s, c) => s + c.canoneLocazioneAnnuo, 0))} canone/anno`,
      },
      { icon: ClockCircleOutlined, label: 'Scaduti', value: scaduti.length },
    ];
  }, [isV2, contratti]);

  // v2 — card KPI rimosse temporaneamente su richiesta esplicita (sostituite dal box
  // esplicativo sotto l'intestazione, entityGlossaryBox): *Kpis restano calcolate ma non
  // passate a TableComponent, così la reintroduzione è solo riaggiungere la prop `kpis`.
  const concessioniTab = {
    key: 'concessioni', label: 'Concessioni',
    children: React.createElement(TableComponent, {
      dataSource: concessioniVisibili, columns: concessioniColumns,
      totalLabel: concessioniVisibili.length === 1 ? 'Concessione' : 'Concessioni', rowKey: 'id',
      onRowClick: viewConcessione, tableClassName: 'grav-concessioni-table',
    }),
  };
  const autorizzazioniTab = {
    key: 'autorizzazioni', label: 'Autorizzazioni',
    children: React.createElement(TableComponent, {
      dataSource: autorizzazioni, columns: autorizzazioniColumns,
      totalLabel: autorizzazioni.length === 1 ? 'Autorizzazione' : 'Autorizzazioni', rowKey: 'id',
      onRowClick: viewAutorizzazione, tableClassName: 'grav-autorizzazioni-table',
    }),
  };
  // v2 — ordine Autorizzazione, Concessione, Contratto Privato, su richiesta esplicita;
  // v1 resta Concessioni, Autorizzazioni, invariato.
  const tabItems = [
    ...(isV2 ? [autorizzazioniTab, concessioniTab] : [concessioniTab, autorizzazioniTab]),
    ...(isV2 ? [{
      key: 'contratti', label: 'Contratti Privati',
      children: React.createElement(TableComponent, {
        dataSource: contratti, columns: contrattiColumns,
        totalLabel: contratti.length === 1 ? 'Contratto' : 'Contratti', rowKey: 'id',
        onRowClick: viewContratto, tableClassName: 'grav-contratti-table',
      }),
    }] : []),
  ];

  const currentRecord = viewState.page === 'detail'
    ? (listByKind[viewState.kind] || []).find(r => r.id === viewState.id)
    : null;

  const newPermitMenu = {
    trigger: ['click'],
    menu: {

        React.createElement('div', { style: { display: 'flex', alignItems: 'center' } },
          React.createElement(Title, { level: 3, style: { margin: 0, lineHeight: '32px' } }, 'Lista Permessi'),
        ),

          React.createElement(Button, { id: 'grav-tour-new-permit-btn', type: 'primary', icon: React.createElement(PlusOutlined) },
            'Nuovo Permesso ', React.createElement(DownOutlined),

    : React.createElement('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 20 } },
        React.createElement('div', { style: { display: 'flex', alignItems: 'center' } },
          React.createElement(Title, { level: 2, style: { margin: 0 } }, 'Lista Permessi'),
          React.createElement(HandoffDesignNote, { id: 'prototipo-a-posteriori', placement: 'right' }),
        ),
        React.createElement(Dropdown, newPermitMenu,
          React.createElement(Button, { id: 'grav-tour-new-permit-btn', type: 'primary', size: 'large' },
            'Nuovo Permesso ', React.createElement(DownOutlined),
          ),
        ),
      );

  // v2 — box esplicativo sotto l'intestazione: definisce le 3 entità (Autorizzazione,
  // Concessione, Contratto Privato ora hanno regime giuridico diverso, nota
  // 'concessione-solo-pubblica') prima che l'utente scelga quale creare/consulti la lista.
  // Layout a 3 colonne (stesso ordine Autorizzazione/Concessione/Contratto Privato di
  // tutta la UI v2) invece di righe impilate: sfrutta la larghezza del viewport desktop
  // e riduce l'altezza del banner a 2 righe di testo invece di 4.
  const GLOSSARY_ENTRIES = [
    { term: 'Autorizzazione', def: 'Atto amministrativo che abilita l\'installazione su un\'area soggetta a un vincolo specifico (comunale, viabilità extraurbana, paesaggistico-culturale, area ferroviaria, genio civile); comporta un CUP.' },
    { term: 'Concessione', def: 'Atto di diritto pubblico con cui un ente pubblico concede l\'uso di un bene demaniale o patrimoniale indisponibile (es. suolo pubblico); mai con un privato.' },

  const entityGlossaryBox = isV2 && React.createElement(Alert, {
    className: 'grav-permit-entity-glossary', type: 'info', showIcon: false, closable: true,

    style: { marginBottom: 20, padding: '14px 16px', background: '#fff', border: '1px dashed #D9D9D9' },

        key: e.term,

          borderLeft: i > 0 ? '1px solid rgba(0,0,0,0.1)' : 'none',
          paddingLeft: i > 0 ? 24 : 0,

      },
        React.createElement('div', { style: { fontSize: 12.5, fontWeight: 600, color: 'rgba(0,0,0,0.85)', marginBottom: 3 } }, e.term),
        React.createElement('div', { style: { fontSize: 12.5, color: 'rgba(0,0,0,0.55)', lineHeight: 1.6 } }, e.def),
      )),

  const listView = React.createElement(React.Fragment, null,
    listHeader,
    entityGlossaryBox,
    React.createElement(Tabs, { type: 'line', items: tabItems, activeKey: activeTab, onChange: setActiveTab }),
  );

  const detailView = currentRecord && React.createElement(PermitDetailPage, {
    record: currentRecord,
    kind: viewState.kind,
    isV2,
    concessioniList: concessioni,
    autorizzazioniList: autorizzazioni,
    contrattiList: contratti,
    onBack: () => setViewState({ page: 'list' }),
    onConnettiSpazi: (nuoviSpazi) => connettiSpazi(viewState.kind, viewState.id, nuoviSpazi),
    onScollegaSpazio: (spazioId) => scollegaSpazio(viewState.kind, viewState.id, spazioId),
    onSetStatoOverride: (nextOverride) => setStatoOverride(viewState.kind, viewState.id, nextOverride),
  });

  return React.createElement(ConfigProvider, { theme: window.GRAVITY_THEME },
    React.createElement(AntApp, null,
      contextHolder,
      React.createElement('div', { className: 'app-shell' },
        React.createElement(window.GravityNavbar, null),
        React.createElement('div', { className: isV2 ? 'lic-content lic-v2' : 'lic-content' },
          viewState.page === 'detail' && currentRecord ? detailView : listView,
        ),
      ),

      React.createElement(PermitFormDrawer, {
        open: !!newPermitType, type: newPermitType, isV2,
        concessioniList: concessioni, autorizzazioniList: autorizzazioni, contrattiList: contratti,
        onClose: () => setNewPermitType(null),
        onSave: handleSaveNewPermit,
      }),
    ),
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(AppRoot));
</script>
<!-- Motore handoff — caricato solo se il loader in <head> ha attivato il layer. -->
<script>
  if (window.__HANDOFF_ACTIVE) document.write('<scr' + 'ipt src="../_shared/handoff.js"></scr' + 'ipt>');
</script>
<script>
  // Riparenta lo slot della dev bar su <body>: dentro <nav> (position:sticky,
  // z-index:100) resta intrappolato nel suo stacking context e nessun z-index
  // interno può superare i Drawer del prototipo (z-index:1000). Attivo solo in
  // modalità handoff (vedi loader in <head>). Pattern identico a inventory-systems.
  if (window.__HANDOFF_ACTIVE) {
    setInterval(function () {
      var slot = document.getElementById('ghf-nav-slot');
      if (!slot) return;
      if (slot.parentElement !== document.body) document.body.appendChild(slot);
      // GravitySectionDrawer (Autorizzazione v2): lascia vincere la regola CSS
      // body:has(.grav-section-drawer-nav) invece della misura generica sul bordo
      // sinistro — stesso pattern di inventory-systems per il suo drawer full-screen.
      if (document.querySelector('.grav-section-drawer-nav')) {
        slot.style.right = '';
        return;
      }
      var openDrawer = document.querySelector('.ant-drawer-open .ant-drawer-content');
      if (openDrawer) {
        var left = openDrawer.getBoundingClientRect().left;
        var desired = window.innerWidth - left + 16;
        var maxRight = window.innerWidth - slot.getBoundingClientRect().width - 8;
        slot.style.right = Math.min(desired, maxRight) + 'px';
      } else {
        slot.style.right = '';
      }
    }, 300);
  }
</script>
</body>
