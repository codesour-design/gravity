const { useState, useEffect, useRef } = React;

// ── Helpers ───────────────────────────────────────────────────────────────────
const EUR = (n) => new Intl.NumberFormat('it-IT', { minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(n) + ' €';
const parseDate = s => { if (!s) return null; const [d, m, y] = s.split('/'); return new Date(+y, +m - 1, +d); };

const AVATAR_PALETTE = [
  { bg: '#F0EAFF', fg: '#3E00FB' },
  { bg: '#E6F7FF', fg: '#0958D9' },
  { bg: '#FFF7E6', fg: '#D46B08' },
  { bg: '#F6FFED', fg: '#389E0D' },
];
function nameColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
  return AVATAR_PALETTE[Math.abs(h) % AVATAR_PALETTE.length];
}
function AdvertiserAvatar({ name, size = 24 }) {
  const initials = name.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  const { bg, fg } = nameColor(name);
  return React.createElement(Avatar, {

    style: { background: bg, color: fg, fontWeight: 700, fontSize: size * 0.38, flexShrink: 0 },
  }, initials);
}

// ── DataCard — riuso del pattern brief di negotiations/planning ───────────────
function DataCard({ icon: Icon, label, value, footer, size }) {
  return React.createElement('div', {

      background: 'var(--gravity-bg-container)',

    )

}

// ── MiniCalendar — identico al brief di Planning (stesso componente, stessa API) ─
function MiniCalendar({ start, end }) {
  const DAY_LABELS  = ['Do', 'Lu', 'Ma', 'Me', 'Gi', 'Ve', 'Sa'];
  const MONTH_NAMES = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

  const startDate = parseDate(start);
  const endDate   = parseDate(end);

  const [viewYear,  setViewYear]  = useState(startDate.getFullYear());
  const [viewMonth, setViewMonth] = useState(startDate.getMonth());

  const today = new Date();

  const daysInMonth     = new Date(viewYear, viewMonth + 1, 0).getDate();
  const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
  const firstDayOfWeek  = new Date(viewYear, viewMonth, 1).getDay();

  const cells = [];
  for (let i = firstDayOfWeek - 1; i >= 0; i--)
    cells.push({ day: daysInPrevMonth - i, outside: true });
  for (let d = 1; d <= daysInMonth; d++)
    cells.push({ day: d, outside: false });
  let nextDay = 1;
  while (cells.length % 7 !== 0)
    cells.push({ day: nextDay++, outside: true });

  const isCampaign = cell => {
    if (cell.outside) return false;
    const d = new Date(viewYear, viewMonth, cell.day);
    return d >= startDate && d <= endDate;
  };
  const isToday = cell => {
    if (cell.outside) return false;
    return cell.day === today.getDate() &&
           viewMonth === today.getMonth() &&
           viewYear  === today.getFullYear();
  };

  const prevMonth = () => {
    if (viewMonth === 0) { setViewYear(y => y - 1); setViewMonth(11); }
    else setViewMonth(m => m - 1);
  };
  const nextMonth = () => {
    if (viewMonth === 11) { setViewYear(y => y + 1); setViewMonth(0); }
    else setViewMonth(m => m + 1);
  };

  return React.createElement('div', { className: 'mini-cal' },
    React.createElement('div', { className: 'mini-cal-header' },
      React.createElement('button', { onClick: prevMonth },
        React.createElement(LeftOutlined, { style: { fontSize: 10 } })),
      React.createElement(Text, { style: { fontSize: 12, fontWeight: 500 } },
        `${MONTH_NAMES[viewMonth]} ${viewYear}`),
      React.createElement('button', { onClick: nextMonth },
        React.createElement(RightOutlined, { style: { fontSize: 10 } }))
    ),
    React.createElement('div', { className: 'mini-cal-grid' },
      ...DAY_LABELS.map(d =>
        React.createElement('div', { key: d, className: 'mini-cal-day-label' }, d)
      ),
      ...cells.map((cell, i) => {
        const campaign  = isCampaign(cell);
        const todayCell = isToday(cell);
        let outerCls = 'mini-cal-cell';
        let innerCls = 'mini-cal-day';
        if (cell.outside) outerCls += ' outside';
        if (campaign)     outerCls += ' in-range';
        if (todayCell)    innerCls += ' today';
        return React.createElement('div', { key: i, className: outerCls },
          React.createElement('div', { className: innerCls }, cell.day)
        );
      })
    ),
    React.createElement('div', { className: 'mini-cal-footer' },
      React.createElement('span', null,
        React.createElement('span', { className: 'mini-cal-footer-label' }, 'Inizio: '), start),
      React.createElement('span', null,
        React.createElement('span', { className: 'mini-cal-footer-label' }, 'Fine: '), end)
    )
  );
}

// ── GravityPageHeader — riuso del componente di negotiations ─────────────────
function GravityPageHeader({ backLabel, onBack, title, entityName, tag, meta, actions }) {

// ── Dati mock — Campagna DOOH in erogazione ───────────────────────────────────
// Una campagna nasce dall'unione di due cose distinte: gli spazi (impianti) già

const CAMPAIGN = {

// ── Impianti pianificati (arrivano dalla Pianificazione, non si scelgono qui) ──
// Una pianificazione può contenere centinaia di impianti: il modello resta lo
// stesso di Planning/Inventory (lat/lng, tipo, stato) per riusare mappa e
// clustering condivisi (GravityMap) invece di reinventarli.
const DOOH_ZONES = [
  { name: 'Via Libertà',        lat: 38.1245, lng: 13.3553 },
  { name: 'Politeama',          lat: 38.1218, lng: 13.3565 },
  { name: 'Via Roma',           lat: 38.1170, lng: 13.3612 },
  { name: 'Stazione Centrale',  lat: 38.1105, lng: 13.3630 },
  { name: 'Via Maqueda',        lat: 38.1160, lng: 13.3608 },
  { name: 'Zisa',               lat: 38.1210, lng: 13.3420 },
  { name: 'Kalsa',              lat: 38.1155, lng: 13.3720 },
  { name: 'Libertà Nord',       lat: 38.1320, lng: 13.3500 },
  { name: 'Borgo Vecchio',      lat: 38.1260, lng: 13.3680 },

];

// I formati DOOH sono legati alla risoluzione dello schermo (video, non stampa):
// pochi rispetto all'OOH — qui solo 3, uno per tipologia di impianto.
const DOOH_TYPE_FORMAT = [
  { type: 'Totem',     formato: '1920×1080' },
  { type: 'Alux',      formato: '1080×1920' },
  { type: 'Billboard', formato: '3840×2160' },
];

const FORMAT_LABELS = {
  '1920×1080': 'Landscape · Totem',
  '1080×1920': 'Portrait · Alux',
  '3840×2160': 'UHD · Billboard',
};

function buildDoohSystems() {
  const named = [
    { id: 'D001', nome: 'Totem Via Libertà',        type: 'Totem',     address: 'Via Libertà, 82',        lat: 38.1245, lng: 13.3553, faces: 2, formato: '1920×1080', state: 'active' },
    { id: 'D002', nome: 'Alux Piazza Politeama',     type: 'Alux',      address: 'Piazza Ruggero Settimo', lat: 38.1218, lng: 13.3565, faces: 1, formato: '1080×1920', state: 'active' },
    { id: 'D003', nome: 'Billboard Via Roma',        type: 'Billboard', address: 'Via Roma, 320',          lat: 38.1170, lng: 13.3612, faces: 1, formato: '3840×2160', state: 'active' },
    { id: 'D004', nome: 'Totem Stazione Centrale',   type: 'Totem',     address: 'Piazza Giulio Cesare',   lat: 38.1105, lng: 13.3630, faces: 2, formato: '1920×1080', state: 'active' },
    { id: 'D005', nome: 'Alux Via Maqueda',          type: 'Alux',      address: 'Via Maqueda, 148',       lat: 38.1160, lng: 13.3608, faces: 1, formato: '1080×1920', state: 'maintenance' },
  ];

  // Genera il resto in modo deterministico (nessun Math.random) per dimostrare
  // la scala reale di una pianificazione — decine/centinaia di impianti da
  // vedere in lista e in mappa, non solo i 5 "featured" sopra.
  const EXTRA_COUNT = 37; // totale 42 impianti
  const extra = [];
  for (let i = 0; i < EXTRA_COUNT; i++) {
    const zone = DOOH_ZONES[i % DOOH_ZONES.length];
    const tf   = DOOH_TYPE_FORMAT[i % DOOH_TYPE_FORMAT.length];
    const angle  = ((i * 47) % 360) * (Math.PI / 180);
    const radius = 0.006 + (i % 5) * 0.0015;
    extra.push({
      id: `D${100 + i}`,
      nome: `${tf.type} ${zone.name} ${Math.floor(i / DOOH_ZONES.length) + 1}`,
      type: tf.type,
      address: `Zona ${zone.name}`,
      lat: zone.lat + Math.sin(angle) * radius,
      lng: zone.lng + Math.cos(angle) * radius * 1.25,
      faces: (i % 3 === 0) ? 2 : 1,
      formato: tf.formato,
      state: (i % 9 === 0) ? 'maintenance' : 'active',
    });
  }
  return [...named, ...extra];
}
const DOOH_SYSTEMS = buildDoohSystems();
const FORMATS = [...new Set(DOOH_SYSTEMS.map(s => s.formato))];

const LOOP_DURATION_MS = 15000; // durata loop simulata della creatività

// ── Vista 1 — Dettaglio campagna: creatività + impianti pianificati + espletamento
// Una campagna nasce dall'unione di Pianificazione (spazi, già assegnati altrove)
// e Creatività (caricate qui, una per formato schermo). L'espletamento si sblocca
// automaticamente non appena entrambi i requisiti sono soddisfatti — nessun click
// o passaggio a parte.
// ── Mappa DOOH condivisa (tab Pianificazione + tab Espletamento) ──────────────
// Stessa palette e stesso motore di clustering di Planning e Inventario impianti
// (GravityMap), per reggere le centinaia di impianti che una pianificazione
// reale può contenere. onMarkerClick/getSelectedId sono opzionali: la mappa di
// Pianificazione è di sola consultazione, quella di Espletamento è selezionabile
// (seleziona l'impianto mostrato nel player).
function mountDoohMap(container, { onMarkerClick, getSelectedId } = {}) {
  const map = L.map(container, { zoomControl: true }).setView([38.118, 13.361], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(map);

  const latlngs = DOOH_SYSTEMS.map(s => [s.lat, s.lng]);
  if (latlngs.length) map.fitBounds(L.latLngBounds(latlngs), { padding: [40, 40] });

  const stateFile = (s) => s.state === 'maintenance' ? 'maintenance' : 'active';
  let markers = {};
  const clearMarkers = () => { Object.values(markers).forEach(m => map.removeLayer(m)); markers = {}; };

  const addSingleMarker = (s) => {
    const src = window.GravityMap.markerSrc(s.type, stateFile(s), 'DOOH');
    const icon = window.GravityMap.makeMarkerIcon({
      src, zoom: map.getZoom(),
      flags: { isSelected: getSelectedId ? s.id === getSelectedId() : false },
    });
    const marker = L.marker([s.lat, s.lng], { icon, title: s.nome }).addTo(map);
    if (onMarkerClick) marker.on('click', () => onMarkerClick(s.id));
    markers[s.id] = marker;
  };

  const render = () => {
    clearMarkers();
    const items = DOOH_SYSTEMS.map(s => ({ id: s.id, position: { lat: s.lat, lng: s.lng }, sys: s }));
    const result = window.GravityMap.computeGridClusters(map, items);
    result.clusters.forEach((cl, i) => {
      const { url, size } = window.GravityMap.makeClusterSvg(cl.members.length, {});
      const icon = L.icon({ iconUrl: url, iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
      const marker = L.marker([cl.center.lat, cl.center.lng], { icon }).addTo(map);
      marker.on('click', () => window.GravityMap.fitBoundsToMembers(map, cl.members));
      markers['cluster-' + i] = marker;
    });
    result.members.forEach(it => addSingleMarker(it.sys));
  };

  const srcs = [...new Set(DOOH_SYSTEMS.map(s => window.GravityMap.markerSrc(s.type, stateFile(s), 'DOOH')))];
  window.GravityMap.preloadAll(srcs).then(render);
  map.on('zoomend', render);

  return { map, render, destroy: clearMarkers };
}

                React.createElement(Button, {
                  type: 'text', danger: true, size: 'small',
                  icon: React.createElement(DeleteOutlined),
                  onClick: () => onRemoveFormat(formato),
                })
              )
        );
      })
    )
  );

  // ── Tab: Pianificazione — impianti assegnati, in lista o in mappa ───────────
  const pianificazioneTab = React.createElement(React.Fragment, null,
    React.createElement('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 } },
      React.createElement(Text, { type: 'secondary', style: { fontSize: 12 } },
        `Da pianificazione: ${CAMPAIGN.planningRef.id} — ${CAMPAIGN.planningRef.nome} · ${DOOH_SYSTEMS.length} impianti DOOH`
      ),
      React.createElement(Segmented, {
        value: impiantiView,
        onChange: setImpiantiView,
        options: [{ label: 'Lista', value: 'lista' }, { label: 'Mappa', value: 'mappa' }],
      })
    ),
    impiantiView === 'lista'
      ? React.createElement(Table, {
          dataSource: DOOH_SYSTEMS,
          columns: listColumns,
          rowKey: 'id',
          size: 'middle',
          pagination: { pageSize: 8, showSizeChanger: false },
        })
      : React.createElement('div', { ref: pianMapContainerRef, className: 'cf-map' })
  );

  return React.createElement('div', { className: 'page-content' },
    React.createElement(GravityPageHeader, {
      backLabel: 'Campagne',
      onBack,
      title: 'Configuratore Campagna',
      entityName: CAMPAIGN.nome,
      tag: React.createElement(Tag, { color: 'magenta' }, 'DOOH'),
      meta: [
        { label: 'Inserzionista', value: CAMPAIGN.inserzionista },
        { label: 'Periodo', value: `${CAMPAIGN.start} – ${CAMPAIGN.end}` },
        {
          label: 'Stato',
          value: React.createElement('span', {
            style: { display: 'inline-flex', alignItems: 'center', gap: 5 },
          },
            React.createElement('span', { style: { width: 7, height: 7, borderRadius: '50%', background: statoInfo.color, display: 'inline-block' } }),
            statoInfo.label
          ),
        },
      ],
      actions: [
        espletamentoAttivo
          ? React.createElement(Tag, { key: 'attivo', color: 'success', icon: React.createElement(CheckCircleFilled), style: { marginTop: 4, padding: '4px 10px', fontSize: 13 } }, 'Espletamento attivo')
          : React.createElement(Tooltip, {
              key: 'avvia',
              title: requisitiOk ? '' : `Formati mancanti: ${missingFormats.join(', ')}`,
            },
              React.createElement(Button, {
                type: 'primary',
                disabled: !requisitiOk,
                icon: React.createElement(PlayCircleOutlined),
                onClick: onAvviaEspletamento,
              }, 'Avvia Espletamento')
            ),
      ],
    }),

    React.createElement('div', { style: { display: 'flex', gap: 16, alignItems: 'flex-start' } },
      React.createElement(BriefSidebar, { campaign: CAMPAIGN }),

      React.createElement('div', { className: 'cf-section', style: { flex: 1, minWidth: 0, marginBottom: 0 } },
        React.createElement(Tabs, {
          activeKey: activeTab,
          onChange: setActiveTab,
          destroyInactiveTabPane: true,
          items: [
            { key: 'espletamento',   label: 'Espletamento',   children: espletamentoTab },
            { key: 'creativita',     label: 'Creatività',     children: creativitaTab },
            { key: 'pianificazione', label: 'Pianificazione', children: pianificazioneTab },
          ],
        })
      )
    )
  );
}

function MetaRow({ icon: Icon, label, value }) {
  return React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
    React.createElement('span', { style: { display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 12, color: 'rgba(0,0,0,0.45)' } },
      React.createElement(Icon, { style: { fontSize: 12 } }),
      label
    ),
    React.createElement('span', { style: { fontSize: 13, fontWeight: 500, color: 'rgba(0,0,0,0.88)' } }, value)
  );
}

// ── AppRoot ───────────────────────────────────────────────────────────────────
function AppRoot() {
  const [view, setView] = useState('lista'); // 'lista' | 'dettaglio'
  const [creativesByFormat, setCreativesByFormat] = useState({});
  const [selectedId, setSelectedId] = useState(DOOH_SYSTEMS[0].id);
  const [espletamentoAvviato, setEspletamentoAvviato] = useState(false);

  return React.createElement(ConfigProvider, { theme: window.GRAVITY_THEME },
    React.createElement(App, null,
      React.createElement('div', { className: 'app-shell' },
        React.createElement(window.GravityNavbar),
        view === 'lista'
          ? React.createElement(CampagneListView, {
              onOpenCampaign: () => setView('dettaglio'),
            })
          : React.createElement(CampagnaDettaglioView, {
              creativesByFormat,
              onUploadFormat: (formato, data) => setCreativesByFormat(prev => ({ ...prev, [formato]: data })),
              onRemoveFormat: (formato) => {
                // Rimuovere una creatività invalida i requisiti: l'espletamento
                // eventualmente già avviato va riconfermato esplicitamente.
                setEspletamentoAvviato(false);
                setCreativesByFormat(prev => {
                  const next = { ...prev };
                  delete next[formato];
                  return next;
                });
              },
              selectedId,
              onSelect: setSelectedId,
              espletamentoAvviato,
              onAvviaEspletamento: () => setEspletamentoAvviato(true),
              onBack: () => setView('lista'),
            })
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(AppRoot));
</script>
</body>
</html>
